name: Temporary v0.60.22 release rewire
on:
  push:
    branches: [fix/v06022-world-creation-required-semantics]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'rewire v0.60.22 release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06022-world-creation-required-semantics
      - name: Rewire v0.60.22 browser release
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='"./src/version.js?v=60010":"./src/version.js?v=60021",'
          new='"./src/version.js?v=60010":"./src/version.js?v=60022","./src/world-creation.js?v=60010":"./src/v06022-world-creation-hotfix.js?v=60022",'
          if old not in s: raise SystemExit('missing current v0.60.21 version edge')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          for name in ['test/v06011-ja-runtime-coherence.test.js','test/v06014-manual-regressions.test.js','test/v06015-ja-live-regressions.test.js','test/v06019-ja-manual-regressions.test.js','test/version-0551-release.test.js','test/version-ui.test.js']:
            q=Path(name); t=q.read_text(encoding='utf-8'); oldt=t
            t=t.replace('"0.60.21"','"0.60.22"').replace('0\\.60\\.21','0\\.60\\.22')
            t=t.replace('through the v0.60.21 release','through the v0.60.22 release')
            t=t.replace('v0.60.21 import-map','v0.60.22 import-map').replace('v0.60.21 release wiring','v0.60.22 release wiring')
            t=t.replace('Official v0.60.21 release contract','Official v0.60.22 release contract')
            t=t.replace('v0.60.21 is the canonical app and browser cache release','v0.60.22 is the canonical app and browser cache release')
            t=t.replace('// v0.60.21 release contract','// v0.60.22 release contract')
            t=t.replace('version\\.js\\?v=60021','version\\.js\\?v=60022')
            if t!=oldt:q.write_text(t,encoding='utf-8')
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'v06022-world-creation-hotfix.js?v=60022' index.html
          grep -q 'version.js?v=60022' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html test/v06011-ja-runtime-coherence.test.js test/v06014-manual-regressions.test.js test/v06015-ja-live-regressions.test.js test/v06019-ja-manual-regressions.test.js test/version-0551-release.test.js test/version-ui.test.js
          git commit -m "release: rewire v0.60.22 release"
          git push origin HEAD:fix/v06022-world-creation-required-semantics
