name: One-shot runtime grounding consistency

on:
  push:
    branches:
      - fix/runtime-grounding-world-consistency-v05418

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-grounding-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-grounding-world-consistency-v05418
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply runtime consistency fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old,new,1))

          def regex_once(path, pattern, repl, flags=0):
              p=Path(path); s=p.read_text()
              ns,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f"regex matched {n} times in {path}: {pattern[:120]!r}")
              p.write_text(ns)

          # --- State Sync: evidence-gated item / knowledge acquisition and scene-backed location materialization.
          p=Path('src/state-sync.js'); s=p.read_text()
          s=s.replace('const DISCOVERY_SOURCE_KINDS=new Set(["CANON","LOCATION","NPC","EVENT","ITEM"]);','const DISCOVERY_SOURCE_KINDS=new Set(["CANON","LOCATION","NPC","EVENT","ITEM","DOCUMENT"]);')
          old='''export function groundedPickupItemFromAction(action="",roll={}){\n if(roll?.success!==true)return null;\n const q=clean(action,220);if(!q||!PHYSICAL_PICKUP.test(q))return null;\n const m=q.match(/(?:撿(?:起|取|走)?|拾(?:起|取|走)?|拿起|捏起|取下|取走|採集|收集|pick\\s*up|collect|gather)\\s*(?:那|這)?(?:一)?(?:枚|片|個|塊|份|支|把|件|顆|粒|束|瓶|本|張)?\\s*([^，。；、,.;!?！？]{2,28}?)(?=\\s*(?:並|然後|再|後|並且|放入|收入|收進|$))/i);\n if(!m)return null;\n const name=clean(m[1],40).replace(/^(?:地上|桌上|眼前|旁邊|附近)(?:的)?/,"").trim();if(name.length<2||!q.includes(name))return null;\n return {name,description:"由玩家本回合直接拾取的可見物件；詳細性質尚待確認。",category:"MATERIAL",quantity:1,identified:false,evidenceFactId:"",historyRefs:[],craftingTags:[],useEffects:[],checkBonuses:{}}\n}'''
          new='''const normalizeEvidenceText=v=>String(v||"").normalize("NFKC").toLowerCase().replace(/\\s+/g,"");\nfunction evidenceMentions(text,name){const a=normalizeEvidenceText(text),b=normalizeEvidenceText(name);return Boolean(a&&b&&a.includes(b))}\nexport function groundedPickupItemFromAction(action="",roll={},observableText=""){\n if(roll?.success!==true)return null;\n const q=clean(action,220);if(!q||!PHYSICAL_PICKUP.test(q))return null;\n const m=q.match(/(?:撿(?:起|取|走)?|拾(?:起|取|走)?|拿起|捏起|取下|取走|採集|收集|pick\\s*up|collect|gather)\\s*(?:那|這)?(?:一)?(?:枚|片|個|塊|份|支|把|件|顆|粒|束|瓶|本|張)?\\s*([^，。；、,.;!?！？]{2,28}?)(?=\\s*(?:並|然後|再|後|並且|放入|收入|收進|$))/i);\n if(!m)return null;\n const name=clean(m[1],40).replace(/^(?:地上|桌上|眼前|旁邊|附近)(?:的)?/,"").trim();if(name.length<2||!q.includes(name)||!evidenceMentions(observableText,name))return null;\n return {name,description:"由本回合可見敘事確認並由玩家成功拾取的物件；詳細性質尚待確認。",category:"MATERIAL",quantity:1,identified:false,evidenceFactId:"",historyRefs:[],craftingTags:[],useEffects:[],checkBonuses:{}}\n}'''
          if old not in s: raise SystemExit('groundedPickupItemFromAction block not found')
          s=s.replace(old,new,1)
          s=s.replace('sourceKind":"CANON|LOCATION|NPC|EVENT|ITEM"','sourceKind":"CANON|LOCATION|NPC|EVENT|ITEM|DOCUMENT"')
          start=s.index('function discoverySourceGrounded(state,raw){')
          end=s.index('function semanticWorldImpact(raw){',start)
          replacement='''function sourceEvidenceText(state,raw,context={}){\n const direct=clean(context?.observableText,2400),sourceKind=String(raw?.sourceKind||"").toUpperCase(),sourceId=clean(raw?.sourceId,120),registry=state?.world?.registry||{};\n const out=[];if(direct)out.push(direct);\n if(sourceKind==="NPC")for(const e of (state?.events||[]).slice(-12))if(e?.type==="NPC_CONVERSATION"&&e?.npcId===sourceId&&e?.visibility!=="INTERNAL")out.push(clean(e.summary,900));\n if(sourceKind==="DOCUMENT"){const doc=(state?.world?.documents?.documents||[]).find(x=>x?.id===sourceId&&x?.read===true);if(doc)out.push([doc.title,...(doc.claims||[]).map(x=>x?.text)].filter(Boolean).join(" "))}\n if(sourceKind==="ITEM"){const item=(state?.inventory||[]).find(x=>x?.id===sourceId);if(item)out.push([item.name,item.description].filter(Boolean).join(" "))}\n if(sourceKind==="EVENT"){const event=(state?.events||[]).find(x=>x?.id===sourceId&&x?.visibility!=="INTERNAL");if(event)out.push(clean(event.summary,900))}\n return out.join("\\n")\n}\nfunction discoverySourceGrounded(state,raw){\n const sourceKind=String(raw?.sourceKind||"").toUpperCase(),sourceId=clean(raw?.sourceId,120),registry=state?.world?.registry||{},current=currentLocationRecord(state);\n if(!DISCOVERY_SOURCE_KINDS.has(sourceKind)||!sourceId)return false;\n if(sourceKind==="CANON"){\n  const factId=clean(raw?.factId,120);return factId===sourceId&&(state?.world?.canon?.facts||[]).some(f=>f?.id===sourceId&&String(f?.visibility||"").toLowerCase()==="public")\n }\n if(sourceKind==="LOCATION")return Boolean(current&&(current.id===sourceId||current.name===sourceId));\n if(sourceKind==="NPC"){\n  const npc=(registry.npcs||[]).find(x=>x?.id===sourceId),lock=String(npc?.visibilityLock||"").toUpperCase(),visible=Boolean(npc&&(npc.known===true||npc.encountered===true||["OBSERVED","KNOWN","REVEALED"].includes(lock)));\n  const present=Boolean(npc&&current&&(npc.locationId===current.id||npc.locationName===current.name||npc.location===current.name));\n  return visible&&present\n }\n if(sourceKind==="EVENT")return (state?.events||[]).some(e=>e?.id===sourceId&&e?.visibility!=="INTERNAL");\n if(sourceKind==="ITEM")return (state?.inventory||[]).some(i=>i?.id===sourceId);\n if(sourceKind==="DOCUMENT")return (state?.world?.documents?.documents||[]).some(d=>d?.id===sourceId&&d?.read===true);\n return false\n}\nfunction discoveryNameGrounded(state,raw,context={}){\n const title=clean(raw?.title,100);return Boolean(title&&evidenceMentions(sourceEvidenceText(state,raw,context),title))\n}\nfunction acquiredItemGrounded(raw,context={}){\n const name=clean(raw?.item?.name,100);return Boolean(name&&evidenceMentions(context?.observableText,name))\n}\nfunction travelIntentGrounded(context={},action=""){\n const kind=String(context?.intent?.kind||context?.roll?.profile?.kind||"").toUpperCase();return kind==="TRAVEL"||/前往|移動|走向|走到|進入|抵達|沿著|循著|travel|move|go to|enter/i.test(action)\n}\nexport function groundStatePatch(state,patch={},context={}){\n const next=structuredClone(patch||{}),accepted=[],rejected=[],deferredEvidence=[],action=clean(context?.action,220),ops=Array.isArray(next.operations)?next.operations:[],generatedLocations=new Set(ops.filter(x=>String(x?.op||"").toUpperCase()==="GENERATE_CONTENT").flatMap(x=>(x?.generation?.locations||[]).flatMap(loc=>[clean(loc?.id,120),clean(loc?.name,120)])).filter(Boolean));\n for(const [index,raw] of ops.entries()){\n  const type=String(raw?.op||"").toUpperCase();\n  if(type==="DISCOVER_FACT"){\n   if(!discoverySourceGrounded(state,raw)){rejected.push({index,op:type,sourceKind:String(raw?.sourceKind||"").toUpperCase(),sourceId:clean(raw?.sourceId,120),reason:"DISCOVERY_SOURCE_NOT_OBSERVABLE"});continue}\n   if(!discoveryNameGrounded(state,raw,context)){rejected.push({index,op:type,title:clean(raw?.title,100),reason:"KNOWLEDGE_NAME_NOT_OBSERVED"});deferredEvidence.push(structuredClone(raw));continue}\n  }\n  if(type==="ACQUIRE_ITEM"&&!acquiredItemGrounded(raw,context)){rejected.push({index,op:type,itemName:clean(raw?.item?.name,100),reason:"ITEM_NAME_NOT_OBSERVED"});deferredEvidence.push(structuredClone(raw));continue}\n  if(type==="MOVE_PLAYER"){\n   const target=clean(raw?.location,120),current=clean(state?.player?.location||state?.world?.state?.location,120),locations=state?.world?.registry?.locations||[],entity=locations.find(x=>x?.id===target||x?.name===target);\n   if(!target){rejected.push({index,op:type,location:target,reason:"MOVE_TARGET_NOT_CANONICAL"});continue}\n   if(!entity&&!generatedLocations.has(target)){\n    const observable=clean(context?.observableText,2400);\n    if(travelIntentGrounded(context,action)&&evidenceMentions(observable,target)){\n     accepted.push({...raw,materializeLocation:{name:target,type:"可到達地點",region:clean(state?.world?.state?.region,80),description:`「${target}」已在本回合可見敘事中被確認為可實際前往的地點。`,known:true}});continue\n    }\n    rejected.push({index,op:type,location:target,reason:"MOVE_TARGET_NOT_CANONICAL"});if(travelIntentGrounded(context,action))deferredEvidence.push(structuredClone(raw));continue\n   }\n   if(entity&&(entity?.name===current||entity?.id===current)){rejected.push({index,op:type,location:target,reason:"MOVE_TARGET_UNCHANGED"});continue}\n  }\n  accepted.push(raw)\n }\n next.operations=accepted;return {patch:next,rejected,deferredEvidence}\n}\n'''
          s=s[:start]+replacement+s[end:]
          old_move='''else if(type==="MOVE_PLAYER")c.location=clean(raw.location,120);'''
          new_move='''else if(type==="MOVE_PLAYER"){if(raw.materializeLocation){c.generation??={locations:[],npcs:[],factions:[],sideQuests:[]};c.generation.locations??=[];c.generation.locations.push(structuredClone(raw.materializeLocation))}c.location=clean(raw.location,120)};'''
          if old_move not in s: raise SystemExit('MOVE_PLAYER candidate mapping not found')
          s=s.replace(old_move,new_move,1)
          p.write_text(s)

          # --- Local NPCs become interactable on first contact; first local conversation marks encounter/visibility.
          replace_once('src/world-registry.js',
            'export function npcInteractionMode(state,npc){if(!npc||npc.known!==true||npc.encountered!==true||npc.alive===false)return null;if(isNpcPresent(state,npc))return "LOCAL";if(canRemoteContactNpc(state,npc))return "REMOTE";return null}',
            'export function npcInteractionMode(state,npc){if(!npc||npc.known!==true||npc.alive===false)return null;if(isNpcPresent(state,npc))return "LOCAL";if(npc.encountered===true&&canRemoteContactNpc(state,npc))return "REMOTE";return null}')
          replace_once('src/npc-conversation.js',
            'import {deriveSceneTitle} from "./runtime-guard.js?v=54017";\nimport {roleplayFallbackSuggestions} from "./player-experience.js?v=54017";',
            'import {deriveSceneTitle} from "./runtime-guard.js?v=54017";\nimport {roleplayFallbackSuggestions} from "./player-experience.js?v=54017";\nimport {markEntityObserved} from "./visibility-lock.js?v=54017";')
          replace_once('src/npc-conversation.js',
            ' const mode=npcInteractionMode(state,npc);if(!mode)throw new Error("NPC_CONTACT_UNAVAILABLE");\n const minutes=npcConversationMinutes(state,mode),before=state.world.state.clock?.totalMinutes||0;',
            ' const mode=npcInteractionMode(state,npc);if(!mode)throw new Error("NPC_CONTACT_UNAVAILABLE");\n const firstEncounter=mode==="LOCAL"&&npc.encountered!==true;if(mode==="LOCAL"){npc.known=true;npc.encountered=true;markEntityObserved(state,"npc",npc.id,{reason:"NPC_LOCAL_CONVERSATION"})}\n const minutes=npcConversationMinutes(state,mode),before=state.world.state.clock?.totalMinutes||0;')
          replace_once('src/npc-conversation.js',
            ' const event={id:id(),type:"NPC_CONVERSATION",visibility:"PLAYER_KNOWN",npcId:npc.id,mode,summary,day:state.world.state.day,time:String(state.world.state.clock.hour).padStart(2,"0")+":"+String(state.world.state.clock.minute).padStart(2,"0"),minutes,at:Date.now()};',
            ' const event={id:id(),type:"NPC_CONVERSATION",visibility:"PLAYER_KNOWN",npcId:npc.id,mode,firstEncounter,summary,day:state.world.state.day,time:String(state.world.state.clock.hour).padStart(2,"0")+":"+String(state.world.state.clock.minute).padStart(2,"0"),minutes,at:Date.now()};')

          # --- Economy: derive global economy truth from actual regional trade profiles.
          p=Path('src/world-locality.js'); s=p.read_text()
          append='''\nexport function reconcileWorldEconomy(state){\n state.world??={};const profiles=[];for(const row of [...(state.world?.registry?.locations||[]),...(state.world?.registry?.factions||[])])if(row?.trade&&typeof row.trade==="object")profiles.push(row.trade);\n const currencies=new Map();for(const trade of profiles)for(const c of trade?.currencies||[])if(c?.id&&c?.name&&!currencies.has(c.id))currencies.set(c.id,{id:c.id,name:c.name,symbol:c.symbol||"",issuer:c.issuer||"",description:c.description||""});\n const list=[...currencies.values()],modes=[...new Set(profiles.map(x=>x?.mode).filter(Boolean))],questReward=Math.max(0,...profiles.map(x=>Number(x?.questReward)||0)),combatReward=Math.max(0,...profiles.map(x=>Number(x?.combatReward)||0));\n state.world.economy={...(state.world.economy||{}),currencyExists:list.length>0,currencyModel:list.length?(list.length>1?"REGIONAL_MULTI_CURRENCY":"REGIONAL_CURRENCY"):"NO_CURRENCY",currencies:list,tradeModes:modes,questReward,combatReward,reconciledAt:Date.now()};\n return state.world.economy\n}\n'''
          if 'export function reconcileWorldEconomy' not in s: s+=append
          p.write_text(s)
          replace_once('src/world-registry.js',
            'import {normalizeCultureProfile,normalizeTradeProfile} from "./world-locality.js?v=54017";',
            'import {normalizeCultureProfile,normalizeTradeProfile,reconcileWorldEconomy} from "./world-locality.js?v=54017";')
          replace_once('src/world-registry.js',
            ' ensureVisibilityLocks(state);ensureWorldCatalog(state);ensureTravelNetwork(state);return r',
            ' ensureVisibilityLocks(state);ensureWorldCatalog(state);ensureTravelNetwork(state);reconcileWorldEconomy(state);return r')

          # --- Quality: pending background critic is not an official 92 score; add chronology/lifespan sanity finding.
          p=Path('src/world-quality.js'); s=p.read_text()
          old=''' score=Math.round(clamp(score,0,100));\n const dimensions=Object.fromEntries(WORLD_QUALITY_DIMENSIONS.map(k=>[k,score]));'''
          new=''' const historyText=JSON.stringify(candidate?.worldHistory||[]),npcRows=Array.isArray(candidate?.generation?.npcs)?candidate.generation.npcs:[],remoteHistory=/百年|數百年|數世紀|centur|hundred years/i.test(historyText),legacyWitness=npcRows.find(n=>/初代|始祖|創建者|創始|founder|first generation/i.test(JSON.stringify(n||{}))),longevity=/長壽|延命|延壽|不老|不死|休眠|凍眠|immortal|longevity|lifespan/i.test(JSON.stringify({bible:candidate?.worldBible||{},npc:legacyWitness||{}}));\n if(remoteHistory&&legacyWitness&&!longevity){score-=8;findings.push({severity:"MEDIUM",targetType:"CHARACTERS",problem:`角色「${clean(legacyWitness.name,80)||"未命名角色"}」被描述為遙遠歷史時期的第一代／創建人物，但世界或角色設定沒有交代壽命、延命、休眠或其他時間跨度機制。`,recommendation:"補充角色壽命／延命機制，或把角色改為後代、傳承者、記錄持有人，避免年代矛盾。",requiresRegeneration:true})}\n score=Math.round(clamp(score,0,100));\n const dimensions=Object.fromEntries(WORLD_QUALITY_DIMENSIONS.map(k=>[k,score]));'''
          if old not in s: raise SystemExit('world quality score block not found')
          s=s.replace(old,new,1)
          old=''' return normalizeWorldEvaluation({overall:score,dimensions,findings},{source:"FALLBACK",reason})\n}'''
          new=''' const evaluation=normalizeWorldEvaluation({overall:score,dimensions,findings},{source:"FALLBACK",reason});\n if(String(reason||"")==="BACKGROUND_AI_CRITIC_PENDING")return {...evaluation,overall:null,status:"PENDING",official:false,pending:true,provisionalOverall:evaluation.overall};\n return {...evaluation,official:false,pending:false}\n}'''
          if old not in s: raise SystemExit('fallback quality return block not found')
          s=s.replace(old,new,1)
          s=s.replace('let score=Number(state?.world?.quality?.overall);\n if(!Number.isFinite(score))score=90;', 'const quality=state?.world?.quality||{};let score=Number(quality?.overall);\n if(!Number.isFinite(score))score=quality?.pending===true?75:90;')
          p.write_text(s)

          # --- Acquisition notification module (only state diffs that actually committed).
          Path('src/acquisition-notifier.js').write_text(r'''const clean=(v,max=120)=>typeof v==="string"?v.trim().slice(0,max):"";
const iconFor=type=>({ITEM:"🎒",KNOWLEDGE:"✦",LOCATION:"⌖",NPC:"◉",QUEST:"◆"}[type]||"•");
export function deriveAcquisitionNotifications(prev,next){
 if(!prev||!next)return [];const out=[];
 for(const [id,item] of Object.entries(next.inventory||{})){const before=prev.inventory?.[id],delta=(Number(item.quantity)||0)-(Number(before?.quantity)||0);if(delta>0)out.push({type:"ITEM",title:"取得道具",name:clean(item.name)||id,detail:`×${delta}`})}
 for(const [id,row] of Object.entries(next.knowledge||{}))if(!prev.knowledge?.[id])out.push({type:"KNOWLEDGE",title:"獲得知識",name:clean(row.title)||id,detail:row.status==="VERIFIED"?"已驗證":"未確認"});
 for(const [id,row] of Object.entries(next.locations||{}))if(row.known&&(!prev.locations?.[id]||!prev.locations[id].known))out.push({type:"LOCATION",title:"發現地點",name:clean(row.name)||id,detail:clean(row.region)});
 for(const [id,row] of Object.entries(next.npcs||{}))if(row.encountered&&(!prev.npcs?.[id]||!prev.npcs[id].encountered))out.push({type:"NPC",title:"遇見人物",name:clean(row.name)||id,detail:clean(row.role)});
 const a=prev.mainQuest||{},b=next.mainQuest||{};if(a.stage!==b.stage||a.status!==b.status||a.objective!==b.objective)out.push({type:"QUEST",title:"任務更新",name:clean(b.title)||"主線任務",detail:clean(b.objective,160)});
 return out.slice(0,8)
}
function host(){if(typeof document==="undefined")return null;let el=document.getElementById("gainToastStack");if(el)return el;el=document.createElement("div");el.id="gainToastStack";el.className="gain-toast-stack";el.setAttribute("aria-live","polite");el.setAttribute("aria-atomic","false");document.body.appendChild(el);return el}
export function pushAcquisitionNotification(row){const root=host();if(!root||!row)return;while(root.children.length>=4)root.firstElementChild?.remove();const el=document.createElement("div");el.className=`gain-toast gain-toast-${String(row.type||"GENERIC").toLowerCase()}`;el.innerHTML=`<div class="gain-toast-icon">${iconFor(row.type)}</div><div class="gain-toast-copy"><small>${clean(row.title,40)}</small><strong>${clean(row.name,100)}</strong>${row.detail?`<span>${clean(row.detail,160)}</span>`:""}</div>`;root.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"));setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),260)},3000)}
export function notifyGameplayAcquisitions(prev,next){for(const row of deriveAcquisitionNotifications(prev,next))pushAcquisitionNotification(row)}
''')

          # --- app.js: notifier, deferred evidence replay after Scene narration, and pickup evidence rule.
          replace_once('app.js',
            'import {recordDebug,telemetryEntries,telemetrySummary,debugBundle,debugBundleText,clearDebugTelemetry,installDebugConsoleCapture} from "./src/debug-telemetry.js?v=54017";',
            'import {recordDebug,telemetryEntries,telemetrySummary,debugBundle,debugBundleText,clearDebugTelemetry,installDebugConsoleCapture} from "./src/debug-telemetry.js?v=54017";\nimport {notifyGameplayAcquisitions} from "./src/acquisition-notifier.js?v=54018g";')
          replace_once('app.js',' else if(prev.combat.active&&!next.combat.active)recordDebug("GAME_COMBAT_ENDED",{...meta,enemyId:prev.combat.enemyId,enemyName:prev.combat.enemyName});\n gameplayDebugSnapshot=next', ' else if(prev.combat.active&&!next.combat.active)recordDebug("GAME_COMBAT_ENDED",{...meta,enemyId:prev.combat.enemyId,enemyName:prev.combat.enemyName});\n notifyGameplayAcquisitions(prev,next);\n gameplayDebugSnapshot=next')
          replace_once('app.js',
            ' if(!Array.isArray(effectivePatch.operations)||!effectivePatch.operations.length)return {applied:false,empty:true,rejected:grounded.rejected.length,revision:currentStateRevision(state)};',
            ' if(!Array.isArray(effectivePatch.operations)||!effectivePatch.operations.length)return {applied:false,empty:true,rejected:grounded.rejected.length,deferredEvidence:grounded.deferredEvidence||[],revision:currentStateRevision(state)};')
          replace_once('app.js',
            ' if(!revision.ok)return {applied:false,stale:true,rejected:grounded.rejected.length,...revision};',
            ' if(!revision.ok)return {applied:false,stale:true,rejected:grounded.rejected.length,deferredEvidence:grounded.deferredEvidence||[],...revision};')
          replace_once('app.js',
            ' return {applied:true,rebased:revision.rebased===true,rebasedFrom:revision.rebasedFrom??null,rejected:grounded.rejected.length,revision:next,operations:effectivePatch.operations.length}\n}',
            ' return {applied:true,rebased:revision.rebased===true,rebasedFrom:revision.rebasedFrom??null,rejected:grounded.rejected.length,deferredEvidence:grounded.deferredEvidence||[],revision:next,operations:effectivePatch.operations.length}\n}\nfunction commitSceneGroundedEvidence(state,operations,plan,context={}){\n const rows=[],seen=new Set();for(const raw of Array.isArray(operations)?operations:[]){const type=String(raw?.op||"").toUpperCase(),key=type+":"+String(raw?.item?.name||raw?.title||raw?.location||raw?.sourceId||"");if(!type||seen.has(key))continue;seen.add(key);rows.push(structuredClone(raw))}\n if(!rows.length)return {applied:false,empty:true};const capabilities=[...new Set([...(plan?.capabilities||[]),...rows.map(x=>String(x?.op||"").toUpperCase())])],evidencePlan={...plan,mode:"FAST",baseRevision:currentStateRevision(state),capabilities},patch={baseRevision:currentStateRevision(state),operations:rows};return commitStatePatch(state,patch,evidencePlan,context)\n}')
          replace_once('app.js',' const item=groundedPickupItemFromAction(context.action,context.roll);if(!item)return {applied:false};',' const item=groundedPickupItemFromAction(context.action,context.roll,context.observableText);if(!item)return {applied:false};')
          replace_once('app.js',' let foregroundSceneCtrl=null,pendingPlayerActionResult=null,pendingSceneTransport="",pendingSceneRevision=baseRevision;', ' let foregroundSceneCtrl=null,pendingPlayerActionResult=null,pendingSceneTransport="",pendingSceneRevision=baseRevision,pendingEvidenceOperations=[];')
          replace_once('app.js',
            '   const travel=commitGroundedTravelFallback(gameState,syncPlan,{action:effective,roll,intent:assessment?.actionIntent,fromLocation:locationBeforeSync}),pickup=commitGroundedPickupFallback(gameState,syncPlan,{action:effective,roll}),fallback=commitGroundedProgressionFallback(gameState,roll?.success===true?preboundFailForward:null,{...syncPlan,baseRevision:currentStateRevision(gameState)},{action:effective,roll});\n   recordDebug("STATE_SYNC_FAST_EMPTY_FALLBACK"',
