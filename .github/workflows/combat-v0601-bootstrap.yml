name: Combat 2.0 Bootstrap
on:
  push:
    branches:
      - feat/trpg-depth-combat-v060
permissions:
  contents: write
concurrency:
  group: combat-v0601-bootstrap
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Patch runtime
        id: patch
        run: |
          python3 scripts/combat-v0601-bootstrap.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            npm run version:check
            node scripts/check-js.mjs
            node --test test/trpg-depth-v060.test.js test/combat-v0601.test.js
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add app.js index.html src/version.js test/combat-v0601.test.js
            git commit -m "feat: wire Combat 2.0 into player runtime"
            git push origin HEAD:feat/trpg-depth-combat-v060
          fi
  validate:
    needs: patch
    if: needs.patch.outputs.changed == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fetch stacked base
        run: git fetch origin feat/trpg-depth-v060-foundation:refs/remotes/origin/feat/trpg-depth-v060-foundation
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-v060-foundation
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Combat and TRPG regressions
        run: node --test test/combat-v0601.test.js test/trpg-depth-v060.test.js test/contextual-actions.test.js test/dice-feedback.test.js test/version-policy.test.js test/version-ui.test.js
