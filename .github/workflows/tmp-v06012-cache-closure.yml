name: Temporary v0.60.12 cache closure

on:
  push:
    branches: [fix/v06011-foreground-timeout-contract]
    paths:
      - .github/workflows/tmp-v06012-cache-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v06011-foreground-timeout-contract
          fetch-depth: 0
      - name: Close v0.60.12 browser cache edges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "app.js": [
                  ("./src/ai-settings.js?v=60010", "./src/ai-settings.js?v=60012"),
                  ("./src/version.js?v=60010", "./src/version.js?v=60012"),
                  ("./src/ai-autotest.js?v=60010", "./src/ai-autotest.js?v=60012"),
                  ("./src/ai-client.js?v=60010", "./src/ai-client.js?v=60012"),
              ],
              "src/ai-autotest.js": [
                  ("./ai-settings.js?v=60010", "./ai-settings.js?v=60012"),
              ],
              "src/ai-client.js": [
                  ("./ai-settings.js?v=60010", "./ai-settings.js?v=60012"),
              ],
              "index.html": [
                  ("app.js?v=60011", "app.js?v=60012"),
              ],
              ".github/workflows/pages.yml": [
                  ("Focused v0.60.11 regressions", "Focused v0.60.12 regressions"),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"expected cache edge not found: {filename}: {old}")
                  text = text.replace(old, new)
                  print(f"{filename}: {old} -> {new} ({count})")
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- app.js src/ai-autotest.js src/ai-client.js index.html .github/workflows/pages.yml
      - name: Commit cache closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/ai-autotest.js src/ai-client.js index.html .github/workflows/pages.yml
          git commit -m "fix: close v0.60.12 browser cache graph"
          git push origin HEAD:fix/v06011-foreground-timeout-contract
