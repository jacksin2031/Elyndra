name: Land v0.57.9 AutoTest world download hotfix

on:
  push:
    paths:
      - ".github/workflows/land-v0579-world-download.yml"

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.57.9 product hotfix
        run: python scripts/land-v0579-world-download.py
      - name: Targeted unit regression
        run: node --test test/autotest-download-v0579.test.js
      - name: Full test suite
        run: npm test
      - name: Install isolated Chromium proof dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove two-world browser download lands as a real file
        run: node scripts/prove-autotest-world-download-browser.mjs
      - name: Commit tested v0.57.9 product
        shell: bash
        run: |
          rm -rf node_modules
          git rm -f --ignore-unmatch .github/workflows/land-v0579-world-download.yml scripts/land-v0579-world-download.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: download AutoTest world artifacts on primary click"
          git push origin HEAD:main
