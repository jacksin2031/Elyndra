name: Audit repair executor

on:
  push:
    branches:
      - fix/audit-2026-09-24-all
    paths:
      - '.github/workflows/tmp-first-button-progressive-expansion.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Apply audit repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s): Path(p).write_text(s,encoding='utf-8')
          def one(p,old,new):
              s=rd(p); n=s.count(old)
              if n!=1: raise SystemExit(f'{p}: expected one anchor, got {n}: {old[:120]!r}')
              wr(p,s.replace(old,new,1))

          # Release/version and cache contract.
          pkg=json.loads(rd('package.json')); pkg['version']='0.54.19'; wr('package.json',json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          wr('src/version.js','export const APP_VERSION="0.54.19";\n')
          for p in [Path('app.js'),Path('index.html'),Path('src/ai-client.js'),Path('src/game-engine.js'),Path('src/state-sync.js'),Path('src/progression-ui.js'),Path('src/storage.js'),Path('src/action-intent.js')]:
              s=rd(p).replace('?v=540181','?v=54019').replace('?v=54018','?v=54019')
              wr(p,s)

          # F01: StatePatch validator must authorize every operation and reject >10 atomically.
          one('src/state-sync.js',
              ' if(!Array.isArray(patch.operations))errors.push("STATE_PATCH_OPERATIONS_INVALID");\n const allowed=new Set(plan.capabilities||[]);\n for(const raw of (patch.operations||[]).slice(0,10)){',
              ' const operations=Array.isArray(patch.operations)?patch.operations:[];\n if(!Array.isArray(patch.operations))errors.push("STATE_PATCH_OPERATIONS_INVALID");\n if(operations.length>10)errors.push("STATE_PATCH_OPERATIONS_LIMIT_EXCEEDED");\n const allowed=new Set(plan.capabilities||[]);\n for(const raw of operations){')

          # F02: strip explicit negated clauses from intent inference.
          p='src/action-intent.js'; s=rd(p)
          anchor='const GENERIC_NPC_REFERENCE=/護衛|守衛|士兵|陌生人|傷者|男人|女人|居民|店員|商人|引路人|那個人|那人|對方|那名人物|那名人|guard|stranger|soldier|merchant|resident/i;\n'
          if s.count(anchor)!=1: raise SystemExit('action-intent generic NPC anchor')
          s=s.replace(anchor,anchor+'const NEGATED_CLAUSE=/(?:不想|不要|不打算|不會|別|並非要|不是要|沒有要|無意)[^，,。；;!?！？]{0,80}/gi;\nfunction positiveIntentText(action=""){return clean(action).replace(NEGATED_CLAUSE," ").trim()}\n',1)
          s=s.replace(' const q=clean(action).toLowerCase();\n if(RISKY_ACTION.test(q))return "RISKY";',' const q=positiveIntentText(action).toLowerCase();\n if(RISKY_ACTION.test(q))return "RISKY";',1)
          s=s.replace(' const q=clean(action),k=KINDS.has(String(kind).toUpperCase())?String(kind).toUpperCase():inferActionKind(q);',' const rawQ=clean(action),q=positiveIntentText(rawQ),k=KINDS.has(String(kind).toUpperCase())?String(kind).toUpperCase():inferActionKind(q);',1)
          wr(p,s)

          # F02: deterministic mutation fast paths only accept explicit positive commands.
          p='src/game-engine.js'; s=rd(p)
          anchor='const clean=(v,max=180)=>typeof v==="string"?v.trim().slice(0,max):"";\n'
          guards='''const AMBIGUOUS_MUTATION=/(?:不想|不要|不打算|不會|別|並非要|不是要|沒有要|無意|如果|假如|若果|若|除非|是否|能否|可否|要不要|[?？]|[「」『』])/i;\nfunction explicitMutationCommand(value){const q=clean(value,180);return Boolean(q)&&!AMBIGUOUS_MUTATION.test(q)}\nfunction explicitRestCommand(value){const q=clean(value,180);return explicitMutationCommand(q)&&/^(?:請)?(?:休息|睡眠|睡覺|紮營|露營|rest|sleep|camp)(?:一下|一會兒|一陣|吧)?[。.!！]?$/i.test(q)}\nfunction explicitTravelCommand(value,name){const q=clean(value,180),target=clean(name,120);if(!target||!explicitMutationCommand(q))return false;const normalized=q.replace(/[「」『』"']/g,"").replace(/[。.!！]+$/g,"").trim();return normalized===`前往${target}`||normalized===`移動到${target}`||normalized===`走到${target}`||normalized===`去${target}`||normalized===`請前往${target}`||new RegExp(`^(?:travel\\s+to|go\\s+to|walk\\s+to)\\s+${target.replace(/[.*+?^${}()|[\\]\\]/g,"\\\\$&")}$`,"i").test(normalized)}\n'''
          if s.count(anchor)!=1: raise SystemExit('game-engine clean anchor')
          s=s.replace(anchor,anchor+guards,1)
          s=s.replace(' if(/休息|睡眠|紮營|露營|住宿|旅店|投宿|rest|sleep|camp|lodging|inn/.test(q))return {kind:"GENERAL",dc:7,minutes:240,rest:true};',' if(explicitRestCommand(q)||(/住宿|旅店|投宿|lodging|inn/.test(q)&&explicitMutationCommand(q)))return {kind:"GENERAL",dc:7,minutes:240,rest:true};',1)
          s=s.replace(' if(!/休息|睡眠|睡覺|紮營|露營|rest|sleep|camp/i.test(q))return null;',' if(!explicitRestCommand(q))return null;',1)
          s=s.replace(' if(!target||!/前往|移動|走到|旅行|去|travel|go to|walk/i.test(q))return null;',' if(!target||!explicitTravelCommand(q,target.name))return null;',1)
          s=s.replace(' const profile={...baseProfile,kind:baseProfile.kind==="RISKY"?"RISKY":assessedKind},directItem=resolveItemAction(state,label,{success:true});',' const profile={...baseProfile,kind:baseProfile.kind==="RISKY"?"RISKY":assessedKind},mutationFastPath=explicitMutationCommand(label),directItem=mutationFastPath?resolveItemAction(state,label,{success:true}):null;',1)
          s=s.replace(' const directEconomy=resolveEconomyAction(state,label,{success:true});if(directEconomy?.handled){',' const directEconomy=mutationFastPath?resolveEconomyAction(state,label,{success:true}):null;if(directEconomy?.handled){',1)
          wr(p,s)

          # F03: reusable identity + epoch guard.
          wr('src/state-session.js','''export function createStateSessionGuard(initialState=null){\n let epoch=0,state=initialState??null;\n return {\n  capture(current=state){return {epoch,state:current??null}},\n  replace(next){state=next??null;epoch+=1;return {epoch,state}},\n  isCurrent(token,current=state){return Boolean(token)&&token.epoch===epoch&&token.state===state&&current===state},\n  get epoch(){return epoch},\n  get state(){return state}\n }\n}\n''')

          p='app.js'; s=rd(p)
          sync_import='import {planStateSync,deferredPlanFrom,ensureStateSyncRuntime,currentStateRevision,bumpStateRevision,validateStatePatch,groundStatePatch,groundedPickupItemFromAction,statePatchToCandidate,assessPatchRevision} from "./src/state-sync.js?v=54019";\n'
          if s.count(sync_import)!=1: raise SystemExit('app state-sync import')
          s=s.replace(sync_import,sync_import+'import {createStateSessionGuard} from "./src/state-session.js?v=54019";\n',1)
          global_line='const $=s=>document.querySelector(s),qsa=s=>Array.from(document.querySelectorAll(s));let gameState=null,aiStatus={ok:false,aiConfigured:false},aiBusy=false,turnSyncBusy=false,turnSyncLabel="",helperHistory=[],npcChatHistory=new Map();\n'
          if s.count(global_line)!=1: raise SystemExit('app globals')
          s=s.replace(global_line,global_line+'const stateSession=createStateSessionGuard(null);\nfunction captureStateSession(){return stateSession.capture(gameState)}\nfunction isCurrentStateSession(token){return stateSession.isCurrent(token,gameState)}\n',1)

          preempt='function preemptBackgroundAI(){preemptNonblockingScene();preemptBackgroundWorldEvolution();preemptBackgroundWorldQuality();preemptBackgroundHistory();preemptDeferredDirector()}\n'
          if s.count(preempt)!=1: raise SystemExit('preempt anchor')
          s=s.replace(preempt,preempt+'''function cancelStateBoundWork(reason="STATE_REPLACED"){\n if(deferredDirector.timer){clearTimeout(deferredDirector.timer);deferredDirector.timer=0}\n if(worldBackground.timer){clearTimeout(worldBackground.timer);worldBackground.timer=0}\n if(worldQualityBackground.timer){clearTimeout(worldQualityBackground.timer);worldQualityBackground.timer=0}\n if(historyBackground.timer){clearTimeout(historyBackground.timer);historyBackground.timer=0}\n preemptBackgroundAI();deferredDirector.queue.length=0;\n if(playerActionFlight.active)finishPlayerActionFlight(playerActionFlight.label||"state","state_replaced");\n recordDebug("STATE_BOUND_WORK_CANCELLED",{reason})\n}\nfunction replaceGameState(next,reason="STATE_REPLACED"){cancelStateBoundWork(reason);gameState=next??null;stateSession.replace(gameState);gameplayDebugSnapshot=null;npcChatHistory=new Map();recordDebug("STATE_SESSION_REPLACED",{reason,epoch:stateSession.epoch,worldId:gameState?.world?.id||null});return gameState}\n''',1)

          # persist accepts an exact captured state and rejects stale writes before autosave.
          a=s.index('async function persist(){if(gameState){'); b=s.index('function fallbackActionButtons',a)
          old=s[a:b]
          body=old[len('async function persist(){if(gameState){'):].rsplit('}}',1)[0]
          body=body.replace('gameState','state')
          new='async function persist(state=gameState,sessionToken=null){if(state){\n if(sessionToken&&!isCurrentStateSession(sessionToken))return false;'+body+'\n if(sessionToken&&!isCurrentStateSession(sessionToken))return false;return true\n}return false}\n'
          s=s[:a]+new+s[b:]

          # Scene commits use captured identity, not whichever global state exists later.
          old='function applyPlayerActionScene(scene,{worldId,baseRevision,expectedRevision,roll,action,previousSuggestions=[],previousSuggestionIntents=[]}={}){\n const revision=Number.isFinite(Number(expectedRevision))?Number(expectedRevision):Number(baseRevision);\n if(!scene||!gameState||gameState.world?.id!==worldId||currentStateRevision(gameState)!==revision)return false;\n const preview=sceneTurnPreview(scene,roll,{action,priorSuggestions:previousSuggestions,priorSuggestionIntents:previousSuggestionIntents});\n if(preview.narrative)gameState.narrative=preview.narrative;if(preview.sceneTitle)gameState.sceneTitle=preview.sceneTitle;\n if(preview.suggestionIntents?.length){const contextual=buildContextualActionSet(gameState,preview.suggestionIntents);gameState.suggestionIntents=contextual.all;gameState.suggestions=contextual.all.map(x=>x.label)}\n else if(preview.suggestions?.length){const contextual=buildContextualActionSet(gameState,preview.suggestions);gameState.suggestionIntents=contextual.all;gameState.suggestions=contextual.all.map(x=>x.label)}\n return true\n}'
          new='function applyPlayerActionScene(scene,{worldId,baseRevision,expectedRevision,roll,action,previousSuggestions=[],previousSuggestionIntents=[],state=gameState,sessionToken=null}={}){\n const revision=Number.isFinite(Number(expectedRevision))?Number(expectedRevision):Number(baseRevision);\n if(!scene||!state||(sessionToken&&!isCurrentStateSession(sessionToken))||state.world?.id!==worldId||currentStateRevision(state)!==revision)return false;\n const preview=sceneTurnPreview(scene,roll,{action,priorSuggestions:previousSuggestions,priorSuggestionIntents:previousSuggestionIntents});\n if(preview.narrative)state.narrative=preview.narrative;if(preview.sceneTitle)state.sceneTitle=preview.sceneTitle;\n if(preview.suggestionIntents?.length){const contextual=buildContextualActionSet(state,preview.suggestionIntents);state.suggestionIntents=contextual.all;state.suggestions=contextual.all.map(x=>x.label)}\n else if(preview.suggestions?.length){const contextual=buildContextualActionSet(state,preview.suggestions);state.suggestionIntents=contextual.all;state.suggestions=contextual.all.map(x=>x.label)}\n return true\n}'
          if s.count(old)!=1: raise SystemExit('scene apply anchor')
          s=s.replace(old,new,1)

          # Nonblocking narration captures both object identity and epoch.
          start=s.index('function startNonblockingPlayerNarration('); end=s.index('function removePersistedDeferredTurn',start)
          block=s[start:end]
          block=block.replace('function startNonblockingPlayerNarration({action,roll,snapshot,plan,intent,previousSuggestions,previousSuggestionIntents,startedAt}){\n preemptNonblockingScene();const ctrl=new AbortController(),worldId=gameState?.world?.id,baseRevision=Number(plan?.baseRevision)||currentStateRevision(gameState);',
          'function startNonblockingPlayerNarration({action,roll,snapshot,plan,intent,previousSuggestions,previousSuggestionIntents,startedAt,state=gameState,sessionToken=captureStateSession()}){\n preemptNonblockingScene();const ctrl=new AbortController(),worldId=state?.world?.id,baseRevision=Number(plan?.baseRevision)||currentStateRevision(state);',1)
          block=block.replace('if(ctrl.signal.aborted)return;const applied=applyPlayerActionScene(scene,{worldId,baseRevision,roll,action,previousSuggestions,previousSuggestionIntents});','if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken))return;const applied=applyPlayerActionScene(scene,{worldId,baseRevision,roll,action,previousSuggestions,previousSuggestionIntents,state,sessionToken});',1)
          block=block.replace('currentRevision:gameState?currentStateRevision(gameState):null','currentRevision:isCurrentStateSession(sessionToken)?currentStateRevision(state):null')
          block=block.replace('if(applied){await persist();await refresh()}','if(applied){await persist(state,sessionToken);if(isCurrentStateSession(sessionToken))await refresh()}')
          s=s[:start]+block+s[end:]

          # Runtime stage checkpoint takes explicit state/token and validates before canonization.
          old='async function commitRuntimeStageCheckpoint(plan,{stage,generation,region="",reason=""}={}){\n if(!gameState||!plan||!stage)return null;'
          new='async function commitRuntimeStageCheckpoint(plan,{stage,generation,region="",reason=""}={},sessionToken=captureStateSession(),state=gameState){\n if(!state||!plan||!stage)return null;if(!isCurrentStateSession(sessionToken))throw new DOMException("State session replaced","AbortError");'
          if s.count(old)!=1: raise SystemExit('runtime checkpoint start')
          s=s.replace(old,new,1)
          cp0=s.index('async function commitRuntimeStageCheckpoint('); cp1=s.index('function scheduleWorldEvolution',cp0)
          cp=s[cp0:cp1].replace('gameState','state').replace('await persist()','await persist(state,sessionToken)')
          cp=cp.replace('state=state','state=gameState') if False else cp
          # previous replace changed default and capture helper arguments; restore exact signature pieces.
          cp=cp.replace('sessionToken=captureStateSession(),state=state','sessionToken=captureStateSession(),state=gameState')
          cp=cp.replace('isCurrentStateSession(sessionToken)','isCurrentStateSession(sessionToken)')
          s=s[:cp0]+cp+s[cp1:]

          # Background world evolution captures state+epoch and passes them to onStage.
          e0=s.index('async function runBackgroundWorldEvolution(){'); e1=s.index('function beginPlayerActionFlight',e0)
          eb=s[e0:e1]
          eb=eb.replace(' const worldId=gameState.world?.id,reason=', ' const state=gameState,sessionToken=captureStateSession(),worldId=gameState.world?.id,reason=',1)
          eb=eb.replace('generateRegionExpansion(gameState,reason,{signal:ctrl.signal,plan,onStage:stage=>commitRuntimeStageCheckpoint(plan,stage)})','generateRegionExpansion(state,reason,{signal:ctrl.signal,plan,onStage:stage=>commitRuntimeStageCheckpoint(plan,stage,sessionToken,state)})',1)
          eb=eb.replace('if(ctrl.signal.aborted||!gameState||gameState.world?.id!==worldId)', 'if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)||state.world?.id!==worldId)',1)
          # after awaited generation, all mutation/validation refers to captured state
          marker='  if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)||state.world?.id!==worldId)'
          pos=eb.index(marker)
          head,tail=eb[:pos],eb[pos:]
          tail=tail.replace('gameState','state').replace('await persist()','await persist(state,sessionToken)')
          # finally scheduling should use current global only if same session; don't mutate stale captured plan further.
          tail=tail.replace('if(state&&aiStatus.aiConfigured){','if(isCurrentStateSession(sessionToken)&&state&&aiStatus.aiConfigured){')
          eb=head+tail
          s=s[:e0]+eb+s[e1:]

          # Deferred director captures state+epoch before AI await.
          d0=s.index('async function runDeferredDirector(){'); d1=s.index('function scheduleHistoryDeepening',d0)
          db=s[d0:d1]
          db=db.replace(' const task=deferredDirector.queue[0],worldId=gameState.world?.id,ctrl=', ' const task=deferredDirector.queue[0],state=gameState,sessionToken=captureStateSession(),worldId=gameState.world?.id,ctrl=',1)
          db=db.replace('const snapshot=buildSnapshot(gameState)','const snapshot=buildSnapshot(state)',1).replace('currentStateRevision(gameState)','currentStateRevision(state)')
          db=db.replace('if(ctrl.signal.aborted||!gameState||gameState.world?.id!==worldId)return;','if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)||state.world?.id!==worldId)return;',1)
          # only post-await mutation block and caught retry bookkeeping use captured state
          awaitpos=db.index('  const patch=await generateStatePatch')
          h,t=db[:awaitpos],db[awaitpos:]
          t=t.replace('commitStatePatch(gameState','commitStatePatch(state').replace('gameState?.events','state?.events').replace('gameState?.world?.deferredTurns','state?.world?.deferredTurns').replace('await persist()','await persist(state,sessionToken)')
          db=h+t
          s=s[:d0]+db+s[d1:]

          # History background captures state+epoch and rejects late response before commit.
          h0=s.index('async function runBackgroundHistoryDeepening(){'); h1=s.index('function scheduleWorldQualityCritic',h0)
          hb=s[h0:h1]
          hb=hb.replace(' const worldId=gameState.world?.id,ctrl=', ' const state=gameState,sessionToken=captureStateSession(),worldId=gameState.world?.id,ctrl=',1)
          hb=hb.replace('generateHistoryDeepening(gameState,plan','generateHistoryDeepening(state,plan',1)
          hb=hb.replace('if(ctrl.signal.aborted||!gameState||gameState.world?.id!==worldId)', 'if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)||state.world?.id!==worldId)',1)
          pos=hb.index('  if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)')
          hh,ht=hb[:pos],hb[pos:]
          for oldx,newx in [('abortHistoryDeepening(gameState','abortHistoryDeepening(state'),('validateHistoryDeepeningCandidate(gameState','validateHistoryDeepeningCandidate(state'),('commitHistoryDeepening(gameState','commitHistoryDeepening(state'),('registerHistoryDeepeningDocuments(gameState','registerHistoryDeepeningDocuments(state'),('registerHistoryRelicSeeds(gameState','registerHistoryRelicSeeds(state'),('bumpStateRevision(gameState','bumpStateRevision(state'),('await persist()','await persist(state,sessionToken)')]: ht=ht.replace(oldx,newx)
          hb=hh+ht
          s=s[:h0]+hb+s[h1:]

          # Quality critic captures state+epoch and rejects late response before repair/canon mutation.
          q0=s.index('async function runBackgroundWorldQualityCritic(){'); q1=s.index('function pendingRuntimeGenerationPlan',q0)
          qb=s[q0:q1]
          qb=qb.replace(' const worldId=gameState.world?.id,baseVersion=', ' const state=gameState,sessionToken=captureStateSession(),worldId=gameState.world?.id,baseVersion=',1)
          qb=qb.replace('runWorldQualityCritic(gameState','runWorldQualityCritic(state',1)
          qb=qb.replace('if(ctrl.signal.aborted||!gameState||gameState.world?.id!==worldId)return;', 'if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)||state.world?.id!==worldId)return;',1)
          pos=qb.index('  if(ctrl.signal.aborted||!isCurrentStateSession(sessionToken)')
          qh,qt=qb[:pos],qb[pos:]
          for oldx,newx in [('recordBackgroundQualityReview(gameState','recordBackgroundQualityReview(state'),('gameState.world?.version','state.world?.version'),('applyUnseenWorldRepair(gameState','applyUnseenWorldRepair(state'),('bumpStateRevision(gameState','bumpStateRevision(state'),('gameState.events.push','state.events.push'),('await persist()','await persist(state,sessionToken)')]: qt=qt.replace(oldx,newx)
          qb=qh+qt
          s=s[:q0]+qb+s[q1:]

          # runAction: capture exact state and replace its internal global state references with captured object.
          r0=s.index('async function runAction(action,customText="",options={}){'); r1=s.index('$("#newWorldBtn")',r0)
          rb=s[r0:r1]
          rb=rb.replace(' if(!gameState)return;markForegroundActivity();preemptBackgroundAI();',' if(!gameState)return;const actionState=gameState,actionSession=captureStateSession();markForegroundActivity();preemptBackgroundAI();',1)
          # from first action-state usage onward, state operations use captured object
          split=rb.index(' if(turnSyncBusy)')
          rh,rt=rb[:split],rb[split:].replace('gameState','actionState')
          rb=rh+rt
          rb=rb.replace('assessment=await assessPlayerAction(actionState,requested)}','assessment=await assessPlayerAction(actionState,requested);if(!isCurrentStateSession(actionSession))return}',1)
          rb=rb.replace('await persist()','await persist(actionState,actionSession)')
          # all nonblocking narration calls carry same token/state
          rb=rb.replace('startedAt:debugTurnStarted});','startedAt:debugTurnStarted,state:actionState,sessionToken:actionSession});')
          # after blocking state sync await, reject stale result before any commit
          rb=rb.replace('  const stateResult=await stateSyncResult;','  const stateResult=await stateSyncResult;\n  if(!isCurrentStateSession(actionSession)){recordDebug("STALE_STATE_SESSION_DISCARDED",{scope:"STATE_SYNC",action:effective});return}',1)
          # foreground scene callback has same state+epoch.
          rb=rb.replace('if(ctrl.signal.aborted||!actionState)return;','if(ctrl.signal.aborted||!isCurrentStateSession(actionSession))return;',1)
          rb=rb.replace('previousSuggestions,previousSuggestionIntents});','previousSuggestions,previousSuggestionIntents,state:actionState,sessionToken:actionSession});')
          s=s[:r0]+rb+s[r1:]

          # Every explicit state replacement goes through one gate, including same-world slot loads.
          replacements={
           'gameState=migrate(await loadWorld())':'replaceGameState(migrate(await loadWorld()),"CONTINUE_AUTOSAVE")',
           'gameState=newGame(seed);applyWorldCreationState(gameState,seed);':'replaceGameState(newGame(seed),"NEW_WORLD");applyWorldCreationState(gameState,seed);',
           'if(!accepted){gameState=null;':'if(!accepted){replaceGameState(null,"WORLD_CREATION_CANCELLED");',
           'onLoad:async loaded=>{gameState=migrate(loaded);':'onLoad:async loaded=>{replaceGameState(migrate(loaded),"LOAD_SLOT");',
           'gameState=migrate(await importWorld(e.target.files[0]))':'replaceGameState(migrate(await importWorld(e.target.files[0])),"IMPORT_WORLD")',
           'await deleteWorld();gameState=null;':'await deleteWorld();replaceGameState(null,"RESET_WORLD");',
           'cancelAutotestBackgroundWork();gameState=null;gameplayDebugSnapshot=null;':'cancelAutotestBackgroundWork();replaceGameState(null,"AUTOTEST_WORLD_RESET");',
           'gameState=generated.state;gameplayDebugSnapshot=null;':'replaceGameState(generated.state,"AUTOTEST_WORLD_READY");',
           'gameState=originalState;gameplayDebugSnapshot=null;':'replaceGameState(originalState,"AUTOTEST_RESTORE");'
          }
          for oldx,newx in replacements.items():
              n=s.count(oldx)
              if n!=1: raise SystemExit(f'state replacement anchor {oldx[:60]} count={n}')
              s=s.replace(oldx,newx,1)

          # F05: FIRST_BUTTON progressive expansion runs concurrently, never before the click.
          dev='const developerAutotest={running:false,stopRequested:false,worldIndex:0,turn:0,results:[],startedAt:0,endedAt:0,config:null,controller:null,batchController:null,lastReport:null,lastMessage:"",logs:[],hiddenAt:0,lastVisibleAt:0,backgroundInterruptions:0,backgroundDurationMs:0};\n'
          if s.count(dev)!=1: raise SystemExit('autotest state')
