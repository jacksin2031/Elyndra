name: Temporary FIRST_BUTTON Progressive Expansion Patch

on:
  push:
    paths:
      - '.github/workflows/tmp-first-button-progressive-expansion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Patch FIRST_BUTTON progressive expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          old='''const developerAutotest={running:false,stopRequested:false,worldIndex:0,turn:0,results:[],startedAt:0,endedAt:0,config:null,controller:null,batchController:null,lastReport:null,lastMessage:"",logs:[],hiddenAt:0,lastVisibleAt:0,backgroundInterruptions:0,backgroundDurationMs:0};\nconst AUTOTEST_BACKGROUND_GRACE_MS=15000;'''
          new='''const developerAutotest={running:false,stopRequested:false,worldIndex:0,turn:0,results:[],startedAt:0,endedAt:0,config:null,controller:null,batchController:null,lastReport:null,lastMessage:"",logs:[],hiddenAt:0,lastVisibleAt:0,backgroundInterruptions:0,backgroundDurationMs:0};\nconst autotestRuntimeExpansion={running:false,controller:null,reason:"",turn:0};\nconst AUTOTEST_BACKGROUND_GRACE_MS=15000;'''
          if s.count(old)!=1: raise SystemExit(f'autotest state anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''async function expandDeveloperAutotestWorld(reason="WORLD_EDGE_UNDERDEFINED"){\n const pending=pendingRuntimeGenerationPlan(gameState);if(!developerAutotestActive||!gameState||!aiStatus.aiConfigured||(!needsExpansion(gameState)&&!pending))return false;\n const plan=pending||planLazyGeneration(gameState,{reason}),startedAt=Date.now();recordDebug("AUTOTEST_RUNTIME_EXPANSION_STARTED",{reason,planId:plan.id,resumeStage:plan.checkpoint?.stage||null});\n try{\n  const ex=await generateRegionExpansion(gameState,reason,{signal:developerAutotest.batchController?.signal,plan,onStage:stage=>commitRuntimeStageCheckpoint(plan,stage)});if(!ex?.generation)throw new Error("AUTOTEST_RUNTIME_EXPANSION_EMPTY");'''
          new='''async function expandDeveloperAutotestWorld(reason="WORLD_EDGE_UNDERDEFINED",options={}){\n const pending=pendingRuntimeGenerationPlan(gameState);if(!developerAutotestActive||!gameState||!aiStatus.aiConfigured||(!needsExpansion(gameState)&&!pending))return false;\n const background=options?.background===true,signal=options?.signal||developerAutotest.batchController?.signal,plan=pending||planLazyGeneration(gameState,{reason}),startedAt=Date.now();recordDebug("AUTOTEST_RUNTIME_EXPANSION_STARTED",{reason,planId:plan.id,resumeStage:plan.checkpoint?.stage||null,background});\n try{\n  const ex=await generateRegionExpansion(gameState,reason,{signal,plan,onStage:background?undefined:stage=>commitRuntimeStageCheckpoint(plan,stage)});if(signal?.aborted)throw signal.reason||new DOMException("AutoTest expansion aborted","AbortError");if(!ex?.generation)throw new Error("AUTOTEST_RUNTIME_EXPANSION_EMPTY");'''
          if s.count(old)!=1: raise SystemExit(f'expand start anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''  await persist();await refresh();recordDebug("AUTOTEST_RUNTIME_EXPANSION_COMPLETED",{reason,planId:plan.id,elapsedMs:Date.now()-startedAt,locations:added.locations?.length||0,npcs:added.npcs?.length||0,factions:added.factions?.length||0,sideQuests:added.sideQuests?.length||0});return true\n }catch(e){const checkpointed=hasLazyGenerationCheckpoint(plan);if(plan.status==="PLANNED"&&!checkpointed)abortLazyGeneration(gameState,plan,e?.message||"AUTOTEST_RUNTIME_EXPANSION_FAILED");recordDebug("AUTOTEST_RUNTIME_EXPANSION_FAILED",{reason,planId:plan.id,error:e?.message||String(e),checkpointed,resumeStage:plan.checkpoint?.stage||null,elapsedMs:Date.now()-startedAt});return false}\n}\nasync function executeDeveloperAutotestDecision(decision){'''
          new='''  await persist();if(!background)await refresh();recordDebug("AUTOTEST_RUNTIME_EXPANSION_COMPLETED",{reason,planId:plan.id,elapsedMs:Date.now()-startedAt,locations:added.locations?.length||0,npcs:added.npcs?.length||0,factions:added.factions?.length||0,sideQuests:added.sideQuests?.length||0,background});return true\n }catch(e){const checkpointed=hasLazyGenerationCheckpoint(plan);if(plan.status==="PLANNED"&&!checkpointed)abortLazyGeneration(gameState,plan,e?.message||"AUTOTEST_RUNTIME_EXPANSION_FAILED");recordDebug("AUTOTEST_RUNTIME_EXPANSION_FAILED",{reason,planId:plan.id,error:e?.message||String(e),checkpointed,resumeStage:plan.checkpoint?.stage||null,elapsedMs:Date.now()-startedAt,background});return false}\n}\nfunction autotestRecentStallCount(rows=[]){let count=0;for(const row of rows.slice().reverse()){if(row?.progressed!==false)break;count++}return count}\nfunction scheduleDeveloperAutotestExpansion(reason="FIRST_BUTTON_STALL_RECOVERY",turn=0){\n if(!developerAutotestActive||!developerAutotest.running||!gameState||!aiStatus.aiConfigured||autotestRuntimeExpansion.running||!needsExpansion(gameState))return false;\n const batchSignal=developerAutotest.batchController?.signal;if(batchSignal?.aborted)return false;\n const ctrl=new AbortController(),worldId=gameState.world?.id,relay=()=>{if(!ctrl.signal.aborted)ctrl.abort(batchSignal?.reason||new DOMException("AutoTest batch stopped","AbortError"))};if(batchSignal)batchSignal.addEventListener("abort",relay,{once:true});\n autotestRuntimeExpansion.running=true;autotestRuntimeExpansion.controller=ctrl;autotestRuntimeExpansion.reason=reason;autotestRuntimeExpansion.turn=turn;recordDebug("AUTOTEST_RUNTIME_EXPANSION_BACKGROUND_STARTED",{reason,turn,worldId});\n void expandDeveloperAutotestWorld(reason,{background:true,signal:ctrl.signal}).then(ok=>recordDebug("AUTOTEST_RUNTIME_EXPANSION_BACKGROUND_COMPLETED",{reason,turn,worldId,ok})).finally(()=>{if(batchSignal)batchSignal.removeEventListener("abort",relay);if(autotestRuntimeExpansion.controller===ctrl)autotestRuntimeExpansion.controller=null;autotestRuntimeExpansion.running=false;autotestRuntimeExpansion.reason="";autotestRuntimeExpansion.turn=0});\n return true\n}\nasync function executeDeveloperAutotestDecision(decision){'''
          if s.count(old)!=1: raise SystemExit(f'expand end anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''function cancelAutotestBackgroundWork(){\n if(deferredDirector.timer){clearTimeout(deferredDirector.timer);deferredDirector.timer=0}\n if(worldBackground.timer){clearTimeout(worldBackground.timer);worldBackground.timer=0}\n if(worldQualityBackground.timer){clearTimeout(worldQualityBackground.timer);worldQualityBackground.timer=0}\n if(historyBackground.timer){clearTimeout(historyBackground.timer);historyBackground.timer=0}\n preemptBackgroundAI()\n}'''
          new='''function cancelAutotestBackgroundWork(){\n if(deferredDirector.timer){clearTimeout(deferredDirector.timer);deferredDirector.timer=0}\n if(worldBackground.timer){clearTimeout(worldBackground.timer);worldBackground.timer=0}\n if(worldQualityBackground.timer){clearTimeout(worldQualityBackground.timer);worldQualityBackground.timer=0}\n if(historyBackground.timer){clearTimeout(historyBackground.timer);historyBackground.timer=0}\n const expansionCtrl=autotestRuntimeExpansion.controller;if(expansionCtrl&&!expansionCtrl.signal.aborted)expansionCtrl.abort(new DOMException("AutoTest stopping","AbortError"));\n preemptBackgroundAI()\n}'''
          if s.count(old)!=1: raise SystemExit(f'cancel anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''     developerAutotest.turn=turn;const firstButtonFast=config.playStrategy==="FIRST_BUTTON";if(!firstButtonFast&&needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");else if(firstButtonFast&&needsExpansion(gameState))recordDebug("AUTOTEST_RUNTIME_EXPANSION_SKIPPED",{reason:"FIRST_BUTTON_FAST_PATH",phase:"TURN",turn});if(firstButtonFast)await waitForAutotestActionReady(3000);else await waitForAutotestIdle();\n     const beforeFingerprint=autotestStateFingerprint(gameState),turnStartedAt=Date.now(),row={worldIndex:i,turn,beforeFingerprint,afterFingerprint:"",decision:null,error:"",durationMs:0};'''
          new='''     developerAutotest.turn=turn;const firstButtonFast=config.playStrategy==="FIRST_BUTTON";let firstButtonExpansionReason="";if(!firstButtonFast&&needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");else if(firstButtonFast&&needsExpansion(gameState)){const stall=autotestRecentStallCount(recentActions),sparseWorld=(gameState.world?.registry?.locations||[]).length<=1&&turn>=5;if(stall>=3||sparseWorld)firstButtonExpansionReason=stall>=3?"FIRST_BUTTON_STALL_RECOVERY":"FIRST_BUTTON_SPARSE_WORLD";else recordDebug("AUTOTEST_RUNTIME_EXPANSION_SKIPPED",{reason:"FIRST_BUTTON_FAST_PATH",phase:"TURN",turn,stall})}if(firstButtonFast)await waitForAutotestActionReady(3000);else await waitForAutotestIdle();\n     const beforeFingerprint=autotestStateFingerprint(gameState),turnStartedAt=Date.now(),row={worldIndex:i,turn,beforeFingerprint,afterFingerprint:"",decision:null,error:"",durationMs:0};'''
          if s.count(old)!=1: raise SystemExit(f'turn expansion anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''      recordDebug("AUTOTEST_TURN_STARTED",{worldIndex:i,turn,decision});\n      if(config.stopCondition==="CUSTOM_AI"&&decision.goalReached===true){result.stopReason="CUSTOM_AI";row.afterFingerprint=beforeFingerprint;row.durationMs=Date.now()-turnStartedAt;result.actions.push(row);result.turns=turn;break}\n      await executeDeveloperAutotestDecision(decision);'''
          new='''      recordDebug("AUTOTEST_TURN_STARTED",{worldIndex:i,turn,decision});\n      if(firstButtonFast&&firstButtonExpansionReason){const scheduled=scheduleDeveloperAutotestExpansion(firstButtonExpansionReason,turn);recordDebug("AUTOTEST_RUNTIME_EXPANSION_DEFERRED",{reason:firstButtonExpansionReason,turn,scheduled})}\n      if(config.stopCondition==="CUSTOM_AI"&&decision.goalReached===true){result.stopReason="CUSTOM_AI";row.afterFingerprint=beforeFingerprint;row.durationMs=Date.now()-turnStartedAt;result.actions.push(row);result.turns=turn;break}\n      await executeDeveloperAutotestDecision(decision);'''
          if s.count(old)!=1: raise SystemExit(f'decision anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('test/first-button-fast-path-v05417.test.js')
          q=t.read_text(encoding='utf-8')
          old=''' assert.match(source,/!firstButtonFast&&needsExpansion\\(gameState\\)\\)await expandDeveloperAutotestWorld/);\n const html=await readFile(new URL("../index.html",import.meta.url),"utf8");'''
          new=''' assert.match(source,/!firstButtonFast&&needsExpansion\\(gameState\\)\\)await expandDeveloperAutotestWorld/);\n assert.match(source,/function scheduleDeveloperAutotestExpansion/);\n assert.match(source,/AUTOTEST_RUNTIME_EXPANSION_BACKGROUND_STARTED/);\n assert.match(source,/if\\(firstButtonFast&&firstButtonExpansionReason\\)\\{const scheduled=scheduleDeveloperAutotestExpansion/);\n assert.match(source,/expandDeveloperAutotestWorld\\(reason,\\{background:true,signal:ctrl\\.signal\\}\\)/);\n assert.doesNotMatch(source,/firstButtonFast&&needsExpansion\\(gameState\\)\\)await expandDeveloperAutotestWorld/);\n const html=await readFile(new URL("../index.html",import.meta.url),"utf8");'''
          if q.count(old)!=1: raise SystemExit(f'test anchor count={q.count(old)}')
          q=q.replace(old,new,1)
          t.write_text(q,encoding='utf-8')
          PY
      - name: Run full test suite
        run: npm test
      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/tmp-first-button-progressive-expansion.yml
          git config user.name 'JackSin'
          git config user.email 'a24dc523@dhw.ac.jp'
          git add app.js test/first-button-fast-path-v05417.test.js .github/workflows/tmp-first-button-progressive-expansion.yml
          git commit -m 'fix: expand stalled FIRST_BUTTON worlds in background'
          git push origin HEAD:main
