name: v0.59.14 patch
on:
  push:
    branches:
      - fix/v05914-runtime-locale-semantic-progress
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'apply v0.59.14 runtime fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/v05914_patch.py
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply v0.59.14 runtime fixes"
          git push
