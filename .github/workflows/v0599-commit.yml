name: Commit validated v0.59.9 product patch
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-commit.yml]
permissions:
  contents: write
jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply validated patch
        run: |
          python3 scripts/v0599_patch_preflight.py
          python3 scripts/v0599_patch.py
      - name: Validate
        run: |
          npm run version:check
          node scripts/check-js.mjs
          python3 scripts/scan-i18n-coverage.py
          node --test test/v05908-runtime-recovery.test.js test/ai-autotest-first-button-hotfix.test.js test/version-ui.test.js
      - name: Commit product files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.js app.js index.html src/ai-autotest.js src/locale-runtime.js src/ui-translations-extra.js src/v0594-static-i18n.js test/v05908-runtime-recovery.test.js
          git commit -m "fix: v0.59.9 Japanese UI and grounded AutoTest progress"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
