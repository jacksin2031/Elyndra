name: One-shot FIRST_BUTTON fast path
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-first-button-fast.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch FIRST_BUTTON to never wait for runtime expansion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old_initial='gameState=generated.state;gameplayDebugSnapshot=null;if(config.mode!=="worlds"&&needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");await refresh();show("game");await waitForAutotestIdle(3000);'
          new_initial='gameState=generated.state;gameplayDebugSnapshot=null;const firstButtonFast=config.playStrategy==="FIRST_BUTTON";if(config.mode!=="worlds"&&!firstButtonFast&&needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");else if(config.mode!=="worlds"&&firstButtonFast&&needsExpansion(gameState))recordDebug("AUTOTEST_RUNTIME_EXPANSION_SKIPPED",{reason:"FIRST_BUTTON_FAST_PATH",phase:"INITIAL"});await refresh();show("game");await waitForAutotestIdle(3000);'
          old_turn='developerAutotest.turn=turn;if(needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");await waitForAutotestIdle();'
          new_turn='developerAutotest.turn=turn;const firstButtonFast=config.playStrategy==="FIRST_BUTTON";if(!firstButtonFast&&needsExpansion(gameState))await expandDeveloperAutotestWorld("WORLD_EDGE_UNDERDEFINED");else if(firstButtonFast&&needsExpansion(gameState))recordDebug("AUTOTEST_RUNTIME_EXPANSION_SKIPPED",{reason:"FIRST_BUTTON_FAST_PATH",phase:"TURN",turn});await waitForAutotestIdle();'
          if s.count(old_initial)!=1:
              raise SystemExit(f'initial patch anchor count={s.count(old_initial)}')
          if s.count(old_turn)!=1:
              raise SystemExit(f'turn patch anchor count={s.count(old_turn)}')
          s=s.replace(old_initial,new_initial).replace(old_turn,new_turn)
          p.write_text(s,encoding='utf-8')

          test=Path('test/first-button-fast-path-v05417.test.js')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport {readFile} from "node:fs/promises";\n\ntest("FIRST_BUTTON fast path never blocks on runtime expansion before visible actions",async()=>{\n const source=await readFile(new URL("../app.js",import.meta.url),"utf8");\n assert.match(source,/const firstButtonFast=config\\.playStrategy===\\"FIRST_BUTTON\\"/);\n assert.match(source,/!firstButtonFast&&needsExpansion\\(gameState\\)\\)await expandDeveloperAutotestWorld/);\n assert.match(source,/AUTOTEST_RUNTIME_EXPANSION_SKIPPED/);\n const turnGate=\'developerAutotest.turn=turn;const firstButtonFast=config.playStrategy==="FIRST_BUTTON";if(!firstButtonFast&&needsExpansion(gameState))await expandDeveloperAutotestWorld\';\n assert.ok(source.includes(turnGate),"turn loop must gate blocking expansion behind non-FIRST_BUTTON strategy");\n});\n''',encoding='utf-8')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Run full test suite
        run: npm test
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/oneshot-first-button-fast.yml
          git config user.name "A24DC523"
          git config user.email "a24dc523@dhw.ac.jp"
          git add -A
          git commit -m "fix: make first-button autotest immediate"
          git push origin HEAD:main
