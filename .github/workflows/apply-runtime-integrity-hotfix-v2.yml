name: Apply runtime integrity hotfix v2

on:
  push:
    branches:
      - fix/v05910-runtime-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute corrected guarded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap, traceback
          try:
              source=Path('.github/workflows/apply-runtime-integrity-hotfix.yml').read_text(encoding='utf-8')
              marker="          python3 <<'PY'\n"
              start=source.index(marker)+len(marker)
              end=source.index("\n          PY",start)
              code=textwrap.dedent(source[start:end])
              code=code.replace('touched = False','touched = [False]')
              code=re.sub(r'(?m)^\s*nonlocal touched\s*\n','',code)
              code=code.replace('touched = True','touched[0] = True').replace('if touched:','if touched[0]:')
              compile(code,'runtime-integrity-hotfix','exec')
              exec(code,{'__name__':'__main__'})
          except BaseException:
              Path('.hotfix-error.txt').write_text(traceback.format_exc(),encoding='utf-8')
              raise
          PY
          set +e
          npm test > .hotfix-test.log 2>&1
          test_status=$?
          npm run check:cache-bust >> .hotfix-test.log 2>&1
          cache_status=$?
          set -e
          if [ "$test_status" -ne 0 ] || [ "$cache_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload staging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-hotfix-staging-diagnostics
          path: |
            .hotfix-error.txt
            .hotfix-test.log
          if-no-files-found: ignore
      - name: Commit patched runtime
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bound deferred state and ground runtime entities"
          git push origin HEAD:fix/v05910-runtime-integrity
