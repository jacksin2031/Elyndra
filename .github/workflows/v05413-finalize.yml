name: v0.54.13 finalize

on:
  push:
    branches:
      - fix/v05413-runtime-resume-generation-normalization
    paths:
      - .github/workflows/v05413-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v05413-runtime-resume-generation-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch and verify full release
        shell: bash
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,"");print}' .github/workflows/v05413-branch-patch.yml > /tmp/v05413-patch.py
          test -s /tmp/v05413-patch.py
          python /tmp/v05413-patch.py
          python .github/scripts/v05413_finalize_tests.py
          rm -f .github/workflows/v05413-branch-patch.yml
          rm -f .github/workflows/v05413-finalize.yml
          rm -f .github/scripts/v05413_finalize_tests.py
          npm test
          git diff --check
          git config user.name "elyndra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete v0.54.13 runtime and generation recovery"
          CACHE_BASE_REF=origin/main npm run cache:check
          git push origin HEAD:fix/v05413-runtime-resume-generation-normalization
