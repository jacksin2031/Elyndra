name: Bootstrap v0.60.19 wiring
on:
  push:
    branches: [fix/v06019-ja-manual-regressions]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v06019-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic patch
        run: node scripts/v06019-patch.mjs
      - name: Verify changed tree
        run: |
          node --test test/v06019-ja-manual-regressions.test.js
          node scripts/check-js.mjs
          python3 scripts/scan-i18n-coverage.py
      - name: Commit release wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json src/version.js index.html app.js test/version-0551-release.test.js test/version-ui.test.js
          git commit -m "v0.60.19: wire Japanese manual-test regressions [v06019-wired]"
          git push origin HEAD:${GITHUB_REF_NAME}
