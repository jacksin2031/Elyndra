name: One-shot v0.54.18 opening deconflict

on:
  push:
    branches:
      - fix/v0.54.18-newbie-protection-runtime

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply opening chronology hardening
        run: python .github/scripts/patch-opening-deconflict-v05418.py
      - name: Run full test suite
        run: npm test
      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/scripts/patch-opening-deconflict-v05418.py
          rm -f .github/workflows/oneshot-opening-deconflict-v05418.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep opening hooks inside newbie pacing"
          git push origin HEAD:fix/v0.54.18-newbie-protection-runtime
