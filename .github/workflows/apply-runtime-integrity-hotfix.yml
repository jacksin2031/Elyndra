name: Apply runtime integrity hotfix

on:
  push:
    branches:
      - fix/v05910-runtime-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded runtime integrity patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # 1) Bound Deferred mutations to their origin revision instead of silently rebasing ancient work.
          replace_once(
              "src/state-sync.js",
              'const REBASE_SAFE=new Set(["NPC_RELATIONSHIP_SIGNAL","FACTION_REPUTATION_SIGNAL","QUEST_HINT","COMPANION_SIGNAL"]);',
              'const REBASE_SAFE=new Set(["NPC_RELATIONSHIP_SIGNAL","FACTION_REPUTATION_SIGNAL","QUEST_HINT","COMPANION_SIGNAL"]);\nexport const MAX_DEFERRED_REBASE_GAP=4;'
          )
          replace_once(
              "src/state-sync.js",
              'export function deferredPlanFrom(plan={},baseRevision=0){\n return {...plan,mode:"DEFERRED",blocking:false,deferred:true,requiresStateAI:(plan.deferredCapabilities||[]).length>0,capabilities:[...(plan.deferredCapabilities||[])],dirty:[...(plan.deferredDirty||[])],baseRevision:Number(baseRevision)||0}\n}',
              'export function deferredPlanFrom(plan={},baseRevision=0){\n const current=Math.max(0,Number(baseRevision)||0),rawOrigin=Number(plan?.baseRevision),origin=Number.isFinite(rawOrigin)&&rawOrigin>=0?rawOrigin:current,revisionGap=Math.max(0,current-origin);\n return {...plan,mode:"DEFERRED",blocking:false,deferred:true,requiresStateAI:(plan.deferredCapabilities||[]).length>0,capabilities:[...(plan.deferredCapabilities||[])],dirty:[...(plan.deferredDirty||[])],baseRevision:origin,originRevision:origin,currentRevision:current,revisionGap,expired:revisionGap>MAX_DEFERRED_REBASE_GAP}\n}'
          )
          replace_once(
              "src/state-sync.js",
              ' const ops=Array.isArray(patch?.operations)?patch.operations:[],safe=plan.mode==="DEFERRED"&&ops.length>0&&ops.every(x=>REBASE_SAFE.has(String(x?.op||"").toUpperCase()));\n return safe?{ok:true,rebased:true,rebasedFrom:base,currentRevision:current}:{ok:false,stale:true,currentRevision:current,baseRevision:base}',
              ' const ops=Array.isArray(patch?.operations)?patch.operations:[],gap=Math.max(0,current-base),safe=plan.mode==="DEFERRED"&&gap>0&&gap<=MAX_DEFERRED_REBASE_GAP&&ops.length>0&&ops.every(x=>REBASE_SAFE.has(String(x?.op||"").toUpperCase()));\n return safe?{ok:true,rebased:true,rebasedFrom:base,currentRevision:current,revisionGap:gap}:{ok:false,stale:true,currentRevision:current,baseRevision:base,revisionGap:gap}'
          )

          # 2) Resolve possession claims in generated suggestions back to canonical inventory.
          text = read("src/contextual-actions.js")
          text, n = re.subn(
              r'const POSSESSION_ITEM=.*?;\nconst SPECIAL_POWER=',
              '''const POSSESSION_ITEM_PATTERNS=[\n /從(?:口袋|背包|行囊|隨身(?:物品|攜帶(?:物)?)?|身上).{0,18}?(?:取出|拿出|掏出|抽出|摸出)\\s*([^，。；,.;!?！？]{2,60})/gi,\n /(?:取出|拿出|掏出|抽出|摸出|舉起|展示|交出|遞出|使用|安裝|套入|卡入)\\s*(?:手中|隨身|身上|剛取得的|先前取得的|目前持有的)?\\s*([^，。；,.;!?！？]{2,60})/gi,\n /(?:將|把)\\s*(?:(?:手中|隨身|身上)(?:的)?|搜出的|剛取得的|先前取得的)\\s*([^，。；,.;!?！？]{2,60}?)(?:舉起|展示|交出|遞出|放入|置於|套入|卡入|安裝|使用|打開|傾斜|收回)/gi\n];\nconst POSSESSION_CAUSAL_PATTERNS=[\n /([^，。；,.;!?！？]{2,50})(?:為|是)(?:剛|先前|目前)?(?:取得|持有|攜帶|收起|搜出|獲得)的?(?:關鍵)?物品/gi,\n /(?:你|玩家)?(?:身上|隨身)?(?:持有|攜帶|帶著|擁有)\\s*(?:該|這|那)?\\s*([^，。；,.;!?！？]{2,60})/gi\n];\nconst SPECIAL_POWER=''',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit(f"src/contextual-actions.js: possession constant patch matched {n}")
          text, n = re.subn(
              r'function impliedInventoryItem\(action=""\)\{\n.*?\n\}\nfunction playerCapabilityLabels',
              '''function normalizeClaimedItem(value=""){\n return clean(value,70).replace(/^(?:(?:手中|隨身|身上)(?:的)?|(?:剛|先前|目前)取得的|搜出的|該|那|這)\\s*/,"").replace(/^(?:一)?(?:個|枚|片|件|瓶|把|本|張|塊|顆|粒)?\\s*/,"").replace(/(?:給(?:眼前|身旁|旁邊|對方|他|她|那名|這名)|向(?:眼前|身旁|旁邊|對方|他|她)|以便|來(?:確認|檢查|觀察)).*$/,"").trim()\n}\nfunction possessionItemClaims(row={}){\n const out=[];for(const value of [String(row?.action||row||""),String(row?.causalBasis||"")])for(const pattern of [...POSSESSION_ITEM_PATTERNS,...POSSESSION_CAUSAL_PATTERNS])for(const match of value.matchAll(pattern)){for(const part of String(match?.[1]||"").split(/\\s*(?:與|和|及|、)\\s*/)){const item=normalizeClaimedItem(part);if(item&&!out.includes(item))out.push(item)}}return out.slice(0,8)\n}\nfunction inventoryClaimGrounded(state,claim){\n const compact=value=>clean(value,90).replace(/的/g,"").replace(/\\s+/g,""),target=compact(claim);if(!target)return false;return inventoryRows(state).some(item=>{const id=String(item?.id||""),name=compact(item?.name||"");return (id&&target===id)||(name&&Math.min(name.length,target.length)>=2&&(name===target||name.includes(target)||target.includes(name)))})\n}\nfunction playerCapabilityLabels''',
              text,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f"src/contextual-actions.js: possession function patch matched {n}")
          old = ' const implied=impliedInventoryItem(x.action);\n if(implied&&!inventoryRows(state).some(item=>[item?.id,item?.name].some(v=>v&&String(v)===implied)))reasons.push("IMPLIED_ITEM_MISSING:"+implied);'
          new = ' const claims=possessionItemClaims(x),implied=claims[0]||null;\n for(const claim of claims)if(!inventoryClaimGrounded(state,claim))reasons.push("IMPLIED_ITEM_MISSING:"+claim);'
          if old not in text:
              raise SystemExit("src/contextual-actions.js: evaluate possession block not found")
          text = text.replace(old, new, 1)
          write("src/contextual-actions.js", text)

          # 3) Sanitize NPC display labels at the visibility boundary, while retaining canonical IDs.
          replace_once(
              "src/player-entity-visibility.js",
              'const clean=(v,max=180)=>typeof v==="string"?v.normalize("NFC").replace(/[\\u0000-\\u001f\\u007f]/g,"").trim().slice(0,max):"";',
              'const clean=(v,max=180)=>typeof v==="string"?v.normalize("NFC").replace(/[\\u0000-\\u001f\\u007f]/g,"").trim().slice(0,max):"";\nconst entityLabel=(v,max=80)=>clean(v,max).replace(/^[\\s\\"\'“”‘’「」『』，,。！？!?；;：:]+|[\\s\\"\'“”‘’「」『』，,。！？!?；;：:]+$/g,"").trim();'
          )
          text = read("src/player-entity-visibility.js")
          text = text.replace('clean(npc?.observableAlias||npc?.playerAlias,80)', 'entityLabel(npc?.observableAlias||npc?.playerAlias,80)')
          text = text.replace('clean(npc.name,80)', 'entityLabel(npc.name,80)')
          text = text.replace('clean(npc?.name,80)', 'entityLabel(npc?.name,80)')
          write("src/player-entity-visibility.js", text)

          # 4) Reject player-facing scenes that claim newly acquired items absent from canonical inventory.
          replace_once(
              "src/scene-provenance.js",
              'const clean=(value,max=500)=>String(value??"").trim().slice(0,max);\nconst list=value=>Array.isArray(value)?value:[];',
              'const clean=(value,max=500)=>String(value??"").trim().slice(0,max);\nconst entityName=(value,max=120)=>clean(value,max).replace(/^[\\s\\"\'“”‘’「」『』，,。！？!?；;：:]+|[\\s\\"\'“”‘’「」『』，,。！？!?；;：:]+$/g,"").trim();\nconst list=value=>Array.isArray(value)?value:[];'
          )
          replace_once(
              "src/scene-provenance.js",
              'function names(values=[]){return [...new Set(list(values).map(x=>clean(x,120)).filter(Boolean))]}',
              'function names(values=[]){return [...new Set(list(values).map(x=>entityName(x,120)).filter(Boolean))]}'
          )
          replace_once(
              "src/scene-provenance.js",
              'function foreignNpcIssues(value,scope={}){const text=String(value||""),present=new Set(names(scope.presentNpcNames)),issues=[];for(const name of names(scope.allNpcNames)){if(name&&!present.has(name)&&text.includes(name))issues.push({type:"NPC_NOT_PRESENT",value:name})}return issues}',
              'const ACQUIRED_ITEM=/(?:取得|獲得|拾起|撿起|拿到|取走|收下|順手帶出)\\s*([^。！？\\n]{2,90})/g;\nfunction normalizeItemClaim(value=""){return clean(value,90).replace(/^(?:同時|再)?\\s*/,"").replace(/^(?:那|這)?(?:一)?(?:個|枚|片|件|瓶|把|本|張|塊|顆|粒)?\\s*/,"").trim()}\nfunction acquiredItemClaims(value=""){const out=[];for(const match of String(value||"").matchAll(ACQUIRED_ITEM))for(const part of String(match?.[1]||"").split(/\\s*(?:與|和|及|、)\\s*/)){const item=normalizeItemClaim(part);if(item&&!out.includes(item))out.push(item)}return out}\nfunction inventoryClaimGrounded(claim,scope={}){const compact=value=>entityName(value,120).replace(/的/g,"").replace(/\\s+/g,""),target=compact(claim);if(!target)return true;return names(scope.inventoryNames).some(name=>{const known=compact(name);return known&&Math.min(known.length,target.length)>=2&&(known===target||known.includes(target)||target.includes(known))})}\nfunction foreignInventoryIssues(value,scope={}){return acquiredItemClaims(value).filter(claim=>!inventoryClaimGrounded(claim,scope)).map(claim=>({type:"SCENE_ITEM_NOT_CANONICAL",value:claim}))}\nfunction foreignNpcIssues(value,scope={}){const text=String(value||""),present=new Set(names(scope.presentNpcNames)),issues=[];for(const name of names(scope.allNpcNames)){if(name&&!present.has(name)&&text.includes(name))issues.push({type:"NPC_NOT_PRESENT",value:name})}return issues}'
          )
          replace_once(
              "src/scene-provenance.js",
              'issues.push(...foreignNpcIssues(narrative+"\\n"+sceneTitle,scope));for(const speaker of speakerPrefixes(narrative))',
              'issues.push(...foreignNpcIssues(narrative+"\\n"+sceneTitle,scope));issues.push(...foreignInventoryIssues(narrative,scope));for(const speaker of speakerPrefixes(narrative))'
          )

          # 5) Harden Scene Narrator contract against unsupported item/state conclusions.
          replace_once(
              "src/ai-runtime-contracts.js",
              '不得無中生有新線索。嚴守玩家 POV 與名稱知識邊界',
              '不得無中生有新線索。玩家取得、持有、拿出、展示、交出、安裝或使用的物品，只能來自 snapshot.inventory 或 kernel.allowedVisibleFacts 明確列出的本回合取得物；禁止為了豐富敘事順手增加配給券、瓶子、材料、掉落物或其他不存在物件。物件比對、來源、匹配與否若未出現在 kernel.allowedVisibleFacts，不得自行下肯定或否定結論。嚴守玩家 POV 與名稱知識邊界'
          )
          replace_once(
              "src/ai-runtime-contracts.js",
              '每個 suggestion 都必須先基於 snapshot 確認因果與必要前提，填 causalBasis 並令 requirementsSatisfied=true；如果前提未滿足就不要輸出該 suggestion。',
              '每個 suggestion 都必須先基於 snapshot 確認因果與必要前提，填 causalBasis 並令 requirementsSatisfied=true；若 action 涉及拿出、使用、展示、交出、安裝或消耗既有物品，requiredItemIds 必須逐一列出 snapshot.inventory 中對應的 canonical id，找不到 id 就不要輸出候選，禁止用 causalBasis 宣稱玩家擁有 snapshot.inventory 不存在的物品；如果前提未滿足就不要輸出該 suggestion。'
          )

          # 6) Add inventory to provenance scope and expire stale Deferred work before it calls AI.
          replace_once(
              "app.js",
              'return {worldId,currentLocation:String(playerVisibleLocationName(state)||rawLocation||""),locationDescription:String(location?.description||""),presentNpcNames:present.map(n=>String(playerVisibleNpcName(state,n)||"")).filter(Boolean),allNpcNames:npcs.map(n=>String(n?.name||"")).filter(Boolean),knownLocations:locations.filter(x=>x?.known===true||x===location).map(x=>String(x?.name||"")).filter(Boolean),visibleEventTexts}',
              'return {worldId,currentLocation:String(playerVisibleLocationName(state)||rawLocation||""),locationDescription:String(location?.description||""),presentNpcNames:present.map(n=>String(playerVisibleNpcName(state,n)||"")).filter(Boolean),allNpcNames:npcs.map(n=>String(playerVisibleNpcName(state,n)||n?.name||"")).filter(Boolean),knownLocations:locations.filter(x=>x?.known===true||x===location).map(x=>String(x?.name||"")).filter(Boolean),inventoryNames:(state.inventory||[]).filter(x=>(Number(x?.quantity)||1)>0).map(x=>String(x?.name||"")).filter(Boolean),visibleEventTexts}'
          )
          old = '  const snapshot=buildSnapshot(state),basePlan=task.plan||planStateSync({action:task.action,intent:task.intent||{},roll:task.roll||{},snapshot}),plan=deferredPlanFrom(basePlan,currentStateRevision(state));\n  const patch=await generateStatePatch(task.action,task.roll,snapshot,plan,{signal:ctrl.signal,intent:task.intent});'
          new = '  const snapshot=buildSnapshot(state),basePlan=task.plan||planStateSync({action:task.action,intent:task.intent||{},roll:task.roll||{},snapshot}),plan=deferredPlanFrom(basePlan,currentStateRevision(state)),queuedAgeMs=Math.max(0,Date.now()-Number(task.queuedAt||Date.now())),expired=plan.expired===true||queuedAgeMs>120000;\n  if(expired){deferredDirector.queue.shift();removePersistedDeferredTurn(task.id);state.events??=[];state.events.push({id:crypto.randomUUID?.()||Math.random().toString(36).slice(2),type:"DEFERRED_TURN_EXPIRED",visibility:"INTERNAL",action:task.action,originRevision:plan.originRevision,currentRevision:plan.currentRevision,revisionGap:plan.revisionGap,queuedAgeMs,day:state.world?.state?.day||1,at:Date.now()});recordDebug("DEFERRED_TURN_EXPIRED",{action:task.action,originRevision:plan.originRevision,currentRevision:plan.currentRevision,revisionGap:plan.revisionGap,queuedAgeMs});await persist(state,sessionToken).catch(()=>{});return}\n  const patch=await generateStatePatch(task.action,task.roll,snapshot,plan,{signal:ctrl.signal,intent:task.intent});'
          replace_once("app.js", old, new)

          # 7) Regression tests for the v0.59.8 long-run failures.
          test = r'''import test from "node:test";
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          import {deferredPlanFrom,assessPatchRevision,MAX_DEFERRED_REBASE_GAP} from "../src/state-sync.js";
          import {evaluateSuggestionRequirements} from "../src/contextual-actions.js";
          import {validateSceneProvenance} from "../src/scene-provenance.js";
          import {sceneNarratorSystem} from "../src/ai-runtime-contracts.js";

          function baseState(inventory=[]){return {
           world:{id:"W",state:{day:1},registry:{locations:[{id:"L1",name:"礦道入口",known:true}],npcs:[{id:"N1",name:"斷脈礦工”，",known:true,nameKnown:true,alive:true,locationId:"L1"}],sideQuests:[]},creation:{blueprint:{difficulty:"normal"}}},
           player:{location:"礦道入口",status:"ACTIVE",difficulty:"normal",skills:{OBSERVE:1,SOCIAL:1},magic:{knownSpells:[]}},
           quests:{main:{title:"追查規則",objectives:["找出下一個可驗證線索"],status:"ACTIVE"}},events:[],inventory
          }}

          test("stale Deferred work keeps its origin revision and expires instead of rebasing across a long session",()=>{
           const plan=deferredPlanFrom({mode:"DEFERRED",baseRevision:2,deferredCapabilities:["NPC_RELATIONSHIP_SIGNAL"],deferredDirty:["npcRelation"]},10);
           assert.equal(MAX_DEFERRED_REBASE_GAP,4);assert.equal(plan.baseRevision,2);assert.equal(plan.originRevision,2);assert.equal(plan.currentRevision,10);assert.equal(plan.revisionGap,8);assert.equal(plan.expired,true);
           const stale=assessPatchRevision({stateSync:{revision:10}},{baseRevision:2,operations:[{op:"NPC_RELATIONSHIP_SIGNAL",npcId:"N1",effect:"POSITIVE"}]},plan);assert.equal(stale.ok,false);assert.equal(stale.stale,true);
           const nearPlan=deferredPlanFrom({mode:"DEFERRED",baseRevision:8,deferredCapabilities:["NPC_RELATIONSHIP_SIGNAL"],deferredDirty:["npcRelation"]},10),near=assessPatchRevision({stateSync:{revision:10}},{baseRevision:8,operations:[{op:"NPC_RELATIONSHIP_SIGNAL",npcId:"N1",effect:"POSITIVE"}]},nearPlan);assert.equal(near.ok,true);assert.equal(near.rebased,true)
          });

          test("suggestions cannot smuggle hallucinated inventory through empty requiredItemIds",()=>{
           const s=baseState([{id:"ITEM-GEAR",name:"磨損黃銅齒輪",quantity:1}]);
           const rows=[
            {action:"從隨身攜帶中取出一小塊可確認的生物能源",causalBasis:"用已有物品測試",requirementsSatisfied:true,requiredItemIds:[]},
            {action:"拿出礦區配給券與黃銅齒輪給眼前的陌生人看",causalBasis:"展示持有物",requirementsSatisfied:true,requiredItemIds:[]},
            {action:"傾斜無標玻璃瓶，觀察液體變化",causalBasis:"玻璃瓶為剛取得的關鍵物品",requirementsSatisfied:true,requiredItemIds:[]}
           ];
           for(const row of rows){const result=evaluateSuggestionRequirements(s,row);assert.equal(result.ok,false,row.action);assert.ok(result.reasons.some(x=>x.startsWith("IMPLIED_ITEM_MISSING:")),JSON.stringify(result))}
           const valid=evaluateSuggestionRequirements(s,{action:"拿出磨損黃銅齒輪給眼前的陌生人看",causalBasis:"背包內已有該齒輪",requirementsSatisfied:true,requiredItemIds:["ITEM-GEAR"]});assert.equal(valid.ok,true,JSON.stringify(valid))
          });

          test("scene provenance rejects invented acquisitions and normalizes dirty NPC display punctuation",()=>{
           const scope={currentLocation:"礦道入口",locationDescription:"閘門旁的礦道入口",presentNpcNames:["斷脈礦工”，"],allNpcNames:["斷脈礦工”，"],knownLocations:["礦道入口"],inventoryNames:["磨損黃銅齒輪"],visibleEventTexts:[]};
           const bad=validateSceneProvenance({sceneTitle:"取走齒輪",narrative:"你取走磨損黃銅齒輪，同時順手帶出一張泛黃的礦區配給券與一個無標玻璃瓶。斷脈礦工看著你。"},scope);assert.equal(bad.valid,false);assert.ok(bad.issues.some(x=>x.type==="SCENE_ITEM_NOT_CANONICAL"));assert.equal(bad.issues.some(x=>x.type==="NPC_NOT_PRESENT"),false);
           const good=validateSceneProvenance({sceneTitle:"取走齒輪",narrative:"你取得那枚磨損的黃銅齒輪。斷脈礦工看著你。"},scope);assert.equal(good.valid,true,JSON.stringify(good.issues))
          });

          test("scene contract forbids unsupported item acquisition and unsupported comparison conclusions",()=>{
           const prompt=sceneNarratorSystem();assert.match(prompt,/snapshot\.inventory/);assert.match(prompt,/requiredItemIds/);assert.match(prompt,/物件比對、來源、匹配與否/);assert.match(prompt,/找不到 id 就不要輸出候選/)
          });

          test("runtime drops expired Deferred tasks before asking State AI",async()=>{
           const app=await readFile(new URL("../app.js",import.meta.url),"utf8");assert.match(app,/DEFERRED_TURN_EXPIRED/);assert.match(app,/queuedAgeMs>120000/);const start=app.indexOf("async function runDeferredDirector"),end=app.indexOf("function scheduleHistoryDeepening",start),block=app.slice(start,end);assert.ok(block.indexOf("if(expired)")<block.indexOf("generateStatePatch(task.action"))
          });
          '''
          test = "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()) + "\n"
          write("test/v05910-runtime-integrity.test.js", test)

          # 8) Propagate browser cache tokens only through import edges touched by this change.
          expected = "59009"
          changed = {"app.js","src/state-sync.js","src/contextual-actions.js","src/player-entity-visibility.js","src/scene-provenance.js","src/ai-runtime-contracts.js"}
          browser_files = [Path("app.js"), *Path("src").rglob("*.js")]
          import_re = re.compile(r'(?P<prefix>from\s+["\'])(?P<spec>\.{1,2}/[^"\']+?\.js)\?v=(?P<token>\d+)(?P<suffix>["\'])')

          def resolve(importer, spec):
              base = Path(importer).parent
              return os.path.normpath(str(base / spec)).replace("\\\\", "/")

          progress = True
          while progress:
              progress = False
              for path in browser_files:
                  importer = path.as_posix()
                  source = read(importer)
                  touched = False
                  def repl(match):
                      nonlocal touched
                      target = resolve(importer, match.group("spec"))
                      if target in changed and match.group("token") != expected:
                          touched = True
                          return match.group("prefix") + match.group("spec") + "?v=" + expected + match.group("suffix")
                      return match.group(0)
                  updated = import_re.sub(repl, source)
                  if touched:
                      write(importer, updated);changed.add(importer);progress = True

          # Ensure index already points at current app cache generation.
          index = read("index.html")
          if 'app.js?v=59009' not in index:
              raise SystemExit("index.html does not expose app.js?v=59009")

          # Remove this one-shot workflow from the final branch tree.
          Path(".github/workflows/apply-runtime-integrity-hotfix.yml").unlink()
          print("Changed browser modules:", sorted(changed))
          PY
          npm test
          npm run check:cache-bust
      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bound deferred state and ground runtime entities"
          git push origin HEAD:fix/v05910-runtime-integrity
