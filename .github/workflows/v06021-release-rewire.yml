name: Temporary v0.60.21 release rewire
on:
  push:
    branches: [fix/v06021-suggestion-click-ja-locale]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'rewire v0.60.21 release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06021-suggestion-click-ja-locale
      - name: Rewire current browser release only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); before=s
          replacements={
            './src/version.js?v=60020':'./src/version.js?v=60021',
            './src/v06020-contextual-actions-hotfix.js?v=60020':'./src/v06021-contextual-actions-hotfix.js?v=60021',
            'src/v06020-runtime-ui-hotfix.js?v=60020':'src/v06021-runtime-ui-hotfix.js?v=60021',
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing index edge: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          paths=[
            'test/v06011-ja-runtime-coherence.test.js',
            'test/v06014-manual-regressions.test.js',
            'test/v06015-action-ui-coherence.test.js',
            'test/v06015-ja-live-regressions.test.js',
            'test/v06019-ja-manual-regressions.test.js',
            'test/v06020-ja-manual-regressions.test.js',
            'test/version-0551-release.test.js',
            'test/version-ui.test.js',
          ]
          for name in paths:
            q=Path(name); t=q.read_text(encoding='utf-8'); old=t
            t=t.replace('"0.60.20"','"0.60.21"')
            t=t.replace('0\\.60\\.20','0\\.60\\.21')
            t=t.replace('through the v0.60.20 release','through the v0.60.21 release')
            t=t.replace('v0.60.20 import-map','v0.60.21 import-map')
            t=t.replace('v0.60.20 release wiring','v0.60.21 release wiring')
            t=t.replace('Official v0.60.20 release contract','Official v0.60.21 release contract')
            t=t.replace('v0.60.20 is the canonical app and browser cache release','v0.60.21 is the canonical app and browser cache release')
            t=t.replace('// v0.60.20 release contract','// v0.60.21 release contract')
            t=t.replace('version\\.js\\?v=60020','version\\.js\\?v=60021')
            t=t.replace('v06020-contextual-actions-hotfix\\.js\\?v=60020','v06021-contextual-actions-hotfix\\.js\\?v=60021')
            t=t.replace('v06020-runtime-ui-hotfix\\.js\\?v=60020','v06021-runtime-ui-hotfix\\.js\\?v=60021')
            if t!=old:q.write_text(t,encoding='utf-8')
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'v06021-contextual-actions-hotfix.js?v=60021' index.html
          grep -q 'v06021-runtime-ui-hotfix.js?v=60021' index.html
          grep -q 'version.js?v=60021' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html test/v06011-ja-runtime-coherence.test.js test/v06014-manual-regressions.test.js test/v06015-action-ui-coherence.test.js test/v06015-ja-live-regressions.test.js test/v06019-ja-manual-regressions.test.js test/v06020-ja-manual-regressions.test.js test/version-0551-release.test.js test/version-ui.test.js
          git commit -m "release: rewire v0.60.21 release"
          git push origin HEAD:fix/v06021-suggestion-click-ja-locale
