name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused v0.60.12 regressions
        run: node --test test/v06011-foreground-timeout-contract.test.js test/v06011-ja-runtime-coherence.test.js test/v06010-ja-world-creation-regression.test.js test/v0609-ja-turn-export-regression.test.js test/v0608-runtime-self-repair.test.js test/v0607-i18n-turn-recovery.test.js test/trpg-depth-e2e-v060.test.js test/story-rhythm-v0606.test.js test/drive-engine-v0605.test.js test/talent-rules-v0604.test.js test/npc-agency-v0603.test.js test/social-conflict-v0602.test.js test/combat-v0601.test.js test/trpg-depth-v060.test.js test/v05915-ja-suggestion-locale-regression.test.js test/v05915-ja-suggestion-render-invariant.test.js test/v05914-opening-scene-npc-dock-debug-regressions.test.js test/v05914-proactive-world-enrichment.test.js test/v05913-runtime-integrity-observability.test.js test/v05912-ai-output-repair.test.js test/v05911-origin-hud-regressions.test.js test/v05908-runtime-recovery.test.js test/background-world-evolution.test.js test/history-lazy-deepen-v047.test.js test/contextual-actions.test.js test/nonblocking-turn-sync.test.js test/progressive-world-builder-v05410.test.js test/debug-telemetry.test.js test/version-policy.test.js test/first-button-stall-recovery-v05419.test.js test/ai-autotest-first-button-hotfix.test.js test/v05904-creator-locale-regressions.test.js test/viewport-stability.test.js test/dice-feedback.test.js test/v05903-locale-completeness.test.js test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Full Node test suite
        run: node --test
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
