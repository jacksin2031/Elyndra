name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up primary Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ github.event_name == 'pull_request' && '20' || '24' }}

      - name: Version contract
        run: npm run version:check

      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs

      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py

      - name: Full regression suite
        run: npm test

      - name: Set up secondary Node compatibility runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ github.event_name == 'pull_request' && '24' || '20' }}

      - name: Secondary Node release compatibility gate
        run: |
          npm run version:check
          npm test

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build runtime-only Pages artifact
        run: node scripts/build-pages-artifact.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify deployed v0.61.8 source and rendered badge
        shell: bash
        run: |
          set -euo pipefail
          site="${{ steps.deployment.outputs.page_url }}"
          version_url="${site}src/version.js?v=61008"
          settings_url="${site}src/v06028-ai-settings-hotfix.js?v=61008"
          quality_url="${site}src/v06029-world-quality-hotfix.js?v=61008"
          compiler_url="${site}src/v06028-turn-compiler-hotfix.js?v=61008"
          source_ok=0
          for attempt in $(seq 1 12); do
            version_body="$(curl -fsSL --retry 2 --retry-delay 1 "$version_url" || true)"
            settings_body="$(curl -fsSL --retry 2 --retry-delay 1 "$settings_url" || true)"
            quality_body="$(curl -fsSL --retry 2 --retry-delay 1 "$quality_url" || true)"
            compiler_body="$(curl -fsSL --retry 2 --retry-delay 1 "$compiler_url" || true)"
            if grep -q 'APP_VERSION="0.61.8"' <<<"$version_body" && grep -q 'V06029_AGNES_BACKGROUND_TASK_ALIAS' <<<"$settings_body" && grep -q 'RETRY_AFTER_FAILURE' <<<"$quality_body" && grep -q 'recoverPriorAiSuggestions' <<<"$compiler_body"; then
              source_ok=1
              break
            fi
            sleep 5
          done
          test "$source_ok" -eq 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "${site}?live-smoke=${GITHUB_SHA}" > live-dom.html
          grep -E 'id="versionBadge"[^>]*>v0\.61\.8</div>' live-dom.html
