name: v0.59.5 Japanese AutoTest hardening
on:
  push:
    branches: [fix/v0.59.5-ja-autotest-hardening]
    paths: [scripts/v0595_hotfix.py.gz.b64]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0.59.5-ja-autotest-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v0.59.5 patch
        run: base64 -d scripts/v0595_hotfix.py.gz.b64 | gzip -dc > /tmp/v0595_hotfix.py && python3 /tmp/v0595_hotfix.py
      - name: Version contract
        run: npm run version:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused regressions
        run: node --test test/v05905-ja-autotest-hardening.test.js test/v05904-creator-locale-regressions.test.js test/v05903-locale-completeness.test.js test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/v05416-regressions.test.js test/ai-autotest-first-button-hotfix.test.js test/runtime-expansion-staged-v0548.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Diff check
        run: git diff --check
      - name: Commit source changes
        run: |
          git config user.name 'elyndra-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html package.json README.md src/ai-client.js src/locale-runtime.js src/v0594-static-i18n.js src/version.js test/v05901-i18n-coverage.test.js test/v05905-ja-autotest-hardening.test.js docs/releases/v0.59.5.md
          git commit -m 'v0.59.5: harden Japanese AutoTest runtime'
          git push origin HEAD:fix/v0.59.5-ja-autotest-hardening
