name: v0.60.30 release patch
on:
  push:
    branches: [fix/v06030-observation-progress]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch v0.60.30 browser wiring and release assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements={
            '"./src/version.js?v=60010":"./src/version.js?v=60029"':'"./src/version.js?v=60010":"./src/version.js?v=60030"',
            '"./src/world-registry.js?v=57025":"./src/v06023-world-registry-hotfix.js?v=60023"':'"./src/world-registry.js?v=57025":"./src/v06030-world-registry-hotfix.js?v=60030"',
            'app.js?v=60029':'app.js?v=60030',
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'INDEX_PATCH_MISS: {old}')
            s=s.replace(old,new)
          state_map='"./src/state-sync.js?v=57025":"./src/v06030-state-sync-hotfix.js?v=60030",'
          if state_map not in s:
            anchor='"./src/world-quality.js?v=57025":"./src/v06029-world-quality-hotfix.js?v=60029"'
            if anchor not in s: raise SystemExit('INDEX_STATE_MAP_ANCHOR_MISS')
            s=s.replace(anchor,state_map+anchor)
          p.write_text(s)

          for p in Path('test').glob('*.test.js'):
            s=p.read_text(); original=s
            s=s.replace('0.60.29','0.60.30').replace('0\\.60\\.29','0\\.60\\.30')
            s=s.replace('app\\.js\\?v=60029','app\\.js\\?v=60030')
            s=s.replace('app.js?v=60029','app.js?v=60030')
            s=s.replace('version\\.js\\?v=60029','version\\.js\\?v=60030')
            s=s.replace('version.js?v=60029','version.js?v=60030')
            s=s.replace('"./src/version.js?v=60010":"./src/version.js?v=60029"','"./src/version.js?v=60010":"./src/version.js?v=60030"')
            s=s.replace('"\\.\\/src\\/version\\.js\\?v=60010":"\\.\\/src\\/version\\.js\\?v=60029"','"\\.\\/src\\/version\\.js\\?v=60010":"\\.\\/src\\/version\\.js\\?v=60030"')
            if s!=original:p.write_text(s)
          PY
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: main
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Focused progression regressions
        run: node --test test/v06030-observation-progress-regression.test.js test/v06025-observation-narrative-regression.test.js test/v0561-runtime-grounding.test.js test/contextual-actions.test.js test/runtime-visibility.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit integrated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html test
          git diff --cached --quiet && exit 0
          git commit -m "chore: wire v0.60.30 observation progress release"
          git push
