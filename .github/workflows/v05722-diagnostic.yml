name: v0.57.22 non-download diagnostic
on:
  push:
    branches: [fix/v0.57.22-native-artifact-export]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply v0.57.22 patch
        run: python scripts/v05722_patch.py
      - name: Apply v0.57.22 cache/release refine
        run: python scripts/v05722_refine.py
      - name: Capture non-download regression output
        id: nondownload
        shell: bash
        run: |
          set +e
          npm run test:nondownload > stdout.txt 2> stderr.txt
          code=$?
          echo "$code" > exit-code.txt
          grep -nE '^(not ok|# fail|# tests|# pass|# duration)|AssertionError|ERR_ASSERTION|expected|actual|Error:' stdout.txt stderr.txt > fail-lines.txt || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: v05722-nondownload-diagnostic
          path: |
            stdout.txt
            stderr.txt
            exit-code.txt
            fail-lines.txt
          if-no-files-found: error
      - name: Preserve failing conclusion
        if: steps.nondownload.outputs.exit_code != '0'
        run: exit 1
