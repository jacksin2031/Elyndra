name: Apply v0.60.10 hotfix
on:
  push:
    branches: [fix/v06010-ja-world-creation]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply v0.60.10 Japanese creation hotfix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v06010-ja-world-creation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Correct generated regression fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_v06010.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(',allowedElements:"灯台守の失踪"','')
          s=s.replace(' assert.deepEqual(blueprint.rules.allowed,["灯台守の失踪"]);\n','')
          s=s.replace(".replace('ai-client\\\\.js\\\\?v=60009','ai-client\\\\.js\\\\?v=60009')", ".replace('ai-client\\\\.js\\\\?v=60009','ai-client\\\\.js\\\\?v=60009').replace('world-creation\\\\.js\\\\?v=59003','world-creation\\\\.js\\\\?v=60010')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 scripts/patch_v06010.py
      - name: Keep workflow files out of Actions-token commit
        run: git restore --source=HEAD -- .github/workflows/pages.yml .github/workflows/patch-v06010.yml
      - name: Diff integrity
        run: git diff --check
      - name: JavaScript syntax
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Release and live-regression tests
        run: node --test test/v06010-ja-world-creation-regression.test.js test/v0609-ja-turn-export-regression.test.js test/v05900-multilingual-runtime.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Commit patch
        run: |
          git config user.name "JackSin"
          git config user.email "a24dc523@dhw.ac.jp"
          git add -A
          git commit -m "v0.60.10: apply Japanese creation hotfix"
          git push origin HEAD:fix/v06010-ja-world-creation
