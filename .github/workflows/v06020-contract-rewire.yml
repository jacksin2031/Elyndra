name: Temporary v0.60.20 contract rewire
on:
  push:
    branches: [fix/v06020-ja-manual-regressions]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'rewire v0.60.20 release contracts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06020-ja-manual-regressions
      - name: Update only current-release assertions
        shell: python
        run: |
          from pathlib import Path
          paths=[
            'test/v06011-ja-runtime-coherence.test.js',
            'test/v06014-manual-regressions.test.js',
            'test/v06015-ja-live-regressions.test.js',
            'test/v06019-ja-manual-regressions.test.js',
            'test/version-0551-release.test.js',
            'test/version-ui.test.js',
          ]
          for name in paths:
            p=Path(name); s=p.read_text(encoding='utf-8'); before=s
            s=s.replace('"0.60.19"','"0.60.20"')
            s=s.replace('0\\.60\\.19','0\\.60\\.20')
            s=s.replace('through the v0.60.19 release','through the v0.60.20 release')
            s=s.replace('v0.60.19 import-map','v0.60.20 import-map')
            s=s.replace('v0.60.19 release wiring','v0.60.20 release wiring')
            s=s.replace('Official v0.60.19 release contract','Official v0.60.20 release contract')
            s=s.replace('v0.60.19 is the canonical app and browser cache release','v0.60.20 is the canonical app and browser cache release')
            s=s.replace('// v0.60.19 release contract','// v0.60.20 release contract')
            s=s.replace('version\\.js\\?v=60019','version\\.js\\?v=60020')
            s=s.replace('v06019-contextual-actions-hotfix\\.js\\?v=60019','v06020-contextual-actions-hotfix\\.js\\?v=60020')
            s=s.replace('v06019-runtime-ui-hotfix\\.js\\?v=60019','v06020-runtime-ui-hotfix\\.js\\?v=60020')
            if s!=before: p.write_text(s,encoding='utf-8')
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          git diff -- test/v06011-ja-runtime-coherence.test.js test/v06014-manual-regressions.test.js test/v06015-ja-live-regressions.test.js test/v06019-ja-manual-regressions.test.js test/version-0551-release.test.js test/version-ui.test.js
          test -n "$(git status --porcelain)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/v06011-ja-runtime-coherence.test.js test/v06014-manual-regressions.test.js test/v06015-ja-live-regressions.test.js test/v06019-ja-manual-regressions.test.js test/version-0551-release.test.js test/version-ui.test.js
          git commit -m "test: rewire v0.60.20 release contracts"
          git push origin HEAD:fix/v06020-ja-manual-regressions
