name: v0.59.15 cache closure
on:
  push:
    branches: [fix/v05915-ja-action-suggestions]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Propagate v0.59.15 cache tokens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'src/adventure-engine.js': [('./contextual-actions.js?v=57029','./contextual-actions.js?v=59015')],
            'app.js': [('./src/adventure-engine.js?v=59014','./src/adventure-engine.js?v=59015')],
          }
          for path, reps in replacements.items():
              p=Path(path); s=p.read_text()
              for old,new in reps:
                  if old not in s:
                      raise SystemExit(f'CACHE_PATCH_MISS {path}: {old}')
                  s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: main
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Focused v0.59.15 regressions
        run: node --test test/v05915-ja-suggestion-locale-regression.test.js test/v05915-ja-suggestion-render-invariant.test.js test/contextual-actions.test.js test/v05914-opening-scene-npc-dock-debug-regressions.test.js test/v05900-multilingual-runtime.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit cache closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/adventure-engine.js
          git commit -m "chore: propagate v0.59.15 browser cache tokens"
          git push
