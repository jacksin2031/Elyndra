name: Temporary Cast Chronology Patch

on:
  push:
    paths:
      - '.github/workflows/tmp-cast-chronology-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply chronology guard
        run: python scripts/tmp-cast-chronology-patch.py
      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm scripts/tmp-cast-chronology-patch.py
          rm .github/workflows/tmp-cast-chronology-patch.yml
          git config user.name 'JackSin'
          git config user.email 'a24dc523@dhw.ac.jp'
          git add src/world-compiler.js scripts/tmp-cast-chronology-patch.py .github/workflows/tmp-cast-chronology-patch.yml
          git commit -m 'fix: reject implausible opening cast chronology'
          git push origin HEAD:main
