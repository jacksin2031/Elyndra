name: TRPG Depth v0.60 Acceptance Bootstrap
on:
  push:
    branches:
      - test/trpg-depth-v060-acceptance
permissions:
  contents: write
concurrency:
  group: trpg-v060-acceptance-bootstrap
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply acceptance fixes
        run: python3 scripts/trpg-v060-acceptance-fix.py
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-rhythm-v060
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: End-to-end acceptance
        run: node --test test/trpg-depth-e2e-v060.test.js
      - name: Story Rhythm regressions
        run: node --test test/story-rhythm-v0606.test.js
      - name: Drive regressions
        run: node --test test/drive-engine-v0605.test.js
      - name: Talent regressions
        run: node --test test/talent-rules-v0604.test.js
      - name: NPC Agency regressions
        run: node --test test/npc-agency-v0603.test.js
      - name: Social Conflict regressions
        run: node --test test/social-conflict-v0602.test.js
      - name: Combat regressions
        run: node --test test/combat-v0601.test.js
      - name: TRPG foundation regressions
        run: node --test test/trpg-depth-v060.test.js
      - name: Release/UI contracts
        run: node --test test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit validated fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add app.js src/game-engine.js src/combat-engine.js src/adventure-engine.js test/combat-v0601.test.js test/trpg-depth-e2e-v060.test.js
            git commit -m "fix: close TRPG Depth cross-system acceptance gaps"
            git push origin HEAD:test/trpg-depth-v060-acceptance
          fi
