name: v0.59.15 Japanese suggestion hotfix
on:
  push:
    branches: [fix/v05915-ja-action-suggestions]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Japanese suggestion locale fix
        run: node scripts/v05915-ja-suggestion-hotfix.mjs
      - name: Remove one-shot machinery
        run: rm -f scripts/v05915-ja-suggestion-hotfix.mjs .github/workflows/v05915-ja-suggestion-hotfix.yml
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: main
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused Japanese suggestion regressions
        run: node --test test/v05915-ja-suggestion-locale-regression.test.js test/v05914-opening-scene-npc-dock-debug-regressions.test.js test/v05914-proactive-world-enrichment.test.js test/v05913-runtime-integrity-observability.test.js test/v05912-ai-output-repair.test.js test/v05900-multilingual-runtime.test.js test/contextual-actions.test.js test/version-ui.test.js test/version-0551-release.test.js test/v05901-i18n-coverage.test.js
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Japanese contextual action suggestions"
          git push
