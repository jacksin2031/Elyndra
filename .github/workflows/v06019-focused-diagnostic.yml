name: Diagnose v0.60.19 focused suite
on:
  push:
    branches: [fix/v06019-ja-manual-regressions]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[v06019-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture focused test report
        run: |
          mkdir -p docs
          node --test --test-reporter=spec test/v06019-ja-manual-regressions.test.js test/v06015-action-ui-coherence.test.js test/v06015-ja-live-regressions.test.js test/v06014-manual-regressions.test.js test/v06013-ja-fallback-watchdog-regression.test.js test/v06011-foreground-timeout-contract.test.js test/v06011-ja-runtime-coherence.test.js test/v06010-ja-world-creation-regression.test.js test/v0609-ja-turn-export-regression.test.js test/v0608-runtime-self-repair.test.js test/v0607-i18n-turn-recovery.test.js test/trpg-depth-e2e-v060.test.js test/story-rhythm-v0606.test.js test/drive-engine-v0605.test.js test/talent-rules-v0604.test.js test/npc-agency-v0603.test.js test/social-conflict-v0602.test.js test/combat-v0601.test.js test/trpg-depth-v060.test.js test/v05915-ja-suggestion-locale-regression.test.js test/v05915-ja-suggestion-render-invariant.test.js test/v05914-opening-scene-npc-dock-debug-regressions.test.js test/v05914-proactive-world-enrichment.test.js test/v05913-runtime-integrity-observability.test.js test/v05912-ai-output-repair.test.js test/v05911-origin-hud-regressions.test.js test/v05908-runtime-recovery.test.js test/background-world-evolution.test.js test/history-lazy-deepen-v047.test.js test/contextual-actions.test.js test/nonblocking-turn-sync.test.js test/progressive-world-builder-v05410.test.js test/debug-telemetry.test.js test/version-policy.test.js test/first-button-stall-recovery-v05419.test.js test/ai-autotest-first-button-hotfix.test.js test/v05904-creator-locale-regressions.test.js test/viewport-stability.test.js test/dice-feedback.test.js test/v05903-locale-completeness.test.js test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js > docs/v06019-focused-diagnostic.txt 2>&1 || true
      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/v06019-focused-diagnostic.txt
          git commit -m "chore: capture v0.60.19 focused diagnostic [v06019-diagnostic]"
          git push origin HEAD:${GITHUB_REF_NAME}
