name: TRPG Depth Finalize
on:
  push:
    branches: [feat/trpg-depth-v060-foundation]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Wire TRPG depth contracts and cache graph
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/ai-runtime-contracts.js')
          s=p.read_text(encoding='utf-8')
          a='actionIntent.targetId 只可使用 snapshot.registry 中實際存在的 canonical id；'
          b='actionIntent.approach 必須描述玩家採用的方法，goal 描述直接目的，stakes.desiredOutcome/acceptedRisk 只整理玩家已表達的目標與可接受風險，不得替玩家增加動機或代價。actionIntent.targetId 只可使用 snapshot.registry 中實際存在的 canonical id；'
          if a not in s: raise SystemExit('ACTION_ASSESS anchor missing')
          s=s.replace(a,b,1)
          a='不要把骰子結果改寫成「行動成功，但是否出現新資訊」之類機械模板；'
          b='不要把骰子結果改寫成「行動成功，但是否出現新資訊」之類機械模板；kernel.resolution.tier 是更細的結果層：STRONG_SUCCESS 直接成立、SUCCESS_WITH_COST 必須讓代價可感知、FAILURE_WITH_OPPORTUNITY 必須讓局勢繼續而不能偷改成成功、CRITICAL_FAILURE 必須保留不利變化。玩家可見 narrative/sceneTitle 絕對不可輸出 Engine、State Director、commit、world state、validator、canonical state 等內部術語，也不可說「任務進度仍以世界狀態為準」這類法律聲明；把約束轉譯成純場景 fiction。'
          if a not in s: raise SystemExit('Scene Narrator anchor missing')
          p.write_text(s.replace(a,b,1),encoding='utf-8')

          p=Path('index.html');s=p.read_text(encoding='utf-8')
          old='{"imports":{"./src/origin-runtime.js?v=57025":"./src/origin-runtime.js?v=59014"}}'
          new='{"imports":{"./src/origin-runtime.js?v=57025":"./src/origin-runtime.js?v=59014","./src/action-intent.js?v=57025":"./src/action-intent.js?v=59015","./src/turn-outcome.js?v=57025":"./src/turn-outcome.js?v=59015","./src/ai-runtime-contracts.js?v=59000":"./src/ai-runtime-contracts.js?v=59015"}}'
          if old not in s: raise SystemExit('importmap anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('.github/workflows/pages.yml');s=p.read_text(encoding='utf-8')
          old='run: node --test test/v05915-ja-suggestion-locale-regression.test.js'
          new='run: node --test test/trpg-depth-v060.test.js test/v05915-ja-suggestion-locale-regression.test.js'
          if old not in s: raise SystemExit('Pages test anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: main
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: TRPG Depth regressions
        run: node --test test/trpg-depth-v060.test.js test/ai-runtime-kernel.test.js test/ai-runtime-v037.test.js
      - name: Commit finalized foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai-runtime-contracts.js index.html .github/workflows/pages.yml
          git commit -m "feat: wire TRPG depth runtime contracts"
          git push origin HEAD:feat/trpg-depth-v060-foundation
