name: v0.57.21 nondownload diagnostic
on:
  push:
    branches:
      - fix/v0.57.21-autotest-latency-recovery
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply release bump
        run: python scripts/v05721_release_patch.py
      - name: Apply AI recovery patch
        run: python scripts/v05721_ai_patch.py
      - name: Apply UI provenance and Codex bridge patch
        run: python scripts/v05721_app_patch.py
      - name: Apply regression compatibility fix
        run: python scripts/v05721_regression_fix.py
      - name: Run non-download suite and capture output
        id: nondownload
        shell: bash
        run: |
          set +e
          npm run test:nondownload > stdout.txt 2> stderr.txt
          code=$?
          echo "$code" > exit-code.txt
          grep -nE '(^not ok|FAIL|AssertionError|ERR_ASSERTION|Expected|actual:|expected:|test at |Subtest:)' stdout.txt stderr.txt > fail-lines.txt || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: v05721-nondownload-diagnostic
          path: |
            stdout.txt
            stderr.txt
            fail-lines.txt
            exit-code.txt
          if-no-files-found: error
      - name: Preserve test conclusion
        run: |
          test "${{ steps.nondownload.outputs.exit_code }}" = "0"
