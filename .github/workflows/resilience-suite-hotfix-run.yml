name: Elyndra resilience suite hotfix runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resilience-suite-hotfix-run.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply resilience fixes from staged patch
        shell: bash
        run: |
          awk '/^          python3 <<'\''PY'\''$/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag {sub(/^          /,""); print}' .github/workflows/resilience-suite-hotfix.yml > /tmp/elyndra-resilience-patch.py
          test -s /tmp/elyndra-resilience-patch.py
          python3 /tmp/elyndra-resilience-patch.py
      - name: Run full test suite
        run: npm test
      - name: Commit tested hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resilience-suite-hotfix.yml .github/workflows/resilience-suite-hotfix-run.yml
          git add app.js src/state-sync.js src/model-json.js src/ai-settings.js src/world-quality.js src/ai-autotest.js test/model-json.test.js test/v0561-runtime-grounding.test.js test/autotest-resilience-v0572.test.js
          git commit -m "fix: harden AutoTest state and AI resilience"
          git push origin HEAD:main
