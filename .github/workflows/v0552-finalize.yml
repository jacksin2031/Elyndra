name: v0552-finalize

on:
  push:
    branches:
      - fix/v0.55.2-runtime-autotest
    paths:
      - .github/workflows/v0552-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.55.2-runtime-autotest
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v0.55.2 finalization patches
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8'),write=(p,s)=>fs.writeFileSync(p,s);
          function replaceOne(source,from,to,label){const parts=source.split(from);if(parts.length!==2)throw new Error(`${label}: expected exactly one match, got ${parts.length-1}`);return parts[0]+to+parts[1]}
          const pkg=JSON.parse(read('package.json'));pkg.version='0.55.2';write('package.json',JSON.stringify(pkg,null,2)+'\n');
          write('src/version.js','export const APP_VERSION="0.55.2";\n');

          let contextual=read('src/contextual-actions.js');
          contextual=replaceOne(contextual,
            'const POSSESSION_ITEM=/從(?:口袋|背包|行囊|隨身物品|身上).{0,18}?(?:取出|拿出|掏出|抽出)\\s*([^，。；、,.;!?！？]{2,36})|(?:展示|出示|拿出)\\s*(?:一(?:個|枚|片|件|瓶|把|本|張|塊|顆|粒))?\\s*([^，。；、,.;!?！？]{2,36})/i;',
            'const POSSESSION_ITEM=/從(?:口袋|背包|行囊|隨身物品|身上).{0,18}?(?:取出|拿出|掏出|抽出)\\s*([^，。；、,.;!?！？]{2,36})/i;',
            'narrow possession inference');
          contextual=replaceOne(contextual,
            'const SPECIAL_POWER=/靈能感知|靈能操控|魔力感知|魔法感知|精神感知|心靈感應|透視|讀心|念動|telepathy|clairvoyance|psychic sense/i;',
            'const SPECIAL_POWER=/(?:利用|使用|施展|啟動|釋放|透過|以)\\s*(靈能感知|靈能操控|魔力感知|魔法感知|精神感知|心靈感應|透視|讀心|念動|telepathy|clairvoyance|psychic sense)/i;',
            'narrow special power inference');
          contextual=replaceOne(contextual,'const special=x.action.match(SPECIAL_POWER)?.[0];','const special=x.action.match(SPECIAL_POWER)?.[1];','special power capture');
          contextual=replaceOne(contextual,
            'filter(x=>x&&isFresh(x)&&(x.source!=="AI"||Boolean(x.causalBasis))&&(!x.prevalidated||!x.validatedContext||contextSealCurrent(state,x.validatedContext))&&evaluateSuggestionRequirements(state,x).ok),8);',
            'filter(x=>x&&isFresh(x)&&x.requirementsSatisfied===true&&(x.source!=="AI"||Boolean(x.causalBasis))&&(!x.prevalidated||!x.validatedContext||contextSealCurrent(state,x.validatedContext))&&evaluateSuggestionRequirements(state,x).ok),8);',
            'preserve explicit requirements false as deny');
          contextual=replaceOne(contextual,'confidence:corrected?90:98','confidence:corrected?90:96','preserve prevalidation confidence contract');
          contextual=replaceOne(contextual,'if(!target||target===current||Array.isArray(target.accessRequirements)&&target.accessRequirements.length||target.known!==true)continue;','if(!target||target===current||Array.isArray(target.accessRequirements)&&target.accessRequirements.length)continue;','preserve grounded hidden travel reveal contract');
          write('src/contextual-actions.js',contextual);

          let auto=read('src/ai-autotest.js');
          auto=replaceOne(auto,'./ai-settings.js?v=55001','./ai-settings.js?v=55002','ai-autotest -> ai-settings cache');
          write('src/ai-autotest.js',auto);

          let app=read('app.js');
          app=app.replace(/from "(\.\/src\/[^\"]+\.js)\?v=55001";/g,'from "$1?v=55002";');
          if(!app.includes('./src/ai-autotest.js?v=55002'))throw new Error('app cache bump failed');
          app=replaceOne(app,
            'const qualitySettled=!backgroundQualityNeed(gameState).required;',
            'const finalQuality=gameState?.world?.quality||{},qualitySettled=!backgroundQualityNeed(gameState).required&&finalQuality.pending!==true&&finalQuality.backgroundPending!==true&&String(finalQuality.status||"").toUpperCase()!=="PENDING";',
            'final quality settlement predicate');
          app=replaceOne(app,
            'recordDebug("AUTOTEST_FINAL_QUALITY_SETTLED",{worldIndex:developerAutotest.worldIndex,turn:developerAutotest.turn,qualitySettled});',
            'const finalQualitySettleKey=[gameState?.world?.id||"",developerAutotest.turn,qualitySettled].join(":");if(developerAutotest.finalQualitySettleKey!==finalQualitySettleKey){developerAutotest.finalQualitySettleKey=finalQualitySettleKey;recordDebug("AUTOTEST_FINAL_QUALITY_SETTLED",{worldIndex:developerAutotest.worldIndex,turn:developerAutotest.turn,qualitySettled})}',
            'final quality telemetry dedupe');
          write('app.js',app);

          let html=read('index.html');html=replaceOne(html,'app.js?v=55001','app.js?v=55002','index app cache');write('index.html',html);

          let t=read('test/ai-settings.test.js');t=t.replace(/ai-settings\\\.js\\\?v=55001/g,'ai-settings\\.js\\?v=55002');write('test/ai-settings.test.js',t);
          t=read('test/first-button-fast-path-v05417.test.js');t=t.replace(/app\\\.js\\\?v=55001/g,'app\\.js\\?v=55002');write('test/first-button-fast-path-v05417.test.js',t);
          t=read('test/module-cache.test.js');
          t=t.replace('v0.54.19 keeps structured AI and Developer Autotest cache graphs coherent','v0.55.2 keeps structured AI and Developer Autotest cache graphs coherent')
             .replace(/app\\\.js\\\?v=55001/g,'app\\.js\\?v=55002')
             .replace('appImports.every(x=>x==="55001")','appImports.every(x=>x==="55002")')
             .replace('appImports.includes("55001")','appImports.includes("55002")')
             .replace('["54018","540181","55001"]','["54018","540181","55001","55002"]');
          write('test/module-cache.test.js',t);
          t=read('test/version-0551-release.test.js');t=t.replaceAll('v0.55.1','v0.55.2').replaceAll('0.55.1','0.55.2').replaceAll('0\\.55\\.1','0\\.55\\.2').replaceAll('55001','55002');write('test/version-0551-release.test.js',t);
          t=read('test/version-ui.test.js');t=t.replaceAll('v0.55.1','v0.55.2').replaceAll('"0.55.1"','"0.55.2"').replaceAll('55001','55002');write('test/version-ui.test.js',t);
          NODE
      - name: Verify full test suite and capture failures
        shell: bash
        run: |
          set +e
          npm test > /tmp/v0552-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -B 15 -A 45 '^not ok' /tmp/v0552-test.log > /tmp/v0552-failures.log || true
            printf '\n===== SUMMARY =====\n' >> /tmp/v0552-failures.log
            tail -n 20 /tmp/v0552-test.log >> /tmp/v0552-failures.log
            git reset --hard HEAD
            cp /tmp/v0552-failures.log .v0552-test-failures.log
            git config user.name "Elyndra v0.55.2 Finalizer"
            git config user.email "actions@users.noreply.github.com"
            git add .v0552-test-failures.log
            git commit -m "ci: capture exact v0.55.2 test failures" || true
            git push origin HEAD:fix/v0.55.2-runtime-autotest
            exit "$status"
          fi
      - name: Commit verified v0.55.2 and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Elyndra v0.55.2 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v0552-finalize.yml
          git rm -f .v0552-test-failures.log || true
          git add package.json src/version.js src/contextual-actions.js src/ai-autotest.js app.js index.html test/ai-settings.test.js test/first-button-fast-path-v05417.test.js test/module-cache.test.js test/version-0551-release.test.js test/version-ui.test.js
          git commit -m "v0.55.2: harden runtime recovery and autotest resilience"
          git push origin HEAD:fix/v0.55.2-runtime-autotest
