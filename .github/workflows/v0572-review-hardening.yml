name: Apply v0.57.2 product hardening
on:
  push:
    branches: [fix/v0.57.2-review-hardening]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v0.57.2-review-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply focused product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding="utf-8")
          def write(path,text): Path(path).write_text(text,encoding="utf-8")
          def replace_once(path,old,new):
              text=read(path)
              if text.count(old)!=1: raise SystemExit(f"expected one marker in {path}, got {text.count(old)}")
              write(path,text.replace(old,new,1))

          replace_once("package.json",'"version": "0.57.1"','"version": "0.57.2"')
          replace_once("src/version.js",'APP_VERSION="0.57.1"','APP_VERSION="0.57.2"')

          p="src/quest-engine.js"
          replace_once(p,'const linked=resolveNpcCommitment(state,npc,q.commitmentId,"KEPT",`玩家完成了「${q.title}」。`);if(!linked.ok)return false}','const linked=resolveNpcCommitment(state,npc,q.commitmentId,"KEPT",`玩家完成了「${q.title}」。`);if(!linked.ok||linked.commitment?.status!=="KEPT")return false}')

          p="src/state-validator.js"
          item_marker='const ITEM_EFFECTS=new Set(["RESTORE_HP","RESTORE_SATIETY","REDUCE_FATIGUE","REDUCE_EXPOSURE","REDUCE_INJURY","REDUCE_MAGIC_STRAIN"]);\n'
          helpers='''const QUEST_LIFECYCLE_STATUSES=new Set(["HIDDEN","DISCOVERABLE","OFFERED","ACTIVE","DECLINED","EXPIRED","FAILED","ABANDONED","COMPLETED"]);\nconst COMMITMENT_STATUSES=new Set(["OPEN","KEPT","BROKEN","EXPIRED"]);\nfunction validCommitment(x){return obj(x)&&typeof x.id==="string"&&Boolean(x.id)&&COMMITMENT_STATUSES.has(String(x.status||"").toUpperCase())&&(x.questId==null||typeof x.questId==="string")&&(x.targetId==null||typeof x.targetId==="string")}\nfunction validNpcCognition(x){if(!obj(x))return false;if(x.memory!=null&&(!obj(x.memory)||!arr(x.memory.recent||[])||!arr(x.memory.longTerm||[])))return false;if(x.beliefs!=null&&!arr(x.beliefs))return false;if(x.relationships!=null&&!obj(x.relationships))return false;if(x.commitments!=null&&(!arr(x.commitments)||x.commitments.some(c=>!validCommitment(c))))return false;if(x.planner!=null&&!obj(x.planner))return false;return true}\nfunction validateQuestCommitmentLinks(registry,errors){\n const npcById=new Map(registry.npcs.map(n=>[n.id,n])),questById=new Map(registry.sideQuests.map(q=>[q.id,q]));\n for(const npc of registry.npcs)if(npc.cognition!=null&&!validNpcCognition(npc.cognition))errors.push("NPC_COGNITION_INVALID");\n for(const q of registry.sideQuests){\n  const status=String(q.status||"").toUpperCase();if(q.status!=null&&!QUEST_LIFECYCLE_STATUSES.has(status))errors.push("QUEST_LIFECYCLE_INVALID");if(q.issuerNpcId&&!npcById.has(q.issuerNpcId))errors.push("QUEST_ISSUER_INVALID");if(!q.commitmentId)continue;\n  const issuer=npcById.get(q.issuerNpcId),commitments=issuer?.cognition?.commitments,commitment=Array.isArray(commitments)?commitments.find(c=>c.id===q.commitmentId):null;\n  if(!issuer||!commitment||commitment.questId!==q.id||commitment.targetId!==issuer.id){errors.push("QUEST_COMMITMENT_LINK_INVALID");continue}\n  const cStatus=String(commitment.status||"").toUpperCase();\n  if(status==="ACTIVE"&&cStatus!=="OPEN")errors.push("QUEST_COMMITMENT_STATE_INVALID");\n  if(status==="COMPLETED"&&cStatus!=="KEPT")errors.push("QUEST_COMMITMENT_STATE_INVALID");\n  if(status==="ABANDONED"&&cStatus!=="BROKEN")errors.push("QUEST_COMMITMENT_STATE_INVALID");\n  if(status==="FAILED"&&!["BROKEN","EXPIRED"].includes(cStatus))errors.push("QUEST_COMMITMENT_STATE_INVALID");\n  if(status==="EXPIRED"&&cStatus!=="EXPIRED")errors.push("QUEST_COMMITMENT_STATE_INVALID");\n  if(["HIDDEN","DISCOVERABLE","OFFERED","DECLINED"].includes(status))errors.push("QUEST_COMMITMENT_STATE_INVALID")\n }\n for(const npc of registry.npcs)for(const commitment of Array.isArray(npc.cognition?.commitments)?npc.cognition.commitments:[]){if(!commitment.questId)continue;const quest=questById.get(commitment.questId);if(!quest||quest.issuerNpcId!==npc.id||quest.commitmentId!==commitment.id)errors.push("QUEST_COMMITMENT_LINK_INVALID")}\n}\n'''
          replace_once(p,item_marker,item_marker+helpers)
          quest_marker='  if(registry.sideQuests.some(x=>!validEntity(x,"title")))errors.push("QUEST_REGISTRY_INVALID")\n'
          replace_once(p,quest_marker,quest_marker+'  validateQuestCommitmentLinks(registry,errors)\n')

          # Patch-release cache generation. This is intentionally mechanical.
          for path in [Path("app.js"),*Path("src").rglob("*.js"),*Path("test").rglob("*.js")]:
              write(path,read(path).replace("?v=57001","?v=57002"))
          html=read("index.html")
          html=re.sub(r'(app\.js\?v=)\d+',r'\g<1>57002',html)
          write("index.html",html)

          for path in ["test/version-0551-release.test.js","test/version-ui.test.js"]:
              text=read(path).replace("0.57.1","0.57.2").replace("0\\.57\\.1","0\\.57\\.2").replace("57001","57002")
              write(path,text)

          p="test/module-cache.test.js"
          text=read(p).replace("57001","57002")
          text=text.replace("v0.56.1 keeps structured AI and Developer Autotest cache graphs coherent","v0.57.2 keeps structured AI and Developer Autotest cache graphs coherent")
          text=text.replace("v0.56.1 cache generation","v0.57.2 cache generation").replace("v0.56.1 cache token","v0.57.2 cache token")
          write(p,text)

          test=r'''import test from "node:test";
          import assert from "node:assert/strict";
          import {acceptNpcSideQuest} from "../src/npc-quest-interaction.js";
          import {completeSideQuest} from "../src/quest-engine.js";
          import {resolveNpcCommitment} from "../src/npc-cognition.js";
          import {validateSaveState} from "../src/state-validator.js";

          function state(){return {world:{id:"W",name:"測試界",state:{day:1},canon:{facts:[]},registry:{locations:[],npcs:[],factions:[],sideQuests:[]}},player:{name:"測試者",worldNameKnown:false,calendarKnown:false,hp:10,maxHp:10,gold:0,knowledgeScore:0,location:"",wallet:{}},inventory:[],knowledge:[],events:[],npcs:{},quests:{main:{objectives:[]}},suggestions:[],narrative:""}}
          function npc(s,id="NPC-A"){const n={id,name:"甲",trust:50,memories:[],behaviorProfile:{promises:[],grudges:[]}};s.world.registry.npcs.push(n);return n}
          function quest(s,n){const q={id:"Q-1",title:"測試任務",objective:"完成測試",issuerNpcId:n.id,known:true,status:"OFFERED",progress:0,target:1,evidence:[],conditions:[],matchedConditions:[],matchedKeywords:[]};s.world.registry.sideQuests.push(q);return q}

          test("v0.57.2 validator accepts a consistent quest commitment graph",()=>{const s=state(),n=npc(s),q=quest(s,n);const a=acceptNpcSideQuest(s,q.id,n.id);assert.equal(a.ok,true);const result=validateSaveState(s);assert.equal(result.valid,true,result.errors.join(","))});
          test("v0.57.2 validator rejects a commitment owned by the wrong NPC target",()=>{const s=state(),n=npc(s),q=quest(s,n);const a=acceptNpcSideQuest(s,q.id,n.id);a.commitment.targetId="NPC-B";const result=validateSaveState(s);assert.equal(result.valid,false);assert.ok(result.errors.includes("QUEST_COMMITMENT_LINK_INVALID"))});
          test("v0.57.2 validator rejects a missing quest issuer",()=>{const s=state(),n=npc(s),q=quest(s,n);q.issuerNpcId="NPC-MISSING";const result=validateSaveState(s);assert.equal(result.valid,false);assert.ok(result.errors.includes("QUEST_ISSUER_INVALID"))});
          test("v0.57.2 completion fails closed when linked commitment was already broken",()=>{const s=state(),n=npc(s),q=quest(s,n);const a=acceptNpcSideQuest(s,q.id,n.id);q.progress=1;resolveNpcCommitment(s,n,a.commitment.id,"BROKEN","先前已違約");assert.equal(a.commitment.status,"BROKEN");assert.equal(completeSideQuest(s,q.id),false);assert.equal(q.status,"ACTIVE");assert.equal(s.events.some(e=>e.type==="QUEST_COMPLETED"),false)});
          '''
          test="\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines())+"\n"
          write("test/v0572-review-hardening.test.js",test)
          PY
      - name: Verify complete suite against current main
        run: GITHUB_EVENT_NAME=pull_request GITHUB_BASE_REF=main CACHE_BASE_REF=main npm test
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "Elyndra Review Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json index.html app.js src test
          git commit -m "v0.57.2: complete quest integrity hardening"
          git push origin HEAD:fix/v0.57.2-review-hardening
