name: v0.57.20 recursion closure

on:
  push:
    branches:
      - fix/v0.57.20-observable-progression

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply suggestion recursion hardening
        run: python scripts/v05720_recursion_patch.py
      - name: Refine first-level grounded event handling
        run: python scripts/v05720_recursion_refine.py
      - name: Run focused v0.57.20 player-facing regressions
        run: node --test test/v05720-observable-progression.test.js test/v05720-suggestion-recursion.test.js
      - name: Run non-download regression suite
        run: npm run test:nondownload
      - name: Check diff
        run: git diff --check
      - name: Commit validated recursion hardening
        run: |
          rm scripts/v05720_recursion_patch.py scripts/v05720_recursion_refine.py .github/workflows/v05720-recursion-closure.yml
          git config user.name "elyndra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent recursive suggestion quoting"
          git push origin HEAD:fix/v0.57.20-observable-progression
