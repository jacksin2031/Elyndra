name: v0.57.20 closure

on:
  push:
    branches:
      - fix/v0.57.20-observable-progression

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply v0.57.20 patch
        run: python scripts/v05720_patch.py
      - name: Run focused observable progression regressions
        run: node --test test/v05720-observable-progression.test.js
      - name: Run non-download regression suite
        run: npm run test:nondownload
      - name: Check diff
        run: git diff --check
      - name: Commit validated v0.57.20 product
        run: |
          rm scripts/v05720_patch.py .github/workflows/v05720-closure.yml
          git config user.name "elyndra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: ground progression suggestions in observable scene evidence"
          git push origin HEAD:fix/v0.57.20-observable-progression
