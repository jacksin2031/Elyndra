name: v0.59.9 branch patcher
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-patcher.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - run: python3 scripts/v0599_patch_preflight.py
      - run: python3 scripts/v0599_patch.py
      - name: Make source contracts literal
        shell: python
        run: |
          from pathlib import Path
          p=Path('test/v05908-runtime-recovery.test.js'); s=p.read_text(); marker='test("v0.59.9 first-button recovery can bind'; head,sep,tail=s.partition(marker)
          if not sep: raise SystemExit('marker missing')
          replacement=r'''test("v0.59.9 source contracts",async()=>{
           const auto=await read("../src/ai-autotest.js"),app=await read("../app.js"),extra=await read("../src/ui-translations-extra.js"),fixed=await read("../src/v0594-static-i18n.js");
           for(const value of ["return {target,known:true}","unexplored={target,known:false}","FIRST_BUTTON_UNAVAILABLE_TRAVEL","targetId:destination.target.id","未探索の通行可能な出口または通路"])assert.ok(auto.includes(value),value);
           for(const value of ["waitForAutotestActionReady(config.disableTimeout===true?90000:38000)","AUTOTEST_PLAYER_ACTION_STILL_RUNNING",'suggestion:{label:decision.action||"",action:decision.action||"",kind:decision.kind',"travelSnapshot(gameState,{director:true}).routes.length===0","esc(lt(region.region))",'staticText("起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。")'])assert.ok(app.includes(value),value);
           for(const value of ["テストモード","自動テスト開始","起源の記憶","成長ルート","既知の世界地図","世界地図"])assert.ok(extra.includes(value)||fixed.includes(value)||auto.includes(value),value);
          });
          '''
          p.write_text(head+replacement)
      - name: Capture runtime regression
        id: runtime
        continue-on-error: true
        run: node --test test/v05908-runtime-recovery.test.js > /tmp/v0599-test-output.txt 2>&1
      - name: Persist output
        if: steps.runtime.outcome == 'failure'
        run: |
          cp /tmp/v0599-test-output.txt v0599-test-output-literal.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v0599-test-output-literal.txt
          git commit -m "chore: capture literal v0.59.9 regression output"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
      - if: steps.runtime.outcome == 'failure'
        run: exit 1
