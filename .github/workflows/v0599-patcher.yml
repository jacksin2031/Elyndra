name: v0.59.9 branch patcher
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-patcher.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - name: Prepare product patch
        run: python3 scripts/v0599_patch_preflight.py
      - name: Apply product patch
        run: python3 scripts/v0599_patch.py
      - name: Replace brittle generated source-shape regressions with behavior contracts
        shell: python
        run: |
          from pathlib import Path
          p=Path('test/v05908-runtime-recovery.test.js'); s=p.read_text(); marker='test("v0.59.9 first-button recovery can bind'; head,sep,tail=s.partition(marker)
          if not sep: raise SystemExit('v0.59.9 regression marker missing')
          replacement=r'''test("v0.59.9 grounded recovery and Japanese UI contracts",async()=>{
           const auto=await read("../src/ai-autotest.js"),app=await read("../app.js"),extra=await read("../src/ui-translations-extra.js"),fixed=await read("../src/v0594-static-i18n.js");
           for(const value of ["FIRST_BUTTON_UNAVAILABLE_TRAVEL","targetId:destination.target.id","未探索の通行可能な出口または通路"])assert.ok(auto.includes(value),value);
           for(const value of ["waitForAutotestActionReady(config.disableTimeout===true?90000:38000)","AUTOTEST_PLAYER_ACTION_STILL_RUNNING",'suggestion:{label:decision.action||"",action:decision.action||"",kind:decision.kind',"travelSnapshot(gameState,{director:true}).routes.length===0","esc(lt(region.region))",'staticText("起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。")'])assert.ok(app.includes(value),value);
           for(const value of ["テストモード","自動テスト開始","起源の記憶","成長ルート","既知の世界地図","世界地図"])assert.ok(extra.includes(value)||fixed.includes(value)||auto.includes(value),value);
          });
          '''
          p.write_text(head+replacement)
      - name: Version policy
        run: npm run version:check
      - name: JavaScript syntax
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Runtime recovery regression
        run: node --test test/v05908-runtime-recovery.test.js
      - name: First-button regression
        run: node --test test/ai-autotest-first-button-hotfix.test.js
      - name: Version UI regression
        run: node --test test/version-ui.test.js
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.js app.js index.html src/ai-autotest.js src/locale-runtime.js src/ui-translations-extra.js src/v0594-static-i18n.js test/v05908-runtime-recovery.test.js
          git commit -m "fix: v0.59.9 Japanese UI and grounded AutoTest progress"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
