name: v0.59.9 branch patcher
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-patcher.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - run: python3 scripts/v0599_patch_preflight.py
      - run: python3 scripts/v0599_patch.py
      - name: Capture runtime regression
        id: runtime
        continue-on-error: true
        run: node --test test/v05908-runtime-recovery.test.js > /tmp/v0599-test-output.txt 2>&1
      - name: Persist diagnostic on failure
        if: steps.runtime.outcome == 'failure'
        run: |
          cp /tmp/v0599-test-output.txt v0599-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v0599-test-output.txt
          git commit -m "chore: capture v0.59.9 regression output"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
      - name: Require runtime regression
        if: steps.runtime.outcome == 'failure'
        run: exit 1
