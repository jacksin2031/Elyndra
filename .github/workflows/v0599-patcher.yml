name: v0.59.9 branch patcher
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - name: Prepare product patch
        run: python3 scripts/v0599_patch_preflight.py
      - name: Apply product patch
        run: python3 scripts/v0599_patch.py
      - name: Version policy
        continue-on-error: true
        run: npm run version:check
      - name: JavaScript syntax
        continue-on-error: true
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        continue-on-error: true
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused regressions
        continue-on-error: true
        run: node --test test/v05908-runtime-recovery.test.js test/ai-autotest-first-button-hotfix.test.js test/version-ui.test.js
      - name: Diagnostic only
        run: exit 1
