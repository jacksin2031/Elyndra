name: v0.59.9 Japanese UI and AutoTest patcher
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - name: Apply v0.59.9 fixes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:120]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          # Version/cache wiring.
          p=Path('package.json'); d=json.loads(p.read_text()); d['version']='0.59.9'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          replace('src/version.js','0.59.8','0.59.9')
          p=Path('app.js'); s=p.read_text(); s=s.replace('?v=59008','?v=59009'); p.write_text(s)
          p=Path('index.html'); s=p.read_text(); s=s.replace('?v=59008','?v=59009'); p.write_text(s)
          p=Path('src/ai-autotest.js'); s=p.read_text(); s=s.replace('?v=59008','?v=59009'); p.write_text(s)
          p=Path('src/locale-runtime.js'); s=p.read_text(); s=s.replace('ui-translations-extra.js?v=59001','ui-translations-extra.js?v=59009'); p.write_text(s)

          # Deterministic static Japanese coverage for user-observed fixed strings.
          p=Path('src/v0594-static-i18n.js'); s=p.read_text()
          marker='});\nconst HANS_CHAR_MAP='
          if marker not in s: raise SystemExit('static i18n insertion marker missing')
          extra=''' "判斷":Object.freeze({en:"Check",ja:"判定"}),
 "斷片":Object.freeze({en:"Fragment",ja:"断片"}),
 "遮斷":Object.freeze({en:"Blocked",ja:"遮断"}),
 "世界狀態":Object.freeze({en:"World State",ja:"世界の状態"}),
 "在陌生世界活下來":Object.freeze({en:"Survive in an unfamiliar world",ja:"見知らぬ世界で生き延びる"}),
 "起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。":Object.freeze({en:"Your origin determines what you know at the start; your long-term choices shape how you act.",ja:"起源は開始時に何を知っているかを決め、長期的な選択があなた自身の行動様式を形作ります。"}),
 "身體狀況":Object.freeze({en:"Physical condition",ja:"身体状態"}),
 "起源記憶":Object.freeze({en:"Origin memories",ja:"起源の記憶"}),
 "沒有可直接帶入這個世界的既有常識。":Object.freeze({en:"No prior knowledge can be carried directly into this world.",ja:"この世界へ直接持ち込める既存の常識はありません。"}),
 "原有價值觀":Object.freeze({en:"Original values",ja:"元の価値観"}),
 "成長路線":Object.freeze({en:"Growth path",ja:"成長ルート"}),
 "尚未定型":Object.freeze({en:"Not yet defined",ja:"まだ定まっていない"}),
 "能力基礎":Object.freeze({en:"Core abilities",ja:"基礎能力"}),
 "累積經驗":Object.freeze({en:"Accumulated experience",ja:"蓄積経験"}),
 "已裝備工具":Object.freeze({en:"Equipped tools",ja:"装備中の道具"}),
 "同行者":Object.freeze({en:"Companions",ja:"同行者"}),
 "KNOWN WORLD MAP":Object.freeze({en:"KNOWN WORLD MAP",ja:"既知の世界地図"}),
 "世界地圖":Object.freeze({en:"World Map",ja:"世界地図"}),
 "REGION":Object.freeze({en:"REGION",ja:"地域"}),
 "CURRENT WEATHER":Object.freeze({en:"CURRENT WEATHER",ja:"現在の天候"}),
 "KNOWN ROUTES":Object.freeze({en:"KNOWN ROUTES",ja:"既知の経路"}),
 "KNOWN NPCS":Object.freeze({en:"KNOWN NPCS",ja:"既知の人物"}),
 "KNOWN FACTIONS":Object.freeze({en:"KNOWN FACTIONS",ja:"既知の勢力"}),
 "未知地點":Object.freeze({en:"Unknown location",ja:"未知の地点"}),
 "尚未掌握任何可定位的地點。":Object.freeze({en:"No locatable places are known yet.",ja:"位置を特定できる場所はまだ把握していません。"}),
 "尚未確認地點之間的路線":Object.freeze({en:"No routes between locations confirmed yet",ja:"地点間の経路はまだ確認されていません"}),
 "尚未遇到人物":Object.freeze({en:"No one encountered yet",ja:"まだ人物に出会っていません"}),
 "尚未確認勢力":Object.freeze({en:"No factions confirmed yet",ja:"確認済みの勢力はまだありません"}),
 "關係":Object.freeze({en:"Relation",ja:"関係"}),
 "ROAD":Object.freeze({en:"Road",ja:"道路"}),
 "ROUGH":Object.freeze({en:"Rough terrain",ja:"険しい地形"}),
 "WATER":Object.freeze({en:"Water route",ja:"水路"}),
 "WILDERNESS":Object.freeze({en:"Wilderness",ja:"荒野"}),
'''
          s=s.replace(marker,extra+marker,1); p.write_text(s)

          # Extra UI dictionary makes dynamically inserted modal/admin labels deterministic instead of AI-repair-dependent.
          p=Path('src/ui-translations-extra.js'); s=p.read_text()
          marker='});\n'
          insert=''' "AI 自動測試":r("AI 自動測試","AI 自动测试","AI AutoTest","AI自動テスト"),
 "測試模式":r("測試模式","测试模式","Test mode","テストモード"),
 "AI 遊玩測試":r("AI 遊玩測試","AI 游玩测试","AI playthrough","AIプレイテスト"),
 "隨機世界生成測試":r("隨機世界生成測試","随机世界生成测试","Random world generation test","ランダム世界生成テスト"),
 "隨機世界數量":r("隨機世界數量","随机世界数量","Random world count","ランダム世界数"),
 "遊玩難度":r("遊玩難度","游玩难度","Play difficulty","プレイ難易度"),
 "維持目前難度":r("維持目前難度","维持当前难度","Keep current difficulty","現在の難易度を維持"),
 "簡單":r("簡單","简单","Easy","簡単"),
 "普通":r("普通","普通","Normal","普通"),
 "困難":r("困難","困难","Hard","困難"),
 "現實":r("現實","现实","Realistic","リアル"),
 "難度矩陣：全部逐一測試":r("難度矩陣：全部逐一測試","难度矩阵：全部逐一测试","Difficulty matrix: test all","難易度マトリクス：すべてテスト"),
 "每個世界最多回合":r("每個世界最多回合","每个世界最多回合","Max turns per world","各世界の最大ターン数"),
 "停止條件":r("停止條件","停止条件","Stop condition","停止条件"),
 "只按回合上限":r("只按回合上限","仅按回合上限","Turn limit only","ターン上限のみ"),
 "玩家倒下":r("玩家倒下","玩家倒下","Player downed","プレイヤー戦闘不能"),
 "主線完成":r("主線完成","主线完成","Main quest complete","メインクエスト完了"),
 "知識分數達標":r("知識分數達標","知识分数达标","Knowledge score target","知識スコア到達"),
 "玩家等級達標":r("玩家等級達標","玩家等级达标","Player level target","プレイヤーレベル到達"),
 "發現數達標":r("發現數達標","发现数达标","Discovery target","発見数到達"),
 "錯誤數達標":r("錯誤數達標","错误数达标","Error count target","エラー数到達"),
 "自訂可觀察條件":r("自訂可觀察條件","自定义可观察条件","Custom observable condition","カスタム観測条件"),
 "條件目標值":r("條件目標值","条件目标值","Condition target","条件目標値"),
 "開始自動測試":r("開始自動測試","开始自动测试","Start AutoTest","自動テスト開始"),
 "停止測試":r("停止測試","停止测试","Stop test","テスト停止"),
 "遊玩策略":r("遊玩策略","游玩策略","Play strategy","プレイ戦略"),
 "AI 自主決策":r("AI 自主決策","AI 自主决策","AI decision","AI自律判断"),
 "固定第一個行動按鈕":r("固定第一個行動按鈕","固定第一个行动按钮","Always first action button","常に最初の行動ボタン"),
 "判斷":r("判斷","判断","Check","判定"),
 "斷片":r("斷片","断片","Fragment","断片"),
 "遮斷":r("遮斷","遮断","Blocked","遮断"),
 "世界狀態":r("世界狀態","世界状态","World State","世界の状態"),
 "在陌生世界活下來":r("在陌生世界活下來","在陌生世界活下来","Survive in an unfamiliar world","見知らぬ世界で生き延びる"),
 "起源記憶":r("起源記憶","起源记忆","Origin memories","起源の記憶"),
 "成長路線":r("成長路線","成长路线","Growth path","成長ルート"),
 "尚未定型":r("尚未定型","尚未定型","Not yet defined","まだ定まっていない"),
 "KNOWN WORLD MAP":r("已知世界地圖","已知世界地图","KNOWN WORLD MAP","既知の世界地図"),
 "世界地圖":r("世界地圖","世界地图","World Map","世界地図"),
 "REGION":r("地區","地区","REGION","地域"),
 "CURRENT WEATHER":r("目前天氣","当前天气","CURRENT WEATHER","現在の天候"),
 "KNOWN ROUTES":r("已知路線","已知路线","KNOWN ROUTES","既知の経路"),
 "KNOWN NPCS":r("已知人物","已知人物","KNOWN NPCS","既知の人物"),
 "KNOWN FACTIONS":r("已知勢力","已知势力","KNOWN FACTIONS","既知の勢力"),
'''
          pos=s.rfind(marker)
          if pos<0: raise SystemExit('extra ui insertion marker missing')
          s=s[:pos]+insert+s[pos:]; p.write_text(s)

          # AutoTest locale-aware labels/actions and grounded route recovery.
          p=Path('src/ai-autotest.js'); s=p.read_text()
          anchor='const decisionCircuits=new Map();\n'
          helper='''const AUTOTEST_COPY=Object.freeze({\n playStrategy:{"zh-Hant":"遊玩策略","zh-Hans":"游玩策略",en:"Play strategy",ja:"プレイ戦略"},\n aiDecision:{"zh-Hant":"AI 自主決策","zh-Hans":"AI 自主决策",en:"AI decision",ja:"AI自律判断"},\n firstButton:{"zh-Hant":"固定第一個行動按鈕","zh-Hans":"固定第一个行动按钮",en:"Always first action button",ja:"常に最初の行動ボタン"},\n observe:{"zh-Hant":"觀察四周並確認目前最明顯的變化","zh-Hans":"观察四周并确认目前最明显的变化",en:"Observe the surroundings and confirm the clearest current change",ja:"周囲を観察し、今もっとも明確な変化を確認する"},\n exploreExit:{"zh-Hant":"從目前位置選一條未探索的可通行出口或通道前進","zh-Hans":"从当前位置选择一条未探索的可通行出口或通道前进",en:"Take an unexplored passable exit or passage from the current location",ja:"現在地から未探索の通行可能な出口または通路を一つ選び、その先へ進む"}\n});\nfunction autotestLocale(){const id=String(globalThis?.ELYNDRA_LOCALE||"zh-Hant");return ["zh-Hant","zh-Hans","en","ja"].includes(id)?id:"zh-Hant"}\nfunction autotestCopy(key){const row=AUTOTEST_COPY[key]||{};return row[autotestLocale()]||row["zh-Hant"]||key}\nfunction autotestTravelAction(target,known){if(!known)return autotestCopy("exploreExit");const name=String(target?.name||"");if(autotestLocale()==="ja")return `${name}へ向かう`;if(autotestLocale()==="en")return `Travel to ${name}`;if(autotestLocale()==="zh-Hans")return `前往${name}`;return `前往${name}`}\n'''
          if helper not in s:
              if anchor not in s: raise SystemExit('autotest helper anchor missing')
              s=s.replace(anchor,anchor+helper,1)
          old=re.search(r'function firstButtonRecoveryDestination\(state=\{\}\)\{.*?\n\}',s,re.S)
          if not old: raise SystemExit('firstButtonRecoveryDestination missing')
          new='''function firstButtonRecoveryDestination(state={}){\n const locations=list(state.world?.registry?.locations),currentName=String(state.player?.location||state.world?.state?.location||""),current=locations.find(x=>x?.id===currentName||x?.name===currentName);if(!current)return null;\n const routes=list(ensureTravelNetwork(state)?.routes),byId=new Map(locations.map(x=>[String(x?.id||""),x]).filter(([id])=>id));let unexplored=null;\n for(const route of routes){if(!route||route.open===false)continue;let other="";if(String(route.fromId||"")===String(current.id||""))other=String(route.toId||"");else if(String(route.toId||"")===String(current.id||""))other=String(route.fromId||"");else continue;const target=byId.get(other);if(!target?.name||(Array.isArray(target.accessRequirements)&&target.accessRequirements.length))continue;if(target.known===true)return {target,known:true};if(!unexplored)unexplored={target,known:false}}\n return unexplored\n}'''
          s=s[:old.start()]+new+s[old.end():]
          old='const destination=firstButtonRecoveryDestination(state),recovered=destination?{mode:"free",suggestionIndex:null,action:`前往${destination.name}`,kind:"TRAVEL",progression:true,targetId:destination.id,combatAction:null,reason:"FIRST_BUTTON_STALL_RECOVERY",goalReached:false,goalEvidence:"",fallback:true}:deterministicAutotestDecision(snapshot,recentActions,"FIRST_BUTTON_STALL_RECOVERY")'
          new='const destination=firstButtonRecoveryDestination(state),recovered=destination?{mode:"free",suggestionIndex:null,action:autotestTravelAction(destination.target,destination.known),kind:"TRAVEL",progression:true,targetId:destination.target.id,combatAction:null,reason:"FIRST_BUTTON_STALL_RECOVERY",goalReached:false,goalEvidence:"",fallback:true}:deterministicAutotestDecision(snapshot,recentActions,"FIRST_BUTTON_STALL_RECOVERY")'
          if old not in s: raise SystemExit('stall destination expression missing')
          s=s.replace(old,new,1)
          old='const decision={mode:"free",suggestionIndex:null,action:"觀察四周並確認目前最明顯的變化",kind:"OBSERVE",progression:false,targetId:null,combatAction:null,reason:"FIRST_BUTTON_UNAVAILABLE_FALLBACK",goalReached:false,goalEvidence:"",firstButton:true};recordDebug("AUTOTEST_FIRST_BUTTON_UNAVAILABLE",{worldId,location:snapshot?.world?.location||"",fallbackAction:decision.action,stall});return decision'
          new='const destination=firstButtonRecoveryDestination(state);if(destination){const decision={mode:"free",suggestionIndex:null,action:autotestTravelAction(destination.target,destination.known),kind:"TRAVEL",progression:true,targetId:destination.target.id,combatAction:null,reason:"FIRST_BUTTON_UNAVAILABLE_TRAVEL",goalReached:false,goalEvidence:"",firstButton:true,firstButtonOverride:true};recordDebug("AUTOTEST_FIRST_BUTTON_UNAVAILABLE_TRAVEL",{worldId,location:snapshot?.world?.location||"",targetId:decision.targetId,targetKnown:destination.known});return decision}const decision={mode:"free",suggestionIndex:null,action:autotestCopy("observe"),kind:"OBSERVE",progression:false,targetId:null,combatAction:null,reason:"FIRST_BUTTON_UNAVAILABLE_FALLBACK",goalReached:false,goalEvidence:"",firstButton:true,firstButtonUnavailable:true};recordDebug("AUTOTEST_FIRST_BUTTON_UNAVAILABLE",{worldId,location:snapshot?.world?.location||"",fallbackAction:decision.action,stall});return decision'
          if old not in s: raise SystemExit('unavailable fallback missing')
          s=s.replace(old,new,1)
          old='label.innerHTML=\'遊玩策略<select id="autotestPlayStrategy"><option value="AI_DECISION">AI 自主決策</option><option value="FIRST_BUTTON">固定第一個行動按鈕</option></select>\''
          new='label.innerHTML=`${autotestCopy("playStrategy")}<select id="autotestPlayStrategy"><option value="AI_DECISION">${autotestCopy("aiDecision")}</option><option value="FIRST_BUTTON">${autotestCopy("firstButton")}</option></select>`'
          if old not in s: raise SystemExit('strategy ui string missing')
          s=s.replace(old,new,1); p.write_text(s)

          # App: static fallback translation, map translation, grounded AutoTest execution, and serialize FIRST_BUTTON turns.
          p=Path('app.js'); s=p.read_text()
          old='let activeLocale=saveLocale(loadLocale()),localeTransitionBusy=false;globalThis.ELYNDRA_LOCALE=activeLocale;const lt=value=>gameState?translatedText(gameState,value,activeLocale):String(value??"");'
          new='let activeLocale=saveLocale(loadLocale()),localeTransitionBusy=false;globalThis.ELYNDRA_LOCALE=activeLocale;const lt=value=>localizedStaticText(gameState?translatedText(gameState,value,activeLocale):String(value??""),activeLocale);'
          if old not in s: raise SystemExit('lt definition missing')
          s=s.replace(old,new,1)
          # Map dynamic world strings should use world locale data, not raw canon strings.
          reps={
           '`${esc(x.fromName)} ↔ ${esc(x.toName)} · ${Math.round(x.distanceKm)}km · ${esc(x.terrain)}`':'`${esc(lt(x.fromName))} ↔ ${esc(lt(x.toName))} · ${Math.round(x.distanceKm)}km · ${esc(staticText(x.terrain))}`',
           '<h3>${esc(region.region)}</h3>':'<h3>${esc(lt(region.region))}</h3>',
           '${esc(loc.name)}</strong>':'${esc(lt(loc.name))}</strong>',
           '${esc(loc.type||"未知地點")}':'${esc(loc.type?lt(loc.type):staticText("未知地點"))}',
           '<span>${esc(full.description)}</span>':'<span>${esc(lt(full.description))}</span>',
           '${esc(weather.observableName)}</h3><p>${esc(weather.sensoryCue||"")}</p>':'${esc(lt(weather.observableName))}</h3><p>${esc(lt(weather.sensoryCue||""))}</p>',
           '${esc(playerVisibleNpcName(gameState,x))} · ${esc(x.role)}':'${esc(lt(playerVisibleNpcName(gameState,x)))} · ${esc(lt(x.role))}',
           '<strong>${esc(x.name)}</strong> · 關係 ${x.playerReputation??0}<br><small>${esc(x.goal||"")}</small>':'<strong>${esc(lt(x.name))}</strong> · ${esc(staticText("關係"))} ${x.playerReputation??0}<br><small>${esc(lt(x.goal||""))}</small>'
          }
          for old,new in reps.items():
              if old not in s: raise SystemExit('map pattern missing: '+old[:80])
              s=s.replace(old,new,1)
          # Mixed character-status sentence cannot be repaired as an exact DOM node after interpolation.
          old='${esc(origin.label)} · 起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。'
          new='${esc(lt(origin.label))} · ${esc(staticText("起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。"))}'
          if old not in s: raise SystemExit('origin sentence missing')
          s=s.replace(old,new,1)
          old='${identity.committed?esc(identity.path.name):"尚未定型"}'
          new='${identity.committed?esc(lt(identity.path.name)):esc(staticText("尚未定型"))}'
          if old not in s: raise SystemExit('growth fallback missing')
          s=s.replace(old,new,1)
          # Free recovery decisions carry trusted kind/target metadata into the engine.
          old='await runAction("free",decision.action||"觀察四周並確認目前最明顯的變化")'
          new='await runAction("free",decision.action||staticText("觀察四周並確認目前最明顯的變化"),{suggestion:{label:decision.action||"",action:decision.action||"",kind:decision.kind||"",progression:decision.progression===true,targetId:decision.targetId||null}})'
          if old not in s: raise SystemExit('execute free fallback missing')
          s=s.replace(old,new,1)
          # A 3s pre-turn wait caused 44 blocked single-flight actions in the v0.59.8 retest.
          old='if(firstButtonFast)await waitForAutotestActionReady(3000);else await waitForAutotestIdle();'
          new='if(firstButtonFast){const ready=await waitForAutotestActionReady(config.disableTimeout===true?90000:38000);if(!ready)throw new Error("AUTOTEST_PLAYER_ACTION_STILL_RUNNING")}else await waitForAutotestIdle();'
          if old not in s: raise SystemExit('per-turn readiness wait missing')
          s=s.replace(old,new,1)
          # Sparse recovery is based on route graph too, not just registry location count.
          old='sparseWorld=(gameState.world?.registry?.locations||[]).length<=1&&turn>=5;'
          new='sparseWorld=((gameState.world?.registry?.locations||[]).length<=1||travelSnapshot(gameState,{director:true}).routes.length===0)&&turn>=3;'
          if old not in s: raise SystemExit('sparseWorld expression missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Add regression contracts to the suite already executed by Pages Node 20/24 matrix.
          p=Path('test/v05908-runtime-recovery.test.js'); s=p.read_text()
          addition=r'''

test("v0.59.9 first-button recovery can bind an unexplored canonical route without exposing its name",async()=>{
 const src=await read("../src/ai-autotest.js");
 assert.match(src,/return \{target,known:true\}/);
 assert.match(src,/unexplored=\{target,known:false\}/);
 assert.match(src,/FIRST_BUTTON_UNAVAILABLE_TRAVEL/);
 assert.match(src,/targetId:destination\.target\.id/);
 assert.match(src,/未探索の通行可能な出口または通路/);
});

test("v0.59.9 FIRST_BUTTON turns wait for the prior player action and keep recovery metadata",async()=>{
 const src=await read("../app.js");
 assert.match(src,/waitForAutotestActionReady\(config\.disableTimeout===true\?90000:38000\)/);
 assert.match(src,/AUTOTEST_PLAYER_ACTION_STILL_RUNNING/);
 assert.match(src,/suggestion:\{label:decision\.action\|\|"",action:decision\.action\|\|"",kind:decision\.kind/);
 assert.match(src,/travelSnapshot\(gameState,\{director:true\}\)\.routes\.length===0/);
});

test("v0.59.9 Japanese dynamic admin, character and world-map surfaces are deterministic",async()=>{
 const [app,auto,extra]=await Promise.all([read("../app.js"),read("../src/ai-autotest.js"),read("../src/ui-translations-extra.js")]);
 assert.match(extra,/"測試模式".*"テストモード"/);
 assert.match(extra,/"開始自動測試".*"自動テスト開始"/);
 assert.match(extra,/"KNOWN WORLD MAP".*"既知の世界地図"/);
 assert.match(auto,/autotestCopy\("playStrategy"\)/);
 assert.match(app,/esc\(lt\(region\.region\)\)/);
 assert.match(app,/staticText\("起源決定你一開始能知道甚麼；長期選擇則會形成你自己的做事方式。"\)/);
});
'''
          if 'v0.59.9 first-button recovery can bind' not in s: s+=addition
          p.write_text(s)

      - name: Validate generated patch
        run: |
          npm run version:check
          node scripts/check-js.mjs
          python3 scripts/scan-i18n-coverage.py
          node --test test/v05908-runtime-recovery.test.js test/ai-autotest-first-button-hotfix.test.js test/version-ui.test.js
