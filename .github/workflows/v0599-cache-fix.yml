name: Apply complete v0.59.9 cache propagation fix
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-cache-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - name: Propagate v0.59.9 cache token through changed module graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'app.js': [('./src/v0594-static-i18n.js?v=59004','./src/v0594-static-i18n.js?v=59009')],
            'src/ai-client.js': [('./ai-settings.js?v=59008','./ai-settings.js?v=59009'),('./locale-runtime.js?v=59008','./locale-runtime.js?v=59009')],
            'src/ai-settings.js': [('./locale-runtime.js?v=59008','./locale-runtime.js?v=59009')],
          }
          for filename, pairs in replacements.items():
              p=Path(filename); s=p.read_text()
              for old,new in pairs:
                  if s.count(old)!=1:
                      raise SystemExit(f'{filename}: expected one {old}, got {s.count(old)}')
                  s=s.replace(old,new,1)
              p.write_text(s)
          PY
          rm -f cache-contract-v0599.txt
          rm .github/workflows/v0599-cache-fix.yml
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: 1283dee7bda78db35c0e51d8f0f795207f64c01e
        run: npm run cache:check
      - name: JavaScript syntax
        run: node scripts/check-js.mjs
      - name: Focused regressions
        run: node --test test/v05908-runtime-recovery.test.js test/ai-autotest-first-button-hotfix.test.js test/version-ui.test.js
      - name: Commit complete cache propagation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/ai-client.js src/ai-settings.js cache-contract-v0599.txt .github/workflows/v0599-cache-fix.yml
          git commit -m "fix: propagate v0.59.9 cache token through runtime imports"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
