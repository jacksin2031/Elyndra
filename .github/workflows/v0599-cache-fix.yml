name: Apply v0.59.9 cache token fix
on:
  push:
    branches: [fix/v0599-ja-ui-runtime-progress]
    paths: [.github/workflows/v0599-cache-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ja-ui-runtime-progress
          fetch-depth: 0
      - name: Update changed static i18n module cache edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='./src/v0594-static-i18n.js?v=59004'
          new='./src/v0594-static-i18n.js?v=59009'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale static-i18n cache edge, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/v0599-cache-fix.yml
      - name: Cache contract
        env:
          CACHE_BASE_REF: 1283dee7bda78db35c0e51d8f0f795207f64c01e
        run: npm run cache:check
      - name: Commit cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/v0599-cache-fix.yml
          git commit -m "fix: refresh v0.59.9 static i18n cache edge"
          git push origin HEAD:fix/v0599-ja-ui-runtime-progress
