name: v0.59.0 Multilingual Integration

on:
  push:
    branches:
      - feat/v0.59.0-multilingual-runtime
    paths:
      - scripts/v05900_multilang.py
      - .github/workflows/v05900-multilingual-integration.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply v0.59.0 multilingual patch
        run: python3 scripts/v05900_multilang.py
      - name: Complete v0.59.0 cache chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path, old, new in [
              ("src/ai-autotest.js", '"./ai-settings.js?v=57025"', '"./ai-settings.js?v=59000"'),
              ("app.js", '"./src/ai-autotest.js?v=57029"', '"./src/ai-autotest.js?v=59000"'),
          ]:
              p=Path(path); text=p.read_text(encoding="utf-8")
              if old not in text: raise SystemExit(f"{path}: cache edge not found: {old}")
              p.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
      - name: Focused multilingual regressions
        run: node --test test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: main
        run: npm run cache:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit v0.59.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/v05900-multilingual-integration.yml' ':!scripts/v05900_multilang.py'
          git commit -m "v0.59.0: add isolated multilingual runtime and narrator row"
          git push origin HEAD:feat/v0.59.0-multilingual-runtime
