name: One-shot final cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply final cache bust
        run: python scripts/oneshot-final-cache-bust.py
      - name: Run full test suite
        run: npm test
      - name: Commit and remove one-shot files
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-final-cache-bust.yml scripts/oneshot-final-cache-bust.py
          git add app.js index.html test/first-button-fast-path-v05417.test.js test/runtime-grounding-v05418.test.js
          git commit -m "fix: refresh hardened runtime module cache identities [cache-bust-done]"
          git push origin HEAD:main
