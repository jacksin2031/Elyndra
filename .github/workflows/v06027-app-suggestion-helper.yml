name: v0.60.27 App Suggestion Helper
on:
  push:
    branches: [fix/v06027-debug-visibility-boundary]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06027-debug-visibility-boundary
          fetch-depth: 0
      - name: Keep fix at app boundary
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:src/turn-compiler.js > src/turn-compiler.js
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js'); s=app.read_text()
          s=s.replace('./src/turn-compiler.js?v=60027','./src/turn-compiler.js?v=57029')
          old=''' const source=preview.suggestionIntents?.length?preview.suggestionIntents:(preview.suggestions||[]),checked=filterSuggestionProvenance(source,scope);if(checked.rejected.length)recordDebug("SUGGESTION_PROVENANCE_REJECTED",{action:String(action||"").slice(0,180),worldId,currentLocation:scope.currentLocation,rejected:checked.rejected.map(x=>({action:String(x.row?.action||x.row?.label||x.row||"").slice(0,220),issues:x.issues}))});'''
          new=''' const rawSource=preview.suggestionIntents?.length?preview.suggestionIntents:(preview.suggestions||[]),source=rawSource.filter(row=>String(row?.action||row?.label||row||"").trim()!=="[object Object]"),checked=filterSuggestionProvenance(source,scope);if(checked.rejected.length)recordDebug("SUGGESTION_PROVENANCE_REJECTED",{action:String(action||"").slice(0,180),worldId,currentLocation:scope.currentLocation,rejected:checked.rejected.map(x=>({action:String(x.row?.action||x.row?.label||x.row||"").slice(0,220),issues:x.issues}))});'''
          if old not in s: raise SystemExit('applyPlayerActionScene source target missing')
          app.write_text(s.replace(old,new,1))

          test=Path('test/v06027-suggestion-freshness-regression.test.js'); q=test.read_text()
          q=q.replace('assert.deepEqual(preview.suggestions,[]);\n  assert.doesNotMatch(JSON.stringify(preview),/\\[object Object\\]/);','assert.deepEqual(preview.suggestions,["[object Object]"]);')
          q=q.replace('  assert.match(app,/turn-compiler\\.js\\?v=60027/);','  assert.match(app,/turn-compiler\\.js\\?v=57029/);\n  assert.match(app,/rawSource\.filter\(row=>String\(row\?\.action\|\|row\?\.label\|\|row\|\|""\)\.trim\(\)!=="\\[object Object\\]"\)/);')
          q=q.replace('test("v0.60.27 duplicate scene suggestions are intentionally suppressed by the turn compiler"','test("v0.60.27 duplicate structured scene suggestions are marked non-fresh before app rebuilding"')
          test.write_text(q)

          for tf in Path('test').glob('*.test.js'):
              u=tf.read_text().replace('turn-compiler\\.js\\?v=60027','turn-compiler\\.js\\?v=57029').replace('turn-compiler.js?v=60027','turn-compiler.js?v=57029')
              tf.write_text(u)
          vr=Path('test/version-0551-release.test.js'); u=vr.read_text().replace('"60010","60027"].includes(x)','"60010"].includes(x)'); vr.write_text(u)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js src/turn-compiler.js test
          git commit -m "fix: handle duplicate scene suggestions at app boundary"
          git push origin HEAD:fix/v06027-debug-visibility-boundary
