name: Fix v0.57.11 cache closure
on:
  push:
    branches: [fix/v0.57.11-iab-core-experience-r2]
permissions:
  contents: write
jobs:
  cache-closure-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v05711-cache-closure]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Propagate v0.57.11 cache token through source import graph
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          changed=[]
          replacements=0
          for p in sorted(Path('src').rglob('*.js')):
              s=p.read_text(encoding='utf-8')
              n=s.count('.js?v=57006')
              if not n:
                  continue
              p.write_text(s.replace('.js?v=57006','.js?v=57011'),encoding='utf-8')
              changed.append((str(p),n))
              replacements += n
          if not replacements:
              raise SystemExit('CACHE_CLOSURE_NO_57006_IMPORTS_FOUND')
          stale=[]
          for p in sorted(Path('src').rglob('*.js')):
              if '.js?v=57006' in p.read_text(encoding='utf-8'):
                  stale.append(str(p))
          if stale:
              raise SystemExit('CACHE_CLOSURE_STALE_REMAINS:'+','.join(stale))

          # The failing assertions captured in run 36113806247 are stale
          # cache-generation contracts. Keep the repair scoped to those four
          # proven failing test files and advance only their cache token.
          contract_files=[
              Path('test/module-cache.test.js'),
              Path('test/staged-world-compiler.test.js'),
              Path('test/v05412-regressions.test.js'),
              Path('test/v05414-regressions.test.js'),
          ]
          contract_updates=[]
          for p in contract_files:
              s=p.read_text(encoding='utf-8')
              n=s.count('57006')
              if not n:
                  raise SystemExit('CACHE_CONTRACT_NO_57006_EXPECTATION:'+str(p))
              p.write_text(s.replace('57006','57011'),encoding='utf-8')
              contract_updates.append((str(p),n))

          print(f'Updated {replacements} import tokens across {len(changed)} source files')
          for name,count in changed:
              print(f' - {name}: {count}')
          print(f'Updated diagnosed cache expectations across {len(contract_updates)} test files')
          for name,count in contract_updates:
              print(f' - {name}: {count}')
          PY
      - name: Full PR-equivalent unit regression and cache contract
        shell: bash
        env:
          CACHE_BASE_REF: 31990ed4dbdea68157bdf993d4d907f8139729f8
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/v05711-cache-test-output.txt
      - name: Preserve npm test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05711-npm-test-output
          path: /tmp/v05711-cache-test-output.txt
          if-no-files-found: warn
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reprove native download pipeline
        run: node scripts/prove-autotest-iab-download-v05711.mjs
      - name: Commit validated cache closure
        shell: bash
        run: |
          rm .github/workflows/v05711-cache-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.11: propagate module cache identity [v05711-cache-closure]"
          git push origin HEAD
