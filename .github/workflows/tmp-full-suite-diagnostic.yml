name: Temporary full suite diagnostic

on:
  push:
    branches: [fix/v06011-foreground-timeout-contract]
    paths:
      - .github/workflows/tmp-full-suite-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v06011-foreground-timeout-contract
          fetch-depth: 0
      - name: Run full suite on Node 20 and 24
        shell: bash
        run: |
          set -u
          mkdir -p _ci
          : > _ci/full-node-test-failures.txt
          for NODE_VERSION in 20 24; do
            echo "===== Node ${NODE_VERSION} =====" >> _ci/full-node-test-failures.txt
            curl -fsSL "https://nodejs.org/dist/latest-v${NODE_VERSION}.x/SHASUMS256.txt" >/dev/null
            case "$NODE_VERSION" in
              20) NODE_SPEC="20" ;;
              24) NODE_SPEC="24" ;;
            esac
            echo "Node version is installed by setup-node steps below" >> _ci/full-node-test-failures.txt
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Diagnose Node 20
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap > /tmp/node20.tap 2>&1
          rc=$?
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/node20.tap').read_text(errors='replace').splitlines()
          out=['===== Node 20 =====']
          for i,line in enumerate(src):
              if line.startswith('not ok ') or line.strip().startswith(('failureType:','error:','code:','actual:','expected:','operator:','location:')):
                  start=max(0,i-2); end=min(len(src),i+7)
                  out.extend(src[start:end]); out.append('---')
          out.extend([line for line in src[-30:] if '# tests ' in line or '# pass ' in line or '# fail ' in line or '# duration_ms ' in line])
          Path('_ci/full-node-test-failures.txt').write_text('\n'.join(out)+'\n')
          PY
          echo "NODE20_EXIT=$rc" >> _ci/full-node-test-failures.txt
          exit 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Diagnose Node 24
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap > /tmp/node24.tap 2>&1
          rc=$?
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/node24.tap').read_text(errors='replace').splitlines()
          p=Path('_ci/full-node-test-failures.txt')
          out=p.read_text().splitlines()+['','===== Node 24 =====']
          for i,line in enumerate(src):
              if line.startswith('not ok ') or line.strip().startswith(('failureType:','error:','code:','actual:','expected:','operator:','location:')):
                  start=max(0,i-2); end=min(len(src),i+7)
                  out.extend(src[start:end]); out.append('---')
          out.extend([line for line in src[-30:] if '# tests ' in line or '# pass ' in line or '# fail ' in line or '# duration_ms ' in line])
          p.write_text('\n'.join(out)+'\n')
          PY
          echo "NODE24_EXIT=$rc" >> _ci/full-node-test-failures.txt
          exit 0
      - name: Commit diagnostic summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ci/full-node-test-failures.txt
          git commit -m "chore: capture temporary full-suite failures" || exit 0
          git push origin HEAD:fix/v06011-foreground-timeout-contract
