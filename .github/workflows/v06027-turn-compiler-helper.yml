name: v0.60.27 Turn Compiler Helper
on:
  push:
    branches: [fix/v06027-debug-visibility-boundary]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06027-debug-visibility-boundary
          fetch-depth: 0
      - name: Apply structured suggestion suppression fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/turn-compiler.js'); s=p.read_text()
          old='''export function sceneTurnPreview(scene,roll={},context={}){const guarded=guardedSceneNarrative(scene,roll,context.action),sceneTitle=guardedSceneTitle(scene,roll,context.action);const suggestionIntents=normalizeSuggestionIntents(scene?.suggestions,context.priorSuggestionIntents||context.priorSuggestions||[]),suggestions=suggestionIntents.length?suggestionIntents.map(x=>x.label):sanitizeSuggestions(scene?.suggestions,context.priorSuggestions||[]);return {...guarded,sceneTitle,suggestions,suggestionIntents}}'''
          new='''export function sceneTurnPreview(scene,roll={},context={}){const guarded=guardedSceneNarrative(scene,roll,context.action),sceneTitle=guardedSceneTitle(scene,roll,context.action),rawSuggestions=Array.isArray(scene?.suggestions)?scene.suggestions:[],structuredSuggestions=rawSuggestions.some(x=>x&&typeof x==="object"&&!Array.isArray(x));const suggestionIntents=normalizeSuggestionIntents(rawSuggestions,context.priorSuggestionIntents||context.priorSuggestions||[]),suggestions=suggestionIntents.length?suggestionIntents.map(x=>x.label):structuredSuggestions?[]:sanitizeSuggestions(rawSuggestions,context.priorSuggestions||[]);return {...guarded,sceneTitle,suggestions,suggestionIntents}}'''
          if old not in s: raise SystemExit('sceneTurnPreview target missing')
          s=s.replace(old,new,1)
          oldfrag='''suggestionIntents=normalizeSuggestionIntents(scene?.suggestions,context.priorSuggestionIntents||context.priorSuggestions||[]),suggestions=suggestionIntents.length?suggestionIntents.map(x=>x.label):sanitizeSuggestions(scene?.suggestions,context.priorSuggestions||[]),sceneTitle='''
          newfrag='''rawSuggestions=Array.isArray(scene?.suggestions)?scene.suggestions:[],structuredSuggestions=rawSuggestions.some(x=>x&&typeof x==="object"&&!Array.isArray(x)),suggestionIntents=normalizeSuggestionIntents(rawSuggestions,context.priorSuggestionIntents||context.priorSuggestions||[]),suggestions=suggestionIntents.length?suggestionIntents.map(x=>x.label):structuredSuggestions?[]:sanitizeSuggestions(rawSuggestions,context.priorSuggestions||[]),sceneTitle='''
          if s.count(oldfrag)!=1: raise SystemExit(f'merge suggestion fragment count={s.count(oldfrag)}')
          p.write_text(s.replace(oldfrag,newfrag,1))

          app=Path('app.js'); a=app.read_text()
          if './src/turn-compiler.js?v=57029' not in a: raise SystemExit('app turn compiler token missing')
          app.write_text(a.replace('./src/turn-compiler.js?v=57029','./src/turn-compiler.js?v=60027',1))

          test=Path('test/v06027-suggestion-freshness-regression.test.js'); q=test.read_text()
          if 'assert.doesNotMatch(JSON.stringify(preview)' not in q:
              q=q.replace('assert.deepEqual(preview.suggestions,[]);','assert.deepEqual(preview.suggestions,[]);\n  assert.doesNotMatch(JSON.stringify(preview),/\\[object Object\\]/);')
          if 'turn-compiler\\.js\\?v=60027' not in q:
              q=q.replace('assert.match(index,/app\\.js\\?v=60027/);','assert.match(index,/app\\.js\\?v=60027/);\n  assert.match(app,/turn-compiler\\.js\\?v=60027/);')
          test.write_text(q)

          for tf in Path('test').glob('*.test.js'):
              u=tf.read_text().replace('turn-compiler\\.js\\?v=57029','turn-compiler\\.js\\?v=60027').replace('turn-compiler.js?v=57029','turn-compiler.js?v=60027')
              tf.write_text(u)
          vr=Path('test/version-0551-release.test.js'); u=vr.read_text()
          marker='"60010"].includes(x)'
          if marker in u: u=u.replace(marker,'"60010","60027"].includes(x)')
          vr.write_text(u)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js src/turn-compiler.js test
          git commit -m "fix: suppress duplicate structured suggestions cleanly"
          git push origin HEAD:fix/v06027-debug-visibility-boundary
