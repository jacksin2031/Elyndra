name: Land v0.57.8 verified AutoTest download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/land-v0578-verified-download.yml"

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.57.8 verified-download patch
        run: python3 scripts/land-v0578.py
      - name: Targeted regressions
        run: node --test test/autotest-download-v0578.test.js test/autotest-iab-drag-v0577.test.js test/autotest-iab-transfer-v0576.test.js
      - name: Full test suite
        run: npm test
      - name: Install transient Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Prove real Chromium Blob download and SHA-256
        run: node scripts/test-autotest-download-browser.mjs
      - name: Commit tested v0.57.8 to main
        shell: bash
        run: |
          rm -rf node_modules
          git rm -f --ignore-unmatch .github/workflows/land-v0578-verified-download.yml scripts/land-v0578.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify AutoTest downloads before success"
          git push origin HEAD:main
