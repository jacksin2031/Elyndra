name: TRPG Depth Cache Finalize
on:
  push:
    branches: [feat/trpg-depth-v060-foundation]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Complete v0.60.0 browser cache chain
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='./src/version.js?v=59015'
          new='./src/version.js?v=60000'
          if old not in s: raise SystemExit('app version import anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='src="app.js?v=59015"'
          new='src="app.js?v=60000"'
          if old not in s: raise SystemExit('index app token anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: PR version policy
        run: npm run version:check
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_BASE_REF: main
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: main
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: TRPG Depth regressions
        run: node --test test/trpg-depth-v060.test.js test/ai-runtime-kernel.test.js test/ai-runtime-v037.test.js
      - name: Commit cache chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "fix: complete v0.60.0 browser cache chain"
          git push origin HEAD:feat/trpg-depth-v060-foundation
