name: v0.59.2 World Entry Locale Hotfix
on:
  push:
    branches: [fix/v0.59.2-world-compile-i18n]
    paths:
      - scripts/v0592_world_compile_i18n_fix.py
      - .github/workflows/v0592-world-compile-i18n.yml
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply v0.59.2 hotfix
        run: python3 scripts/v0592_world_compile_i18n_fix.py
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused v0.59.2 regressions
        run: node --test test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: main
        run: npm run cache:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated v0.59.2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/v0592-world-compile-i18n.yml' ':!scripts/v0592_world_compile_i18n_fix.py'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: prevent non-default locale world-entry crash"
            git push origin HEAD:fix/v0.59.2-world-compile-i18n
          fi
