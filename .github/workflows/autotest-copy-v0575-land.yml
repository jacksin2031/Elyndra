name: Elyndra AutoTest copy v0.57.5 land

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autotest-copy-v0575-land.yml'
      - '.github/autotest-copy-v0575-patch.py'

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.57.5 copy controls
        run: python3 .github/autotest-copy-v0575-patch.py
      - name: Run targeted AutoTest regressions
        run: node --test test/autotest-copy-v0575.test.js test/autotest-save-v0574.test.js test/ai-autotest-first-button-hotfix.test.js test/ai-autotest-controls-v0544.test.js test/v0552-runtime-regressions.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Run full test suite
        run: npm test
      - name: Commit tested v0.57.5
        run: |
          rm -f .github/workflows/autotest-copy-v0575-land.yml .github/autotest-copy-v0575-patch.py .github/v0574-full-test-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: copy AutoTest JSON from persisted snapshot"
          git push origin main
