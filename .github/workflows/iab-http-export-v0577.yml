name: Elyndra IAB HTTP export v0.57.7 land
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/iab-http-export-v0577.yml
permissions:
  contents: write
jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/land_iab_http_export_v0577.py
      - name: Run targeted tests
        run: node --test test/autotest-http-handoff-v0577.test.js
      - name: Run full test suite
        run: npm test
      - name: Install transient Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Prove real Chromium download event
        run: node scripts/test-autotest-http-download.mjs
      - name: Commit tested v0.57.7
        run: |
          rm -rf node_modules
          git rm .github/workflows/iab-http-export-v0577.yml scripts/land_iab_http_export_v0577.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html package.json src/version.js src/autotest-http-handoff.js autotest-export-sw.js test/autotest-http-handoff-v0577.test.js scripts/test-autotest-http-download.mjs docs/releases/v0.57.7.md
          git commit -m "fix: add IAB HTTP export bridge"
          git push origin HEAD:main
