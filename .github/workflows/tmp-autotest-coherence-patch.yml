name: Temporary Autotest Coherence Patch

on:
  push:
    paths:
      - '.github/workflows/tmp-autotest-coherence-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch autotest coherence diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ai-autotest.js')
          s=p.read_text(encoding='utf-8')
          anchor='''export function autotestWorldSummary(state={}){\n const registry=state.world?.registry||{},main=state.quests?.main||{},clock=state.world?.state?.clock||{};'''
          addition='''export function autotestWorldCoherence(state={}){\n const world=state.world||{},registry=world.registry||{},claims=list(world.generationClaims?.claims),catalog=world.catalog||{},issues=[];\n const claimCounts={UNMATERIALIZED:0,RESERVED:0,MATERIALIZED:0,FAILED:0};for(const claim of claims){const status=String(claim?.status||"UNMATERIALIZED").toUpperCase();claimCounts[status]=(claimCounts[status]||0)+1}\n const failedClaims=claims.filter(x=>String(x?.status||"").toUpperCase()==="FAILED"),reservedClaims=claims.filter(x=>String(x?.status||"").toUpperCase()==="RESERVED"),pendingDefinitions=claims.filter(x=>x?.type==="BLUEPRINT_DEFINITION"&&String(x?.status||"").toUpperCase()!=="MATERIALIZED");\n if(failedClaims.length)issues.push({severity:"ERROR",type:"GENERATION_CLAIM_FAILED",message:`${failedClaims.length} generation claims are FAILED.`,ids:failedClaims.map(x=>x.id).filter(Boolean).slice(0,12)});\n if(reservedClaims.length)issues.push({severity:"WARN",type:"GENERATION_CLAIM_RESERVED_AT_EXPORT",message:`${reservedClaims.length} generation claims remain RESERVED at export.`,ids:reservedClaims.map(x=>x.id).filter(Boolean).slice(0,12)});\n const quality=world.quality||{},qualityPending=quality.pending===true||quality.backgroundPending===true||String(quality.status||"").toUpperCase()==="PENDING";\n if(qualityPending)issues.push({severity:"WARN",type:"WORLD_QUALITY_PENDING",message:"Background World Critic had not completed when this world snapshot was exported."});\n const tradeProfiles=[...list(registry.locations),...list(registry.factions)].map(x=>x?.trade).filter(x=>x&&typeof x==="object"),localCurrencies=new Map();for(const trade of tradeProfiles)for(const currency of list(trade?.currencies)){const id=text(currency?.id||currency?.name,100);if(id&&!localCurrencies.has(id))localCurrencies.set(id,currency)}\n const hasLocalCurrency=localCurrencies.size>0,economy=world.economy||{},currencyConsistent=!hasLocalCurrency||economy.currencyExists===true;\n if(!currencyConsistent)issues.push({severity:"ERROR",type:"ECONOMY_CURRENCY_REGISTRY_MISMATCH",message:"Local trade defines currency but world.economy.currencyExists is false."});\n const npcById=new Map(list(registry.npcs).map(n=>[String(n?.id||""),n]).filter(([id])=>id)),conversationIds=[...new Set(list(state.events).filter(e=>e?.type==="NPC_CONVERSATION").map(e=>String(e?.npcId||"")).filter(Boolean))],encounterMismatch=[],memoryMismatch=[];\n for(const id of conversationIds){const npc=npcById.get(id);if(!npc)continue;if(npc.encountered!==true)encounterMismatch.push(id);if(!list(npc.memories).some(m=>String(m?.type||"").toLowerCase()==="conversation"))memoryMismatch.push(id)}\n if(encounterMismatch.length)issues.push({severity:"ERROR",type:"NPC_CONVERSATION_ENCOUNTER_MISMATCH",message:"NPC conversation exists but encountered is false.",ids:encounterMismatch.slice(0,12)});\n if(memoryMismatch.length)issues.push({severity:"ERROR",type:"NPC_CONVERSATION_MEMORY_MISMATCH",message:"NPC conversation exists but no grounded conversation memory was retained.",ids:memoryMismatch.slice(0,12)});\n const rules=world.creation?.difficultyRules||{},survival=state.player?.survival||{},survivalMismatch=[];\n if(rules.hunger===false&&Number.isFinite(Number(survival.satiety))&&Number(survival.satiety)<99.999)survivalMismatch.push("HUNGER_DISABLED_SATIETY_CHANGED");\n if(rules.fatigue===false&&Number(survival.fatigue)>0.001)survivalMismatch.push("FATIGUE_DISABLED_VALUE_CHANGED");\n if(rules.statusEffects===false&&list(survival.conditions).length)survivalMismatch.push("STATUS_EFFECTS_DISABLED_CONDITIONS_PRESENT");\n if(survivalMismatch.length)issues.push({severity:"ERROR",type:"DIFFICULTY_SURVIVAL_RULE_MISMATCH",message:survivalMismatch.join(","),details:survivalMismatch});\n return {status:issues.some(x=>x.severity==="ERROR")?"FAIL":issues.length?"WARN":"PASS",issues,generationClaims:{...claimCounts,total:claims.length,pendingDefinitions:pendingDefinitions.length,deferredByDesign:claimCounts.UNMATERIALIZED||0},catalog:{civilizations:list(catalog.civilizations).length,species:list(catalog.species).length,languages:list(catalog.languages).length},quality:{status:quality.status||"",source:quality.source||"",pending:qualityPending,overall:quality.overall??null,provisionalOverall:quality.provisionalOverall??null},economy:{currencyExists:economy.currencyExists===true,currencyModel:economy.currencyModel||"",localCurrencyCount:localCurrencies.size,consistent:currencyConsistent},npcConversations:{count:conversationIds.length,encounterMismatch:encounterMismatch.length,memoryMismatch:memoryMismatch.length},survival:{difficultyRules:{hunger:rules.hunger,fatigue:rules.fatigue,statusEffects:rules.statusEffects},satiety:Number(survival.satiety),fatigue:Number(survival.fatigue),conditions:list(survival.conditions)}}\n}\n\nexport function autotestWorldSummary(state={}){\n const registry=state.world?.registry||{},main=state.quests?.main||{},clock=state.world?.state?.clock||{};'''
          if s.count(anchor)!=1:
              raise SystemExit(f'summary anchor count={s.count(anchor)}')
          s=s.replace(anchor,addition,1)
          old='''  counts:{inventory:list(state.inventory).length,knowledge:list(state.knowledge).length,npcs:list(registry.npcs).length,knownNpcs:list(registry.npcs).filter(x=>x?.known===true).length,locations:list(registry.locations).length,knownLocations:list(registry.locations).filter(x=>x?.known===true).length,events:list(state.events).length}\n }'''
          new='''  counts:{inventory:list(state.inventory).length,knowledge:list(state.knowledge).length,npcs:list(registry.npcs).length,knownNpcs:list(registry.npcs).filter(x=>x?.known===true).length,locations:list(registry.locations).length,knownLocations:list(registry.locations).filter(x=>x?.known===true).length,events:list(state.events).length},\n  coherence:autotestWorldCoherence(state)\n }'''
          if s.count(old)!=1:
              raise SystemExit(f'summary body anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''  if(["DEGRADED","SEVERELY_DEGRADED"].includes(quality))issues.push({severity:quality==="SEVERELY_DEGRADED"?"ERROR":"WARN",type:"GENERATION_"+quality,worldIndex:w.index,message:`Generation quality=${quality}`});\n  const rows=list(w.actions),recent=[];let stagnant=0;'''
          new='''  if(["DEGRADED","SEVERELY_DEGRADED"].includes(quality))issues.push({severity:quality==="SEVERELY_DEGRADED"?"ERROR":"WARN",type:"GENERATION_"+quality,worldIndex:w.index,message:`Generation quality=${quality}`});\n  for(const issue of list(w?.summary?.coherence?.issues).slice(0,20))issues.push({...structuredClone(issue),type:"WORLD_COHERENCE_"+String(issue?.type||"ISSUE"),worldIndex:w.index});\n  const rows=list(w.actions),recent=[];let stagnant=0;'''
          if s.count(old)!=1:
              raise SystemExit(f'report anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/tmp-autotest-coherence-patch.yml
          git config user.name 'JackSin'
          git config user.email 'a24dc523@dhw.ac.jp'
          git add src/ai-autotest.js .github/workflows/tmp-autotest-coherence-patch.yml
          git commit -m 'feat: report autotest world coherence'
          git push origin HEAD:main
