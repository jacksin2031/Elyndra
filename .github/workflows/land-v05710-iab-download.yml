name: Land v0.57.10 IAB download fix
on:
  push:
    branches: [fix/v05710-iab-download]
    paths:
      - '.github/workflows/land-v05710-iab-download.yml'
      - 'scripts/land-v05710-iab-download.py'
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: fix/v05710-iab-download
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply v0.57.10 patch
        run: python3 scripts/land-v05710-iab-download.py
      - name: Use Chromium native download readback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prove-autotest-iab-download-browser.mjs')
          s=p.read_text(encoding='utf-8')
          old='const path=join(out,expected.filename);await download.saveAs(path);const bytes=await readFile(path),sha=createHash("sha256").update(bytes).digest("hex");'
          new='const failure=await download.failure();assert.equal(failure,null,`browser download failed: ${failure||"unknown"}`);const nativePath=await download.path();assert.ok(nativePath,"Chromium must expose a landed download file");const bytes=await readFile(nativePath),sha=createHash("sha256").update(bytes).digest("hex");'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Targeted unit regression
        run: node --test test/autotest-download-v05710.test.js
      - name: Full test suite
        run: npm test
      - name: Install browser proof dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove first-click files land on disk
        run: node scripts/prove-autotest-iab-download-browser.mjs
      - name: Commit tested product
        run: |
          rm -rf node_modules
          git rm -f .github/workflows/land-v05710-iab-download.yml scripts/land-v05710-iab-download.py
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: route AutoTest downloads through HTTP attachment bridge"
          git push origin HEAD:fix/v05710-iab-download
