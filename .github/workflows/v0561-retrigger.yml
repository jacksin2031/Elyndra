name: Retrigger v0.56.1 Finalizer

on:
  push:
    branches:
      - fix/v0.56.1-runtime-grounding
    paths:
      - .github/workflows/v0561-retrigger.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix install and retrigger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v0561-finalize.yml')
          text=p.read_text(encoding='utf-8')
          old='        run: npm ci\n'
          new='        run: npm install --ignore-scripts --no-audit --no-fund\n'
          if old not in text:
              raise SystemExit('npm ci anchor missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "A24DC523"
          git config user.email "a24dc523@dhw.ac.jp"
          git rm .github/workflows/v0561-retrigger.yml
          git add .github/workflows/v0561-finalize.yml
          git commit -m "ci: use npm install for lockless finalizer"
          git push origin HEAD:fix/v0.56.1-runtime-grounding
