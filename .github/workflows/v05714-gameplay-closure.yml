name: v0.57.14 Gameplay Closure

on:
  push:
    branches:
      - fix/v0.57.14-autotest-progression-r3
    paths:
      - scripts/apply-v05714-gameplay.py
      - scripts/refine-v05714-gameplay.py
      - .github/workflows/v05714-gameplay-closure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.57.14-autotest-progression-r3
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply v0.57.14 gameplay patch
        run: |
          python3 scripts/apply-v05714-gameplay.py
          python3 scripts/refine-v05714-gameplay.py

      - name: Run non-download regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:nondownload 2>&1 | tee /tmp/v05714-nondownload.log

      - name: Commit validated v0.57.14 closure
        shell: bash
        run: |
          rm -f scripts/apply-v05714-gameplay.py scripts/refine-v05714-gameplay.py .github/workflows/v05714-gameplay-closure.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v0.57.14: harden AutoTest progression and continuity"
          git push origin HEAD:fix/v0.57.14-autotest-progression-r3
