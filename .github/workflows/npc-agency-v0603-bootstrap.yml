name: NPC Agency 2.0 Bootstrap
on:
  push:
    branches:
      - feat/trpg-depth-npc-agency-v060
permissions:
  contents: write
concurrency:
  group: npc-agency-v0603-bootstrap
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply NPC Agency integration patch
        run: python3 scripts/npc-agency-v0603-bootstrap.py
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-social-v060
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: NPC Agency integration regressions
        run: node --test test/npc-agency-v0603.test.js test/social-conflict-v0602.test.js test/combat-v0601.test.js test/trpg-depth-v060.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit validated integration
        run: |
          if ! git diff --quiet; then
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add app.js index.html package.json src/version.js src/npc-conversation.js src/ai-client.js api/npc.js test/version-ui.test.js test/version-0551-release.test.js
            git commit -m "feat: integrate NPC Agency 2.0 conversation authority"
            git push origin HEAD:feat/trpg-depth-npc-agency-v060
          fi
