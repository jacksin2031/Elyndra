name: v0.57.13 gameplay closure
on:
  push:
    branches: [fix/v0.57.13-autotest-gameplay-r1]
permissions:
  contents: write
jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply v0.57.13 gameplay fixes
        run: python scripts/apply-v05713-gameplay.py
      - name: Run non-download validation only
        shell: bash
        env:
          CACHE_BASE_REF: main
        run: |
          set -o pipefail
          npm run test:nondownload 2>&1 | tee /tmp/v05713-nondownload.txt
      - name: Preserve non-download diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: v05713-nondownload-validation
          path: /tmp/v05713-nondownload.txt
          if-no-files-found: warn
      - name: Commit validated v0.57.13 closure
        shell: bash
        run: |
          rm .github/workflows/v05713-gameplay-closure.yml scripts/apply-v05713-gameplay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.13: improve AutoTest progression and NPC continuity"
          git push origin HEAD:fix/v0.57.13-autotest-gameplay-r1
