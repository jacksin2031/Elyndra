name: Story Rhythm v0.60.6 Bootstrap
on:
  push:
    branches:
      - feat/trpg-depth-rhythm-v060
permissions:
  contents: write
concurrency:
  group: rhythm-v0606-bootstrap
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply Story Rhythm integration
        run: |
          if grep -q 'APP_VERSION="0.60.5"' src/version.js; then
            python3 scripts/rhythm-v0606-bootstrap.py
            python3 scripts/rhythm-v0606-semantic-fix.py
          else
            echo "Story Rhythm integration already applied"
          fi
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-drives-v060
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Story Rhythm regressions
        run: node --test test/story-rhythm-v0606.test.js
      - name: Drive regressions
        run: node --test test/drive-engine-v0605.test.js
      - name: Talent regressions
        run: node --test test/talent-rules-v0604.test.js
      - name: NPC Agency regressions
        run: node --test test/npc-agency-v0603.test.js
      - name: Social Conflict regressions
        run: node --test test/social-conflict-v0602.test.js
      - name: Combat regressions
        run: node --test test/combat-v0601.test.js
      - name: TRPG foundation regressions
        run: node --test test/trpg-depth-v060.test.js
      - name: Release/UI contracts
        run: node --test test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit validated integration
        run: |
          if ! git diff --quiet; then
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add app.js index.html package.json src/version.js src/story-rhythm-engine.js src/session-maintenance.js src/adventure-engine.js src/contextual-actions.js test/story-rhythm-v0606.test.js test/version-ui.test.js test/version-0551-release.test.js
            git commit -m "feat: integrate Story Rhythm Engine v0.60.6"
            git push origin HEAD:feat/trpg-depth-rhythm-v060
          fi
