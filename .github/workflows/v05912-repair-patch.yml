name: v0.59.12 deterministic repair integration
on:
  push:
    branches: [feature/v05912-deterministic-ai-repair]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v05912-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v05912-deterministic-ai-repair
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply deterministic repair integration
        run: python3 scripts/v05912_repair_patch.py
      - name: Verify focused repair tests and release contracts
        run: |
          node scripts/check-js.mjs
          npm run version:check
          node --test test/v05912-ai-output-repair.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit patched product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: v0.59.12 deterministic AI output repair [v05912-patched]"
          git push origin HEAD:feature/v05912-deterministic-ai-repair
