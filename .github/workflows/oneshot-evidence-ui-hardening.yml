name: One-shot evidence and UI hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply evidence and UI hardening
        run: python scripts/oneshot-evidence-ui-hardening.py
      - name: Run full test suite
        run: npm test
      - name: Commit and remove one-shot files
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-evidence-ui-hardening.yml scripts/oneshot-evidence-ui-hardening.py
          git add src/state-sync.js src/acquisition-notifier.js test/runtime-grounding-v05418.test.js
          git commit -m "fix: harden reusable acquisition evidence and toast rendering [evidence-ui-done]"
          git push origin HEAD:main
