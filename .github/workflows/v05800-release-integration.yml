name: v0.58.0 Release Integration

on:
  push:
    branches:
      - release/v0.58.0

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.event.head_commit.message != 'v0.58.0: integrate privacy and grounded dialogue'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fetch validated dialogue closure
        run: git fetch origin refs/heads/feat/v0.57.30-scene-dialogue-contract:refs/remotes/origin/feat/v0.57.30-scene-dialogue-contract
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Integrate v0.58.0
        run: python3 scripts/v05800_integrate.py
      - name: Focused privacy and dialogue regressions
        run: node --test test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js
      - name: Current release contracts
        run: node --test test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: main
        run: npm run cache:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Diff check
        run: git diff --check
      - name: Create v0.58.0 integration commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.58.0: integrate privacy and grounded dialogue"
          git push origin HEAD:release/v0.58.0
