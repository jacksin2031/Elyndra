name: Apply corrected v0.57.11 core fixes
on:
  push:
    branches: [fix/v0.57.11-iab-core-experience-r2]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v05711-product]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply corrected product patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          raw=subprocess.check_output([
            'git','show','origin/fix/v0.57.11-iab-core-experience:.github/workflows/v05711-patch.yml'
          ],text=True)
          start=raw.index("          python <<'PY'\n")+len("          python <<'PY'\n")
          end=raw.index("\n          PY",start)
          script=textwrap.dedent(raw[start:end])
          script=script.replace(
            'ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)',
            'ns,n=re.subn(pattern,lambda _m:replacement,s,count=1,flags=re.S)'
          )
          script=script.replace("Path('.github/workflows/v05711-patch.yml').unlink()","pass")
          exec(compile(script,'v05711-product-patch.py','exec'),{})

          # Evidence-based corrections from run 36112040565 regression diagnostics.
          p=Path('src/world-catalog.js')
          s=p.read_text(encoding='utf-8')
          old='export function worldCatalogDefinitions(state){const c=ensureWorldCatalog(state);return [...c.civilizations,...c.species,...c.languages]}'
          new='export function worldCatalogDefinitions(state){const c=ensureWorldCatalog(state);return [...c.civilizations,...c.species,...c.languages].filter(x=>x?.placeholder!==true)}'
          if old not in s: raise SystemExit('worldCatalogDefinitions placeholder anchor missing')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('src/adventure-engine.js')
          s=p.read_text(encoding='utf-8')
          old='confirmed=!verified&&groundedDiscoverySource(state,sourceKind,sourceId,evidenceType,context)'
          new='confirmed=!verified&&!factId&&groundedDiscoverySource(state,sourceKind,sourceId,evidenceType,context)'
          if old not in s: raise SystemExit('hidden fact confirmation anchor missing')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('test/v05711-regressions.test.js')
          s=p.read_text(encoding='utf-8')
          old='buildContextualActionSet(s,[])'
          if s.count(old)!=2: raise SystemExit(f'v05711 contextual API test anchor count={s.count(old)}')
          p.write_text(s.replace(old,'buildContextualActionSet(s,[]).all'),encoding='utf-8')

          stale_tests=[
            'test/ai-settings.test.js',
            'test/autotest-download-v05710.test.js',
            'test/autotest-download-v0578.test.js',
            'test/first-button-fast-path-v05417.test.js',
            'test/module-cache.test.js',
            'test/runtime-grounding-v05418.test.js',
            'test/version-0551-release.test.js',
            'test/version-ui.test.js',
          ]
          for name in stale_tests:
            p=Path(name); s=p.read_text(encoding='utf-8')
            if '57010' not in s and '0.57.10' not in s:
              raise SystemExit(f'stale release anchor missing: {name}')
            s=s.replace('57010','57011').replace('0.57.10','0.57.11')
            if name=='test/autotest-download-v05710.test.js':
              old='assert.equal(result.method,"service-worker-http")'
              if old not in s: raise SystemExit('download method expectation anchor missing')
              s=s.replace(old,'assert.equal(result.method,"service-worker-http-navigation")')
            p.write_text(s,encoding='utf-8')

          Path('.github/workflows/v05711-r2.yml').unlink()
          PY
      - name: Unit and full regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          {
            echo '### v0.57.11 unit/regression diagnostic'
            echo '```text'
            tail -n 400 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v05711-regression-diagnostics
          path: test-output.txt
          if-no-files-found: error
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove native downloads land and read back
        shell: bash
        run: |
          set -o pipefail
          node scripts/prove-autotest-iab-download-v05711.mjs 2>&1 | tee playwright-output.txt
          code=${PIPESTATUS[0]}
          {
            echo '### v0.57.11 native-download proof diagnostic'
            echo '```text'
            tail -n 300 playwright-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload native-download diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v05711-native-download-diagnostics
          path: playwright-output.txt
          if-no-files-found: ignore
      - name: Commit tested product
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.11: fix IAB downloads and core progression [v05711-product]"
          git push origin HEAD
