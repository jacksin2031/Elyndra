name: Elyndra AutoTest export v0.57.3 land

on:
  push:
    branches: [main]
    paths:
      - '.github/autotest-export-v0573-patch.py'
      - '.github/autotest-export-v0573-contract-fix.py'
      - '.github/workflows/autotest-export-v0573-land.yml'

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply AutoTest export resilience patch
        run: |
          python3 .github/autotest-export-v0573-patch.py
          python3 .github/autotest-export-v0573-contract-fix.py
      - name: Run targeted export regression tests
        run: node --test test/autotest-export-v0573.test.js test/ai-autotest-controls-v0544.test.js test/version-ui.test.js test/version-0551-release.test.js
      - name: Run full test suite
        run: npm test
      - name: Commit tested v0.57.3 export fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/autotest-export-v0573-patch.py .github/autotest-export-v0573-contract-fix.py .github/workflows/autotest-export-v0573-land.yml
          git add app.js index.html package.json src scripts test
          git commit -m "fix: make AutoTest exports retryable"
          git push origin HEAD:main
