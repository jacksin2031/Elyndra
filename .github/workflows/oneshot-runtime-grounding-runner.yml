name: Runtime grounding patch runner

on:
  push:
    branches:
      - fix/runtime-grounding-world-consistency-v05418

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-grounding-world-consistency-v05418
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and run patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/oneshot-runtime-grounding-v05418.yml').read_text()
          marker="          python <<'PY'\n"
          if marker not in s:
              raise SystemExit('embedded patch marker not found')
          raw=s.split(marker,1)[1].split("\n          PY",1)[0]
          code="\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          code=code.replace("' if(!revision.ok)return {applied:false,stale:true,rejected:grounded.rejected.length,...revision};'","'if(!revision.ok)return {applied:false,stale:true,rejected:grounded.rejected.length,...revision};'")
          exec(compile(code,'embedded-runtime-grounding.py','exec'),{})

          p=Path('src/state-sync.js')
          t=p.read_text().replace('c.location=clean(raw.location,120)};\n  else if(type==="ACQUIRE_ITEM")','c.location=clean(raw.location,120)}\n  else if(type==="ACQUIRE_ITEM")',1)
          p.write_text(t)

          p=Path('test/real-session-resilience-v0541.test.js')
          t=p.read_text().replace(
            'assert.equal(groundStatePatch(groundingState(),location).patch.operations.length,1)',
            'assert.equal(groundStatePatch(groundingState(),location,{observableText:"你直接察覺到聲音異常，聲音傳播方式與常態不同。"}).patch.operations.length,1)',1)
          p.write_text(t)

          p=Path('test/state-sync-v041.test.js')
          t=p.read_text().replace(
            'assert.equal(invented.patch.operations.length,0);assert.equal(invented.rejected[0].reason,"ITEM_NOT_GROUNDED_IN_PLAYER_ACTION")',
            'assert.equal(invented.patch.operations.length,0);assert.equal(invented.rejected[0].reason,"ITEM_NAME_NOT_OBSERVED")',1)
          p.write_text(t)

          p=Path('index.html')
          t=p.read_text().replace('app.js?v=54017f2','app.js?v=54017g',1)
          p.write_text(t)

          p=Path('test/first-button-fast-path-v05417.test.js')
          t=p.read_text().replace('assert.match(html,/app\\.js\\?v=54017f2/);','assert.match(html,/app\\.js\\?v=54017g/);',1)
          p.write_text(t)
          PY
      - name: Run tests
        run: npm test
      - name: Commit fixes
        shell: bash
        run: |
          git rm .github/workflows/oneshot-runtime-grounding-v05418.yml .github/workflows/oneshot-runtime-grounding-runner.yml
          git add app.js index.html styles.css src test
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: ground runtime acquisitions and world consistency [runtime-grounding-done]"
          git push origin HEAD:fix/runtime-grounding-world-consistency-v05418
