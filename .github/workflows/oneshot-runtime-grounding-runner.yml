name: Runtime grounding patch runner

on:
  push:
    branches:
      - fix/runtime-grounding-world-consistency-v05418

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-grounding-world-consistency-v05418
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and run patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/oneshot-runtime-grounding-v05418.yml').read_text()
          marker="          python <<'PY'\n"
          if marker not in s:
              raise SystemExit('embedded patch marker not found')
          code=s.split(marker,1)[1].split("\n          PY",1)[0]
          exec(textwrap.dedent(code),{})
          PY
      - name: Run tests
        run: npm test
      - name: Commit fixes
        shell: bash
        run: |
          git rm .github/workflows/oneshot-runtime-grounding-v05418.yml .github/workflows/oneshot-runtime-grounding-runner.yml
          git add app.js styles.css src test
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: ground runtime acquisitions and world consistency [runtime-grounding-done]"
          git push origin HEAD:fix/runtime-grounding-world-consistency-v05418
