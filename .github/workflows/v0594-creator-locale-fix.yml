name: v0.59.4 Creator Locale Fix
on:
  push:
    branches: [ui/visual-feedback]
    paths:
      - .github/workflows/v0594-creator-locale-fix.yml
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply creator and locale fixes
        run: python3 scripts/v0594_creator_locale_fix.py
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Focused v0.59.4 regressions
        run: node --test test/v05904-creator-locale-regressions.test.js test/v05903-locale-completeness.test.js test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/viewport-stability.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: main
        run: npm run cache:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix: stabilize creator tags and first-render locale in v0.59.4"
            git push origin HEAD:ui/visual-feedback
          fi
