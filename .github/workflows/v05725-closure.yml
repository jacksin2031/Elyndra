name: v0.57.25 artifact baseline closure
on:
  push:
    branches: [fix/v0.57.25-artifact-baseline-hardening]
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Apply v0.57.25 artifact hardening
        run: |
          python scripts/v05725_artifact_patch.py
          python scripts/v05725_test_contract_refine.py
      - name: Focused artifact regressions
        run: node --test test/v05725-artifact-baseline-regressions.test.js test/ai-autotest-v054.test.js test/v05717-visibility-narrator-trace.test.js test/helper-ai.test.js test/staged-world-compiler.test.js
      - name: Run non-download regression suite
        run: npm run test:nondownload
        env:
          CACHE_BASE_REF: ${{ github.event.before }}
      - name: Check diff
        run: git diff --check
      - name: Commit validated v0.57.25 product
        run: |
          rm scripts/v05725_artifact_patch.py scripts/v05725_test_contract_refine.py .github/workflows/v05725-closure.yml
          git config user.name "Elyndra CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.57.25: harden artifact visibility reporting and language"
          git push origin HEAD:${GITHUB_REF_NAME}
