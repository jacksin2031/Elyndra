name: One-shot cache token sync v0.54.17
on:
  push:
    branches: [tmp-cache-sync-v05417-final]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-cache-sync-v05417-final
          fetch-depth: 0
      - name: Rewrite browser cache tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          targets=[Path('app.js'),Path('index.html'),*Path('src').rglob('*.js')]
          changed=[]
          for p in targets:
              s=p.read_text(encoding='utf-8')
              n=re.sub(r'\?v=\d+', '?v=54017', s)
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print(f'updated {len(changed)} files')
          for p in changed: print(p)
          PY
      - name: Commit synchronized tokens and remove one-shot workflow
        run: |
          rm .github/workflows/cache-token-sync-v05417.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html src .github/workflows/cache-token-sync-v05417.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync browser cache token to 54017"
          git push origin HEAD:tmp-cache-sync-v05417-final
