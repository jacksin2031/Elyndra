name: Temporary v0.54.19 Cache Graph Sync

on:
  push:
    branches:
      - fix/audit-2026-09-24-all
    paths:
      - '.github/workflows/tmp-v05419-cache-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Sync changed browser-module cache edges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/ai-runtime-contracts.js': [
                  ('./action-intent.js?v=54018', './action-intent.js?v=54019'),
                  ('./state-sync.js?v=54018', './state-sync.js?v=54019'),
              ],
              'src/contextual-actions.js': [
                  ('./action-intent.js?v=54018', './action-intent.js?v=54019'),
              ],
              'src/turn-outcome.js': [
                  ('./action-intent.js?v=54018', './action-intent.js?v=54019'),
                  ('./state-sync.js?v=54018', './state-sync.js?v=54019'),
              ],
              'src/adventure-engine.js': [
                  ('./contextual-actions.js?v=54018', './contextual-actions.js?v=54019'),
                  ('./state-sync.js?v=54018', './state-sync.js?v=54019'),
              ],
              'test/module-cache.test.js': [
                  ('actions,/\\.\\/action-intent\\.js\\?v=54018/', 'actions,/\\.\\/action-intent\\.js\\?v=54019/'),
                  ('contracts,/\\.\\/action-intent\\.js\\?v=54018/', 'contracts,/\\.\\/action-intent\\.js\\?v=54019/'),
                  ('turnOutcome,/\\.\\/action-intent\\.js\\?v=54018/', 'turnOutcome,/\\.\\/action-intent\\.js\\?v=54019/'),
                  ('contracts,/\\.\\/state-sync\\.js\\?v=54018/', 'contracts,/\\.\\/state-sync\\.js\\?v=54019/'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in source and new not in source:
                      raise SystemExit(f'missing cache edge in {filename}: {old}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
              print('synced', filename)
          PY
      - name: Validate full PR cache contract and tests
        env:
          CACHE_BASE_REF: main
        run: npm test
      - name: Commit cache graph sync and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-v05419-cache-sync.yml
          git config user.name 'Elyndra Cache Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ai-runtime-contracts.js src/contextual-actions.js src/turn-outcome.js src/adventure-engine.js test/module-cache.test.js .github/workflows/tmp-v05419-cache-sync.yml
          git commit -m 'fix: synchronize v0.54.19 browser cache graph'
          git push origin HEAD:fix/audit-2026-09-24-all
