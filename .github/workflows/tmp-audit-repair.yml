name: Audit repair retry

on:
  push:
    branches:
      - fix/audit-2026-09-24-all
    paths:
      - 'scripts/run-audit-repair.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Apply audit repairs
        run: python scripts/run-audit-repair.py
      - name: Syntax gate
        run: find . -path './.git' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Full test suite
        run: npm test
      - name: Commit audited source fixes
        shell: bash
        run: |
          git config user.name 'Elyndra Audit Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html package.json src api test .env.example
          git commit -m 'fix: close audit runtime and API defects'
          git push origin HEAD:fix/audit-2026-09-24-all
