name: One-shot chronology constitution guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chronology-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Add chronology constitution guard
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/world-engine.js')
          s=p.read_text()
          old=' {id:"C-011",text:"天氣由世界 Canon 定義並由 Engine 按世界時間與地區推進；天氣可為異世界獨有現象，不得被敘事 AI 臨時改寫"}\n];'
          new=' {id:"C-011",text:"天氣由世界 Canon 定義並由 Engine 按世界時間與地區推進；天氣可為異世界獨有現象，不得被敘事 AI 臨時改寫"},\n {id:"C-012",text:"角色年齡、世代與世界歷史必須時間一致；若仍存活角色被設定為百年前、數百年前或更早時期的第一代、始祖、創建者或直接見證者，Canon 必須明確定義足以解釋其存活的長壽、延命、不老、休眠或等價機制，否則必須改為後代、傳承者或記錄持有人"}\n];'
          if old not in s:
              raise SystemExit('C-011 constitution anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('test/runtime-grounding-v05418.test.js')
          s=p.read_text()
          anchor='import {deriveAcquisitionNotifications} from "../src/acquisition-notifier.js";\n'
          if 'WORLD_CONSTITUTION' not in s:
              if anchor not in s: raise SystemExit('test import anchor not found')
              s=s.replace(anchor,anchor+'import {WORLD_CONSTITUTION} from "../src/world-engine.js";\n',1)
          test='\ntest("world constitution requires chronology and lifespan consistency",()=>{const rule=WORLD_CONSTITUTION.find(x=>x.id==="C-012");assert.ok(rule);assert.match(rule.text,/年齡|世代/);assert.match(rule.text,/長壽|延命/);assert.match(rule.text,/後代|傳承者/)});\n'
          if 'world constitution requires chronology and lifespan consistency' not in s:
              s+=test
          p.write_text(s)
          PY
      - name: Run full test suite
        run: npm test
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-chronology-constitution.yml
          git add src/world-engine.js test/runtime-grounding-v05418.test.js
          git commit -m "fix: enforce world chronology consistency [chronology-done]"
          git push origin HEAD:main
