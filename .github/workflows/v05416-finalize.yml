name: Finalize v0.54.16
on:
  push:
    branches:
      - fix/v05416-travel-progress-json-recovery
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v05416-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Apply v0.54.16 patch
        run: |
          python3 scripts/v05416_finalize.py
          sed -i 's|action-intent.js?v=54008|action-intent.js?v=54016|g' src/ai-runtime-contracts.js src/ai-client.js
          sed -i 's|model-json.js?v=54013|model-json.js?v=54016|g' src/ai-client.js
          sed -i 's|turn-outcome.js?v=54013|turn-outcome.js?v=54016|g' src/ai-client.js
          sed -i 's|ai-runtime-contracts.js?v=54013|ai-runtime-contracts.js?v=54016|g' src/ai-client.js
          sed -i 's|turn-outcome\\.js\\?v=54013|turn-outcome\\.js\\?v=54016|g' test/module-cache.test.js test/v05412-regressions.test.js
      - name: Syntax and regression suite
        run: |
          node --check app.js
          node --check src/action-intent.js
          node --check src/contextual-actions.js
          node --check src/model-json.js
          node --check src/ai-client.js
          node --check src/ai-runtime-contracts.js
          npm test
          git diff --check
      - name: Finalize commit and verify cache graph
        run: |
          rm -f scripts/v05416_finalize.py .github/workflows/v05416-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.54.16: grounded travel and progress recovery [v05416-finalized]"
          git fetch origin main
          CACHE_BASE_REF=main node scripts/check-cache-bust.mjs
          git push origin HEAD:fix/v05416-travel-progress-json-recovery
