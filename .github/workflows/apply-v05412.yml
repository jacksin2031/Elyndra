name: Apply v0.54.12 runtime recovery patch

on:
  push:
    branches: [fix/v05412-runtime-schema-normalization]
    paths: [.github/workflows/apply-v05412.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v05412-runtime-schema-normalization
      - name: Apply source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).write_text(text,encoding='utf-8')
          def require_replace(path,old,new):
              s=load(path)
              if old not in s:
                  raise SystemExit(f'marker missing in {path}: {old[:100]!r}')
              save(path,s.replace(old,new))

          # Canonical runtime normalization is model-independent. It converts common
          # semantically usable AI drift before strict Engine validation.
          normalizer = r'''import {normalizeLore} from "./lore-engine.js?v=276";
          import {normalizeWeatherProfile} from "./weather-engine.js?v=54012";
          import {materialSatisfiesClaim} from "./generation-claims.js?v=54012";

          const clean=(v,max=400)=>typeof v==="string"?v.trim().slice(0,max):"";
          const ACCESS_TYPES=new Set(["ITEM_OWNED","ITEM_USED","ITEM_SHOWN","ITEM_GIVEN","FACT_KNOWN","EVENT_OCCURRED"]);
          const uniq=(rows,max=12)=>[...new Set((Array.isArray(rows)?rows:[rows]).map(x=>clean(x,160)).filter(Boolean))].slice(0,max);

          export function normalizeRuntimeLore(input){
           if(typeof input==="string"){
            const story=clean(input,800);return story?{story,unlockKeywords:[],minMatches:1,known:false,revealedDay:null}:null
           }
           return normalizeLore(input)
          }

          function weatherRefs(input){
           const out=[];const add=v=>{for(const x of Array.isArray(v)?v:[v]){const s=clean(x,80);if(!s)continue;const ids=s.match(/WTH-[A-Z0-9_-]+/gi);if(ids?.length)out.push(...ids.map(id=>id.toUpperCase()));else if(/^WTH-/i.test(s))out.push(s.toUpperCase())}};
           if(Array.isArray(input)||typeof input==="string")add(input);
           else if(input&&typeof input==="object"){
            add(input.affinities);add(input.dominantPhenomena);add(input.basePhenomena);add(input.phenomena);add(input.primary);add(input.secondary);add(input.modifier)
           }
           return [...new Set(out)].slice(0,8)
          }
          export function normalizeRuntimeWeatherProfile(input,allowedWeatherIds=[]){
           const allowed=Array.isArray(allowedWeatherIds)&&allowedWeatherIds.length?new Set(allowedWeatherIds.map(String)):null,filter=rows=>rows.filter(id=>!allowed||allowed.has(id));
           const source=input&&typeof input==="object"&&!Array.isArray(input)?input:{},zone=clean(source.zone||source.description||(typeof input==="string"?input:""),100),affinities=filter(weatherRefs(input)),suppressions=filter(weatherRefs(source.suppressions));
           return normalizeWeatherProfile({zone,affinities,suppressions},allowed?[...allowed]:null)
          }
          export function normalizeRuntimeAccess(input){
           const rows=input==null?[]:(Array.isArray(input)?input:[input]),requirements=[],notes=[];
           for(const row of rows.slice(0,6)){
            if(typeof row==="string"){const note=clean(row,180);if(note)notes.push(note);continue}
            if(!row||typeof row!=="object"||Array.isArray(row))continue;
            const type=String(row.type||"").toUpperCase(),id=clean(row.id,120);if(ACCESS_TYPES.has(type)&&id)requirements.push({type,id,hint:clean(row.hint,160)});
            else {const note=clean(row.hint||row.description||row.text,180);if(note)notes.push(note)}
           }
           return {requirements:requirements.slice(0,4),notes:[...new Set(notes)].slice(0,4)}
          }
          export function normalizeRuntimeLocation(row={},allowedWeatherIds=[]){
           const access=normalizeRuntimeAccess(row.accessRequirements),lore=normalizeRuntimeLore(row.lore);
           return {...row,lore,weatherProfile:normalizeRuntimeWeatherProfile(row.weatherProfile,allowedWeatherIds),accessRequirements:access.requirements,accessNotes:access.notes}
          }
          export function bindRuntimeClaims(plan,key,rows=[]){
           const claims=new Map((plan?.claims||[]).map(x=>[String(x.id),x])),copies=(rows||[]).map(row=>({...row,claimRefs:uniq(row?.claimRefs,6)}));
           for(const row of copies){
            row.claimRefs=row.claimRefs.filter(id=>{const claim=claims.get(String(id));if(!claim)return false;if(claim.type==="BLUEPRINT_DEFINITION"&&key!=="definitions")return false;return materialSatisfiesClaim(claim,row)})
           }
           const used=new Set(copies.flatMap(row=>row.claimRefs.map(String)));
           for(const claim of claims.values()){
            const id=String(claim.id);if(used.has(id))continue;if(claim.type==="BLUEPRINT_DEFINITION"&&key!=="definitions")continue;
            const hit=copies.find(row=>materialSatisfiesClaim(claim,row));if(!hit)continue;hit.claimRefs=[...new Set([...hit.claimRefs,id])];used.add(id)
           }
           return copies
          }
          '''.replace('\n          ','\n').lstrip()
          save('src/runtime-generation-normalizer.js',normalizer)

          # ai-client: normalize Geography rows and deterministically bind claims.
          p='src/ai-client.js';s=load(p)
          marker='import {validateLazyGenerationCandidate} from "./lazy-generation.js?v=54011";'
          if marker not in s: raise SystemExit('ai-client lazy import marker missing')
          s=s.replace(marker,marker+'\nimport {normalizeRuntimeLocation,bindRuntimeClaims} from "./runtime-generation-normalizer.js?v=54012";')
          start=s.index('function cleanRuntimeClaimRefs(plan,key,row){')
          end=s.index('function runtimeRefs(rows,key)',start)
          replacement='''function runtimeNewLocations(state,plan,rows){
           const existing=new Set((state?.world?.registry?.locations||[]).map(x=>runtimeIdentity(x?.name)).filter(Boolean)),allowedWeatherIds=(state?.world?.bible?.weatherSystem?.phenomena||[]).map(x=>String(x?.id||"")).filter(Boolean);
           const fresh=(rows||[]).filter(row=>{const name=runtimeIdentity(row?.name);return name&&!existing.has(name)}).map(row=>normalizeRuntimeLocation(row,allowedWeatherIds));
           return bindRuntimeClaims(plan,"locations",fresh)
          }
          function runtimeDefinitions(plan,rows){return bindRuntimeClaims(plan,"definitions",rows||[])}
          '''
          s=s[:start]+replacement+s[end:]
          old='地點先定物理環境、accessRequirements、weatherProfile、historyRefs、lore；文化與交易留給下一階段。'
          new='地點先定物理環境、accessRequirements、weatherProfile、historyRefs、lore；文化與交易留給下一階段。accessRequirements 只能是 [] 或既有 Engine id 的結構化條件 [{type:"ITEM_OWNED|ITEM_USED|ITEM_SHOWN|ITEM_GIVEN|FACT_KNOWN|EVENT_OCCURRED",id:"既有 id",hint:"提示"}]；若沒有可引用的既有 id 必須輸出 []，自然語言危險／進入建議寫進 lore.story。weatherProfile 必須是 {zone:"",affinities:["既有 WTH id"],suppressions:["既有 WTH id"]}。lore 必須是 {story:"",unlockKeywords:[],minMatches:1}。'
          if old not in s: raise SystemExit('runtime prompt marker missing')
          s=s.replace(old,new)
          save(p,s)

          # Reject fake TRAVEL progress that points to the current location or a non-canonical target.
          p='src/state-sync.js';s=load(p)
          old='''  if(type==="DISCOVER_FACT"&&!discoverySourceGrounded(state,raw)){rejected.push({index,op:type,sourceKind:String(raw?.sourceKind||"").toUpperCase(),sourceId:clean(raw?.sourceId,120),reason:"DISCOVERY_SOURCE_NOT_OBSERVABLE"});continue}\n  if(type==="ACQUIRE_ITEM"&&!acquiredItemGrounded(raw,action)){rejected.push({index,op:type,itemName:clean(raw?.item?.name,100),reason:"ITEM_NOT_GROUNDED_IN_PLAYER_ACTION"});continue}\n  accepted.push(raw)'''
          new='''  if(type==="DISCOVER_FACT"&&!discoverySourceGrounded(state,raw)){rejected.push({index,op:type,sourceKind:String(raw?.sourceKind||"").toUpperCase(),sourceId:clean(raw?.sourceId,120),reason:"DISCOVERY_SOURCE_NOT_OBSERVABLE"});continue}\n  if(type==="ACQUIRE_ITEM"&&!acquiredItemGrounded(raw,action)){rejected.push({index,op:type,itemName:clean(raw?.item?.name,100),reason:"ITEM_NOT_GROUNDED_IN_PLAYER_ACTION"});continue}\n  if(type==="MOVE_PLAYER"){\n   const target=clean(raw?.location,120),current=clean(state?.player?.location||state?.world?.state?.location,120),locations=state?.world?.registry?.locations||[],entity=locations.find(x=>x?.id===target||x?.name===target);\n   if(!target||!entity){rejected.push({index,op:type,location:target,reason:"MOVE_TARGET_NOT_CANONICAL"});continue}\n   if(entity?.name===current||entity?.id===current){rejected.push({index,op:type,location:target,reason:"MOVE_TARGET_UNCHANGED"});continue}\n  }\n  accepted.push(raw)'''
          if old not in s: raise SystemExit('state grounding marker missing')
          s=s.replace(old,new);save(p,s)

          # Repair the exact malformed array-object boundary seen in v0.54.11 Scene JSON.
          p='src/model-json.js';s=load(p)
          marker='export function parseModelJSON(raw){'
          if marker not in s: raise SystemExit('model-json marker missing')
          helper=r'''function insertMissingModelCommas(value){
           let out="",inString=false,escaped=false;
           for(let i=0;i<value.length;i++){
            const ch=value[i];
            if(inString){out+=ch;if(escaped)escaped=false;else if(ch==="\\")escaped=true;else if(ch==='"')inString=false;continue}
            if(ch==='"'){inString=true;out+=ch;continue}
            if(ch==='{'||ch==='['){let j=out.length-1;while(j>=0&&/\s/.test(out[j]))j--;if(out[j]==='}'||out[j]===']')out=out.slice(0,j+1)+','+out.slice(j+1)}
            out+=ch
           }
           return out
          }

          '''.replace('\n          ','\n')
          s=s.replace(marker,helper+marker)
          old='''  const repaired=stripTrailingModelCommas(candidate);\n  if(repaired!==candidate)try{return JSON.parse(repaired)}catch(error){lastError=error}'''
          new='''  const repaired=stripTrailingModelCommas(candidate);\n  if(repaired!==candidate)try{return JSON.parse(repaired)}catch(error){lastError=error}\n  const structural=insertMissingModelCommas(repaired);\n  if(structural!==repaired)try{return JSON.parse(structural)}catch(error){lastError=error}'''
          if old not in s: raise SystemExit('model-json repair marker missing')
          s=s.replace(old,new);save(p,s)

          # Release/cache graph. 54011 was the previous coherent browser release token.
          for root in [Path('src'),Path('test')]:
           for f in root.rglob('*.js'):
            t=f.read_text(encoding='utf-8').replace('54011','54012')
            t=t.replace('state-sync.js?v=54006','state-sync.js?v=54012').replace('model-json.js?v=54007','model-json.js?v=54012')
            f.write_text(t,encoding='utf-8')
          for f in [Path('app.js'),Path('index.html')]:
           t=f.read_text(encoding='utf-8').replace('54011','54012').replace('state-sync.js?v=54006','state-sync.js?v=54012').replace('model-json.js?v=54007','model-json.js?v=54012')
           f.write_text(t,encoding='utf-8')

          require_replace('src/version.js','APP_VERSION="0.54.11"','APP_VERSION="0.54.12"')
          require_replace('package.json','"version": "0.54.11"','"version": "0.54.12"')
          require_replace('api/health.js','version:"0.54.11"','version:"0.54.12"')
          for p in ['test/version-ui.test.js','test/module-cache.test.js']:
           t=load(p).replace('0.54.11','0.54.12');save(p,t)

          tests=r'''import test from "node:test";
          import assert from "node:assert/strict";
          import {normalizeRuntimeLocation,bindRuntimeClaims} from "../src/runtime-generation-normalizer.js";
          import {parseModelJSON} from "../src/model-json.js";
          import {groundStatePatch} from "../src/state-sync.js";

          test("v0.54.12 normalizes common runtime Location shape drift before strict validation",()=>{
           const row={name:"晶脈裂谷",description:"灰蝕晶層形成的裂谷。",historyRefs:["HIST-1"],claimRefs:[],lore:"舊世界觀測站在此崩解。",weatherProfile:{dominantPhenomena:["WTH-2","WTH-VEIL"],description:"晶化雨頻繁"},accessRequirements:["需穿戴防切割裝備","需在低潮進入"]};
           const out=normalizeRuntimeLocation(row,["WTH-1","WTH-2","WTH-VEIL"]);
           assert.equal(out.lore.story,"舊世界觀測站在此崩解。");assert.deepEqual(out.weatherProfile.affinities,["WTH-2","WTH-VEIL"]);assert.deepEqual(out.accessRequirements,[]);assert.deepEqual(out.accessNotes,["需穿戴防切割裝備","需在低潮進入"])
          });

          test("v0.54.12 Engine removes mismatched causal claim refs and binds them to a satisfying row",()=>{
           const plan={claims:[{id:"C-F",type:"FUTURE_ANCHOR",historyRefs:["HIST-1"]},{id:"C-H",type:"HISTORY_ANCHOR",sourceRef:"HIST-1",historyRefs:["HIST-1"]}]};
           const rows=[{name:"錯誤地點",description:"x",historyRefs:["HIST-3"],claimRefs:["C-F"]},{name:"正確地點",description:"y",historyRefs:["HIST-1"],claimRefs:[]}];
           const out=bindRuntimeClaims(plan,"locations",rows);
           assert.deepEqual(out[0].claimRefs,[]);assert.deepEqual(new Set(out[1].claimRefs),new Set(["C-F","C-H"]))
          });

          test("v0.54.12 parser repairs missing commas between model-generated array objects",()=>{
           assert.deepEqual(parseModelJSON('{"suggestions":[{"label":"A"}\n{"label":"B"}]}'),{suggestions:[{label:"A"},{label:"B"}]})
          });

          test("v0.54.12 StatePatch rejects MOVE_PLAYER to current or non-canonical locations",()=>{
           const state={player:{location:"礦坑"},world:{state:{location:"礦坑"},registry:{locations:[{id:"L1",name:"礦坑"},{id:"L2",name:"哨站"}]}}};
           let r=groundStatePatch(state,{operations:[{op:"MOVE_PLAYER",location:"礦坑"}]},{action:"前進"});assert.equal(r.patch.operations.length,0);assert.equal(r.rejected[0].reason,"MOVE_TARGET_UNCHANGED");
           r=groundStatePatch(state,{operations:[{op:"MOVE_PLAYER",location:"不存在"}]},{action:"前進"});assert.equal(r.patch.operations.length,0);assert.equal(r.rejected[0].reason,"MOVE_TARGET_NOT_CANONICAL");
           r=groundStatePatch(state,{operations:[{op:"MOVE_PLAYER",location:"哨站"}]},{action:"前進"});assert.equal(r.patch.operations.length,1)
          });
          '''.replace('\n          ','\n').lstrip()
          save('test/v05412-regressions.test.js',tests)

          readme=load('README.md')
          if '### v0.54.12 — Runtime Schema Normalization' not in readme:
              readme += '''\n\n### v0.54.12 — Runtime Schema Normalization\n\n- Runtime Geography 先把 AI 常見的 Location schema 漂移正規化，再交給嚴格 Engine validator：字串 lore、不同 weatherProfile 形狀與自然語言 access notes 不再令整個 stage 報廢。\n- Runtime claim refs 改由 Engine 語義驗證與補綁；錯綁 FUTURE/HISTORY/BLUEPRINT claim 會清理，符合 historyRefs／definition kind 的新實體會自動綁定。\n- TRAVEL StatePatch 不再接受移動到目前同一地點或不存在的地點，避免假進展。\n- Model JSON parser 可修復陣列物件之間漏逗號的常見模型輸出錯誤。\n'''
              save('README.md',readme)

          # Temporary patch workflow removes itself from the resulting source commit.
          Path('.github/workflows/apply-v05412.yml').unlink()
          PY

          git config user.name "Elyndra Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v0.54.12: normalize runtime generation at Engine boundary"
          git push origin HEAD:fix/v05412-runtime-schema-normalization
