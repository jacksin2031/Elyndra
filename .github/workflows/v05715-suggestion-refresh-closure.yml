name: v0.57.15 suggestion refresh closure
on:
  push:
    branches: [feat/v0.57.15-suggestion-refresh]
permissions:
  contents: write
jobs:
  validate-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v0.57.15 suggestion refresh patch
        run: python scripts/apply_v05715_suggestion_refresh.py
      - name: Preserve runAction preamble and release assertion compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js')
          text=app.read_text(encoding='utf-8')
          old='if(!gameState)return;suggestionRefresh.exclude=[];suggestionRefresh.message="";suggestionRefresh.error=false;const actionState=gameState,actionSession=captureStateSession();markForegroundActivity();preemptBackgroundAI();'
          new='if(!gameState)return;const actionState=gameState,actionSession=captureStateSession();markForegroundActivity();preemptBackgroundAI();suggestionRefresh.exclude=[];suggestionRefresh.message="";suggestionRefresh.error=false;'
          assert text.count(old)==1, text.count(old)
          app.write_text(text.replace(old,new,1),encoding='utf-8')
          test=Path('test/version-0551-release.test.js')
          text=test.read_text(encoding='utf-8')
          old=r'0\.57\.14'
          new=r'0\.57\.15'
          assert old in text
          test.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Run non-download regression suite
        run: npm run test:nondownload
      - name: Validate diff
        run: git diff --check
      - name: Commit validated v0.57.15 closure
        run: |
          rm scripts/apply_v05715_suggestion_refresh.py
          rm .github/workflows/v05715-suggestion-refresh-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.15: add grounded suggestion refresh"
          git push origin HEAD:feat/v0.57.15-suggestion-refresh
