name: v0.57.15 suggestion refresh closure
on:
  push:
    branches: [feat/v0.57.15-suggestion-refresh]
permissions:
  contents: write
jobs:
  validate-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v0.57.15 suggestion refresh patch
        run: python scripts/apply_v05715_suggestion_refresh.py
      - name: Run non-download regression suite
        run: npm run test:nondownload
      - name: Validate diff
        run: git diff --check
      - name: Commit validated v0.57.15 closure
        run: |
          rm scripts/apply_v05715_suggestion_refresh.py
          rm .github/workflows/v05715-suggestion-refresh-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.15: add grounded suggestion refresh"
          git push origin HEAD:feat/v0.57.15-suggestion-refresh
