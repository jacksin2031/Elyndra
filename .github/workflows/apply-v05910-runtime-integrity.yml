name: Apply v0.59.10 runtime integrity patch

on:
  push:
    branches:
      - fix/v05910-runtime-integrity

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v05910-runtime-integrity.mjs')
          lines=p.read_text(encoding='utf-8').splitlines()
          found=0
          for i,line in enumerate(lines):
              if line.startswith('const importRe='):
                  lines[i]=r'''const importRe=/(from\s+["'])(\.{1,2}\/[^"']+?\.js)\?v=(\d+)(["'])/g;'''
                  found+=1
          if found != 1:
              raise SystemExit(f'expected one importRe line, got {found}')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          set +e
          node scripts/apply-v05910-runtime-integrity.mjs > .hotfix-v05910-error.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '\nexit_status=%s\n' "$status" >> .hotfix-v05910-error.txt
            git add .hotfix-v05910-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: record v0.59.10 patch guard failure"
              git push origin HEAD:fix/v05910-runtime-integrity
            fi
            exit "$status"
          fi
          rm -f .hotfix-v05910-error.txt .hotfix-v05910-test.log
      - name: Run focused regression tests
        run: node --test test/v05910-runtime-integrity.test.js
      - name: Verify version contract
        run: npm run version:check
      - name: Verify cache contract
        run: npm run cache:check
      - name: Verify JavaScript syntax
        run: node scripts/check-js.mjs
      - name: Run complete Node test suite
        run: node --test
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "fix: bound deferred state and ground runtime entities"
            git push origin HEAD:fix/v05910-runtime-integrity
          fi
