name: Apply v0.59.10 runtime integrity patch

on:
  push:
    branches:
      - fix/v05910-runtime-integrity

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        run: node scripts/apply-v05910-runtime-integrity.mjs
      - name: Run focused regression tests
        run: node --test test/v05910-runtime-integrity.test.js
      - name: Run full suite
        run: npm test
      - name: Verify cache-bust contract
        run: npm run check:cache-bust
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "fix: bound deferred state and ground runtime entities"
            git push origin HEAD:fix/v05910-runtime-integrity
          fi
