name: Apply v0.56.1 Runtime Fixes 4

on:
  push:
    branches:
      - fix/v0.56.1-runtime-grounding
    paths:
      - .github/workflows/v0561-apply4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply verified v0.56.1 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/v0561-finalize.yml').read_text(encoding='utf-8').splitlines()
          marker='      - name: Patch v0.56.1 runtime regressions'
          start=src.index(marker)
          run_idx=next(i for i in range(start+1,len(src)) if src[i].strip()=='run: |')
          end=next(i for i in range(run_idx+1,len(src)) if src[i].startswith('      - name: Install'))
          body=[line[10:] if line.startswith('          ') else line for line in src[run_idx+1:end]]
          Path('/tmp/v0561-patch.py').write_text('\n'.join(body)+'\n',encoding='utf-8')
          PY
          python /tmp/v0561-patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('test/v0561-runtime-grounding.test.js');text=p.read_text(encoding='utf-8');old='open:true}},canon:{facts:[]}'
          if old not in text: raise SystemExit('route fixture anchor missing')
          p.write_text(text.replace(old,'open:true}]},canon:{facts:[]}',1),encoding='utf-8')

          p=Path('src/contextual-actions.js');text=p.read_text(encoding='utf-8');old='const corrected=kind!==x.kind||localTravel;'
          if old not in text: raise SystemExit('reclassification anchor missing')
          p.write_text(text.replace(old,'const corrected=kind!==x.kind;',1),encoding='utf-8')

          p=Path('test/module-cache.test.js');text=p.read_text(encoding='utf-8').replace('56000','56001');text=text.replace('v0.55.2 keeps structured AI and Developer Autotest cache graphs coherent','v0.56.1 keeps structured AI and Developer Autotest cache graphs coherent').replace('v0.54.19 cache generation','v0.56.1 cache generation').replace('v0.54.19 cache token','v0.56.1 cache token');p.write_text(text,encoding='utf-8')

          for name in ['test/version-0551-release.test.js','test/version-ui.test.js']:
              p=Path(name);text=p.read_text(encoding='utf-8').replace('0.56.0','0.56.1').replace('0\\.56\\.0','0\\.56\\.1').replace('56000','56001');p.write_text(text,encoding='utf-8')
          PY
      - name: Syntax
        run: |
          node --check src/state-sync.js
          node --check src/contextual-actions.js
          node --check src/model-json.js
          node --check app.js
          node --check test/v0561-runtime-grounding.test.js
      - name: Full test suite
        env:
          CACHE_BASE_REF: main
        run: npm test
      - name: Commit verified source changes
        run: |
          git config user.name "A24DC523"
          git config user.email "a24dc523@dhw.ac.jp"
          git add -A -- . ':(exclude).github/workflows/*'
          git commit -m "v0.56.1: harden scene grounding and semantic gating"
          git push origin HEAD:fix/v0.56.1-runtime-grounding
