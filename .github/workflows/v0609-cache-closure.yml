name: v0.60.9 cache closure
on:
  push:
    branches: [fix/v0609-ja-turn-export]
permissions:
  contents: write
jobs:
  close-cache:
    if: "!contains(github.event.head_commit.message, '[cache-closed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply cache dependency closure
        run: python3 scripts/v0609_cache_closure.py
      - name: Validate cache closure
        env:
          CACHE_BASE_REF: origin/main
        run: npm run cache:check
      - name: Syntax and v0.60.9 regression
        run: |
          node scripts/check-js.mjs
          node --test test/v0609-ja-turn-export-regression.test.js test/nonblocking-turn-sync.test.js test/version-0551-release.test.js
      - name: Commit closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js src/ai-autotest.js src/ai-client.js src/adventure-engine.js
          git commit -m 'fix: close v0.60.9 browser module cache graph [cache-closed]'
          git push origin HEAD:fix/v0609-ja-turn-export
