name: Elyndra AutoTest IAB transfer v0.57.6 land

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autotest-iab-transfer-v0576-land.yml'
      - '.github/autotest-iab-transfer-v0576-patch.py'
      - '.github/autotest-iab-transfer-v0576-fix.py'

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.57.6 IAB transfer patch
        run: |
          python3 .github/autotest-iab-transfer-v0576-patch.py
          python3 .github/autotest-iab-transfer-v0576-fix.py
      - name: Run targeted regressions
        run: |
          set +e
          node --test test/autotest-iab-transfer-v0576.test.js test/ai-autotest-first-button-hotfix.test.js test/autotest-export-v0573.test.js test/autotest-save-v0574.test.js test/autotest-copy-v0575.test.js test/version-ui.test.js test/version-0551-release.test.js > /tmp/v0576-targeted.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            cp /tmp/v0576-targeted.log .github/v0576-targeted-failures.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v0576-targeted-failures.txt
            git commit -m "chore: capture v0.57.6 targeted failures"
            git push origin main
            cat /tmp/v0576-targeted.log
            exit "$code"
          fi
          cat /tmp/v0576-targeted.log
      - name: Run full test suite
        run: |
          set +e
          npm test > /tmp/v0576-full.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            cp /tmp/v0576-full.log .github/v0576-full-failures.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v0576-full-failures.txt
            git commit -m "chore: capture v0.57.6 full-suite failures"
            git push origin main
            cat /tmp/v0576-full.log
            exit "$code"
          fi
          cat /tmp/v0576-full.log
      - name: Commit tested v0.57.6
        run: |
          rm -f .github/workflows/autotest-iab-transfer-v0576-land.yml .github/autotest-iab-transfer-v0576-patch.py .github/autotest-iab-transfer-v0576-fix.py .github/v0576-targeted-failures.txt .github/v0576-full-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover AutoTest exports inside IAB"
          git push origin main
