name: Temporary v0.55.1 Failure Diagnosis

on:
  push:
    branches:
      - release/v0.55.1-world-law-hardening
    paths:
      - '.github/workflows/tmp-v0551-world-law-hardening.yml'

permissions:
  contents: write

jobs:
  extract-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Extract concise TAP failure blocks from committed diagnosis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('tmp-v0551-test-failures.txt')
          lines = source.read_text(errors='replace').splitlines()
          starts = [i for i, line in enumerate(lines) if re.match(r'^\s*not ok \d+ - ', line)]
          out = []
          seen = set()
          for start in starts:
              title = lines[start].strip()
              if title in seen:
                  continue
              seen.add(title)
              out.append(f'===== {title} =====')
              # Node TAP diagnostics, assertion details and stack are normally adjacent.
              for line in lines[start:min(len(lines), start + 55)]:
                  if line.strip().startswith(('ok ', 'not ok ')) and line is not lines[start] and len(out) > 1:
                      break
                  out.append(line)
              out.append('')
          out.append('===== SUMMARY =====')
          for line in lines:
              if re.match(r'^\s*# (?:tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)\b', line):
                  text = line.strip()
                  if text not in out:
                      out.append(text)
          if not seen:
              out.append('No TAP failure headings found.')
          Path('tmp-v0551-failure-summary.txt').write_text('\n'.join(out) + '\n')
          PY
          git config user.name 'JackSin'
          git config user.email 'japanjacksin@gmail.com'
          git add tmp-v0551-failure-summary.txt
          git commit -m 'chore: extract concise v0.55.1 failures' || true
          git push origin HEAD:release/v0.55.1-world-law-hardening
