name: Temporary v0.55.1 Regression Repair

# harness revision 2: server/client chronology anchors split
on:
  push:
    branches:
      - release/v0.55.1-world-law-hardening
    paths:
      - '.github/workflows/tmp-v0551-world-law-hardening.yml'

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Apply grouped v0.55.1 regression repairs and run full suite
        shell: bash
        run: |
          python scripts/tmp-fix-v0551-regressions.py
          set +e
          npm test 2>&1 | tee /tmp/v0551-after-fix.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/v0551-after-fix.log').read_text(errors='replace').splitlines()
          starts=[i for i,line in enumerate(lines) if re.match(r'^\s*not ok \d+ - ',line)]
          out=[]
          for start in starts:
              out.append('===== '+lines[start].strip()+' =====')
              out.extend(lines[start:min(len(lines),start+45)])
              out.append('')
          out.append('===== SUMMARY =====')
          out.extend(line.strip() for line in lines if re.match(r'^\s*# (?:tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)\b',line))
          Path('tmp-v0551-after-fix.txt').write_text('\n'.join(out)+'\n')
          PY
          else
            printf 'v0.55.1 Node 20 full suite: PASS\n' > tmp-v0551-after-fix.txt
          fi
          git config user.name 'JackSin'
          git config user.email 'japanjacksin@gmail.com'
          git add -A
          git commit -m 'fix: repair v0.55.1 regression contracts' || true
          git push origin HEAD:release/v0.55.1-world-law-hardening
          exit "$rc"
