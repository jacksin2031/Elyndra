name: Temporary v0.55.0 AI Contract Hardening

on:
  push:
    branches:
      - release/v0.55.0-ai-contract-hardening
    paths:
      - '.github/workflows/tmp-v0550-ai-contract-hardening.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Apply v0.55.0 patch
        run: |
          python scripts/tmp-apply-v0550.py
          python scripts/tmp-fix-v0550-compat.py
      - name: Bump package version
        run: npm version 0.55.0 --no-git-tag-version --allow-same-version
      - name: Run full test suite
        run: npm test
      - name: Commit verified release branch
        shell: bash
        run: |
          rm .github/workflows/tmp-v0550-ai-contract-hardening.yml scripts/tmp-apply-v0550.py scripts/tmp-fix-v0550-compat.py
          git config user.name 'JackSin'
          git config user.email 'japanjacksin@gmail.com'
          git add -A
          git commit -m 'feat: harden Elyndra AI contracts for v0.55.0'
          git push origin HEAD:release/v0.55.0-ai-contract-hardening
