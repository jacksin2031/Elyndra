name: v0.59.9 PR verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run version:check
      - run: node scripts/check-js.mjs
      - run: python3 scripts/scan-i18n-coverage.py
      - run: node --test test/v05908-runtime-recovery.test.js test/ai-autotest-first-button-hotfix.test.js test/version-ui.test.js
