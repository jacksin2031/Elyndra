name: v0.57.18 non-download delivery closure

on:
  push:
    branches:
      - feat/v0.57.18-iab-delivery-route

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply v0.57.18 delivery repair
        run: python scripts/v05718_patch.py
      - name: Run focused pure delivery contract
        run: node --test test/v05718-delivery-route-contract.test.js
      - name: Run full non-download regression suite
        run: npm run test:nondownload
      - name: Check diff
        run: git diff --check
      - name: Commit validated repair
        run: |
          rm -f scripts/v05718_patch.py .github/workflows/v05718-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.57.18: restore embedded-browser attachment delivery"
          git push origin HEAD:feat/v0.57.18-iab-delivery-route
