name: v0.57.24 AutoTest language barrier closure
on:
  push:
    branches: [fix/v0.57.24-autotest-language-barrier]
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v0.57.24 patch
        run: python3 scripts/v05724_patch.py
      - name: Focused AutoTest and language regressions
        run: node --test test/v05724-autotest-language-barrier.test.js test/origin-rule-kernel-v045.test.js
      - name: Run non-download regression suite
        run: npm run test:nondownload
        env:
          CACHE_BASE_REF: main
      - name: Check diff
        run: git diff --check
      - name: Commit validated v0.57.24 product
        env:
          BRANCH: fix/v0.57.24-autotest-language-barrier
        run: |
          rm scripts/v05724_patch.py .github/workflows/v05724-closure.yml
          git config user.name "Elyndra CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.57.24: fix AutoTest expansion and HIGH language barrier"
          git push origin HEAD:$BRANCH
