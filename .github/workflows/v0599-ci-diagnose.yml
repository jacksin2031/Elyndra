name: Diagnose v0.59.9 full regression suite
on:
  push:
    branches: [fix/v0599-ci-regression]
    paths: [.github/workflows/v0599-ci-diagnose.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0599-ci-regression
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Capture focused suite output
        id: suite
        continue-on-error: true
        run: |
          node --test test/v05908-runtime-recovery.test.js test/version-policy.test.js test/first-button-stall-recovery-v05419.test.js test/ai-autotest-first-button-hotfix.test.js test/v05904-creator-locale-regressions.test.js test/viewport-stability.test.js test/dice-feedback.test.js test/v05903-locale-completeness.test.js test/v05902-world-compile-i18n-notes.test.js test/v05901-i18n-coverage.test.js test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js > regression-${{ matrix.node }}.txt 2>&1
      - name: Persist diagnostic
        if: steps.suite.outcome == 'failure' && matrix.node == 24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regression-24.txt
          git commit -m "chore: capture v0.59.9 full regression output"
          git push origin HEAD:fix/v0599-ci-regression
      - name: Require focused suite
        if: steps.suite.outcome == 'failure'
        run: exit 1
