name: One-shot Elyndra v0.54.18 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply v0.54.18 release bump
        run: python scripts/.tmp-release-05418.py
      - name: Run full test suite
        run: npm test
      - name: Commit release and remove one-shot files
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-release-05418.yml scripts/.tmp-release-05418.py
          git add package.json src/version.js app.js index.html src test
          git commit -m "release: Elyndra v0.54.18 [v05418-done]"
          git push origin HEAD:main
