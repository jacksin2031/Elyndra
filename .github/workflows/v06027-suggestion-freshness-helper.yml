name: v0.60.27 Suggestion Freshness Helper
on:
  push:
    branches: [fix/v06027-debug-visibility-boundary]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06027-debug-visibility-boundary
          fetch-depth: 0
      - name: Apply suggestion freshness patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js')
          s=app.read_text()
          old=''' const source=preview.suggestionIntents?.length?preview.suggestionIntents:(preview.suggestions||[]),checked=filterSuggestionProvenance(source,scope);if(checked.rejected.length)recordDebug("SUGGESTION_PROVENANCE_REJECTED",{action:String(action||"").slice(0,180),worldId,currentLocation:scope.currentLocation,rejected:checked.rejected.map(x=>({action:String(x.row?.action||x.row?.label||x.row||"").slice(0,220),issues:x.issues}))});\n if(source.length){const contextual=buildContextualActionSet(state,checked.accepted);state.suggestionIntents=contextual.all;state.suggestions=contextual.all.map(x=>x.label)}\n return true\n}'''
          new=''' const source=preview.suggestionIntents?.length?preview.suggestionIntents:(preview.suggestions||[]),checked=filterSuggestionProvenance(source,scope);if(checked.rejected.length)recordDebug("SUGGESTION_PROVENANCE_REJECTED",{action:String(action||"").slice(0,180),worldId,currentLocation:scope.currentLocation,rejected:checked.rejected.map(x=>({action:String(x.row?.action||x.row?.label||x.row||"").slice(0,220),issues:x.issues}))});\n const contextual=buildContextualActionSet(state,source.length?checked.accepted:[]);state.suggestionIntents=contextual.all;state.suggestions=contextual.all.map(x=>x.label);\n if(!source.length)recordDebug("PLAYER_ACTION_SUGGESTIONS_REBUILT",{action:String(action||"").slice(0,180),reason:"SCENE_NO_FRESH_SUGGESTIONS",suggestions:contextual.all.length});\n return true\n}'''
          if old not in s: raise SystemExit('applyPlayerActionScene target not found')
          app.write_text(s.replace(old,new,1))

          index=Path('index.html'); t=index.read_text()
          if 'app.js?v=60019' not in t: raise SystemExit('index app token target missing')
          index.write_text(t.replace('app.js?v=60019','app.js?v=60027'))

          # Align release-token assertions without touching the intentionally retained v0.60.26 AI wrapper tokens.
          targeted={
            'test/v06011-ja-runtime-coherence.test.js': [
              ('v0.60.26 wrapper chain','v0.60.27 wrapper chain'),
              ('version\\.js\\?v=60026','version\\.js\\?v=60027')],
            'test/v06014-manual-regressions.test.js': [
              ('version\\.js\\?v=60026','version\\.js\\?v=60027'),
              ('JSON.parse(pkg).version,"0.60.26"','JSON.parse(pkg).version,"0.60.27"')],
            'test/v06015-ja-live-regressions.test.js': [
              ('JSON.parse(pkg).version,"0.60.26"','JSON.parse(pkg).version,"0.60.27"'),
              ('version\\.js\\?v=60026','version\\.js\\?v=60027')],
            'test/v06021-ja-manual-regressions.test.js': [
              ('Focused v0\\.60\\.26 regressions','Focused v0\\.60\\.27 regressions'),
              ('version\\.js\\?v=60026','version\\.js\\?v=60027'),
              ('v0\\\\\\.60\\\\\\.26','v0\\\\\\.60\\\\\\.27')],
            'test/v06023-ja-weather-helper-background-regressions.test.js': [
              ('version\\.js\\?v=60026','version\\.js\\?v=60027'),
              ('Focused v0\\.60\\.26 regressions','Focused v0\\.60\\.27 regressions'),
              ('v0\\\\\\.60\\\\\\.26','v0\\\\\\.60\\\\\\.27')],
            'test/v06025-observation-narrative-regression.test.js': [
              ('v0.60.26 release wiring','v0.60.27 release wiring'),
              ('version\\.js\\?v=60026','version\\.js\\?v=60027'),
              ('Focused v0\\.60\\.26 regressions','Focused v0\\.60\\.27 regressions'),
              ('v0\\\\\\.60\\\\\\.26','v0\\\\\\.60\\\\\\.27')],
          }
          for name,reps in targeted.items():
              p=Path(name); u=p.read_text()
              for oldv,newv in reps: u=u.replace(oldv,newv)
              p.write_text(u)

          # app.js itself is now a v0.60.27 browser asset, so release-contract assertions must expect the new token.
          for p in Path('test').glob('*.test.js'):
              u=p.read_text()
              u=u.replace('app\\.js\\?v=60019','app\\.js\\?v=60027')
              u=u.replace('app.js?v=60019','app.js?v=60027')
              p.write_text(u)
          PY
          cat > test/v06027-suggestion-freshness-regression.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          import {sceneTurnPreview} from "../src/turn-compiler.js";

          test("v0.60.27 duplicate scene suggestions are intentionally suppressed by the turn compiler",()=>{
            const previous=[{label:"霧の流れを観察する",action:"霧の流れを観察する",kind:"OBSERVE",risk:"LOW",requirementsSatisfied:true}];
            const preview=sceneTurnPreview({narrative:"状況は続いている。",suggestions:previous},{success:true},{action:"霧を見る",priorSuggestions:previous.map(x=>x.label),priorSuggestionIntents:previous});
            assert.deepEqual(preview.suggestionIntents,[]);
            assert.deepEqual(preview.suggestions,[]);
          });

          test("v0.60.27 app rebuilds contextual suggestions instead of retaining the previous three when scene suggestions are empty",async()=>{
            const [app,index]=await Promise.all([readFile(new URL("../app.js",import.meta.url),"utf8"),readFile(new URL("../index.html",import.meta.url),"utf8")]);
            assert.match(app,/const contextual=buildContextualActionSet\(state,source\.length\?checked\.accepted:\[\]\);state\.suggestionIntents=contextual\.all;state\.suggestions=contextual\.all\.map\(x=>x\.label\)/);
            assert.match(app,/PLAYER_ACTION_SUGGESTIONS_REBUILT/);
            assert.match(app,/SCENE_NO_FRESH_SUGGESTIONS/);
            assert.doesNotMatch(app,/if\(source\.length\)\{const contextual=buildContextualActionSet\(state,checked\.accepted\)/);
            assert.match(index,/app\.js\?v=60027/);
          });
          EOF
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html test
          git commit -m "fix: rebuild suggestions when scene returns no fresh actions"
          git push origin HEAD:fix/v06027-debug-visibility-boundary
