name: Validate v0.60.30 hotfix
on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v06030.mjs
      - .github/workflows/apply-v06030.yml
permissions:
  contents: read

x-common: &common
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 20
    - name: Apply release patch in runner
      run: node scripts/apply-v06030.mjs

jobs:
  syntax:
    <<: *common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 20}
      - run: node scripts/apply-v06030.mjs
      - run: node scripts/check-js.mjs
  regression:
    <<: *common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 20}
      - run: node scripts/apply-v06030.mjs
      - run: node --test test/v06030-debug-world-evolution-regression.test.js
  quality:
    <<: *common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 20}
      - run: node scripts/apply-v06030.mjs
      - run: node --test test/v06029-world-quality-retry.test.js
  evolution:
    <<: *common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 20}
      - run: node scripts/apply-v06030.mjs
      - run: node --test test/background-world-evolution.test.js
  telemetry:
    <<: *common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 20}
      - run: node scripts/apply-v06030.mjs
      - run: node --test test/debug-telemetry.test.js
