name: Apply v0.60.30 hotfix
on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v06030.mjs
      - .github/workflows/apply-v06030.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply release patch
        run: node scripts/apply-v06030.mjs
      - name: Validate and capture diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/v06030-diagnostics.txt
          run_check() {
            label="$1"; shift
            echo "===== $label =====" | tee -a /tmp/v06030-diagnostics.txt
            "$@" >> /tmp/v06030-diagnostics.txt 2>&1
            code=$?
            echo "EXIT=$code" | tee -a /tmp/v06030-diagnostics.txt
            echo >> /tmp/v06030-diagnostics.txt
            return $code
          }
          failed=0
          run_check syntax node scripts/check-js.mjs || failed=1
          run_check v06030 node --test test/v06030-debug-world-evolution-regression.test.js || failed=1
          run_check quality node --test test/v06029-world-quality-retry.test.js || failed=1
          run_check evolution node --test test/background-world-evolution.test.js || failed=1
          run_check telemetry node --test test/debug-telemetry.test.js || failed=1
          cat /tmp/v06030-diagnostics.txt
          if [ "$failed" -ne 0 ]; then
            cp /tmp/v06030-diagnostics.txt .github/v06030-diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v06030-diagnostics.txt
            git commit -m "ci: capture v0.60.30 validation diagnostics"
            git push origin HEAD:main
            exit 1
          fi
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html package.json src/version.js src/v06029-world-quality-hotfix.js src/v06030-world-evolution-repair.js test/v06030-debug-world-evolution-regression.test.js test/version-ui.test.js .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "v0.60.30: make debug export verifiable and bound world evolution retries"
          git push origin HEAD:main
