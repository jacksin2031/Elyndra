name: Social Conflict 2.0 Bootstrap
on:
  push:
    branches:
      - feat/trpg-depth-social-v060
permissions:
  contents: write
concurrency:
  group: social-v0602-bootstrap
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Patch Social 2.0 runtime
        run: |
          python3 scripts/social-v0602-bootstrap.py
          npm run version:check
          CACHE_BASE_REF=feat/trpg-depth-combat-v060 npm run cache:check
          node scripts/check-js.mjs
          python3 scripts/scan-i18n-coverage.py
          node --test test/social-conflict-v0602.test.js test/combat-v0601.test.js test/trpg-depth-v060.test.js test/version-ui.test.js test/version-0551-release.test.js
          git restore .github/workflows/pages.yml
          if ! git diff --quiet; then
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add app.js index.html package.json src/version.js src/combat-engine.js src/social-conflict-engine.js test/combat-v0601.test.js test/version-ui.test.js test/version-0551-release.test.js
            git commit -m "feat: integrate Social Conflict 2.0 runtime"
            git push origin HEAD:feat/trpg-depth-social-v060
          fi
