name: Social Conflict 2.0 Validation
on:
  push:
    branches:
      - feat/trpg-depth-social-v060
permissions:
  contents: read
concurrency:
  group: social-v0602-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fetch stacked base
        run: git fetch origin feat/trpg-depth-combat-v060:refs/remotes/origin/feat/trpg-depth-combat-v060
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-combat-v060
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Social Combat and TRPG regressions
        run: node --test test/social-conflict-v0602.test.js test/combat-v0601.test.js test/trpg-depth-v060.test.js test/contextual-actions.test.js test/dice-feedback.test.js test/version-policy.test.js test/version-ui.test.js test/version-0551-release.test.js
