name: Elyndra resilience diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resilience-suite-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply staged resilience patch
        shell: bash
        run: |
          awk '/^          python3 <<'\''PY'\''$/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag {sub(/^          /,""); print}' .github/workflows/resilience-suite-hotfix.yml > /tmp/elyndra-resilience-patch.py
          test -s /tmp/elyndra-resilience-patch.py
          python3 /tmp/elyndra-resilience-patch.py
      - name: Run targeted resilience tests and capture output
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test test/model-json.test.js test/v0561-runtime-grounding.test.js test/autotest-resilience-v0572.test.js 2>&1 | tee /tmp/resilience-targeted.log
      - name: Run full suite if targeted passed
        id: full
        if: steps.targeted.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/resilience-full.log
      - name: Persist diagnostic when tests fail
        if: steps.targeted.outcome != 'success' || steps.full.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '# Elyndra resilience test diagnostic'
            echo
            echo '## Targeted tests'
            cat /tmp/resilience-targeted.log || true
            echo
            echo '## Full suite'
            cat /tmp/resilience-full.log 2>/dev/null || true
          } > .github/resilience-test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/resilience-test-failure.txt
          git commit -m "chore: capture resilience test failure"
          git push origin HEAD:main
      - name: Fail after persisting diagnostics
        if: steps.targeted.outcome != 'success' || steps.full.outcome == 'failure'
        run: exit 1
      - name: Commit tested hotfix
        if: steps.targeted.outcome == 'success' && steps.full.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/resilience-suite-hotfix.yml .github/workflows/resilience-suite-hotfix-run.yml .github/workflows/resilience-suite-diagnostic.yml
          git rm -f .github/resilience-test-failure.txt 2>/dev/null || true
          git add app.js src/state-sync.js src/model-json.js src/ai-settings.js src/world-quality.js src/ai-autotest.js test/model-json.test.js test/v0561-runtime-grounding.test.js test/autotest-resilience-v0572.test.js
          git commit -m "fix: harden AutoTest state and AI resilience"
          git push origin HEAD:main
