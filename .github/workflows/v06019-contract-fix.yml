name: Bootstrap v0.60.19 legacy contract
on:
  push:
    branches: [fix/v06019-ja-manual-regressions]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v06019-contract-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Advance current-release wiring assertions only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/v06015-ja-live-regressions.test.js')
          t=p.read_text()
          reps=[
            ('test("v0.60.18 release wiring loads Japanese UI, Engine and AI assessment wrappers"','test("v0.60.19 release wiring loads Japanese UI, Engine and AI assessment wrappers"'),
            ('assert.equal(JSON.parse(pkg).version,"0.60.18")','assert.equal(JSON.parse(pkg).version,"0.60.19")'),
            ('APP_VERSION="0\\.60\\.18"','APP_VERSION="0\\.60\\.19"'),
            ('v06015-runtime-ui-hotfix\\.js\\?v=60018','v06019-runtime-ui-hotfix\\.js\\?v=60019'),
            ('"\\.\\/src\\/version\\.js\\?v=60010":"\\.\\/src\\/version\\.js\\?v=60018"','"\\.\\/src\\/version\\.js\\?v=60010":"\\.\\/src\\/version\\.js\\?v=60019"'),
            ('"\\.\\/src\\/game-engine\\.js\\?v=60006":"\\.\\/src\\/v06011-game-engine-hotfix\\.js\\?v=60018"','"\\.\\/src\\/game-engine\\.js\\?v=60006":"\\.\\/src\\/v06019-game-engine-hotfix\\.js\\?v=60019"'),
            ('"\\.\\/src\\/ai-client\\.js\\?v=60010":"\\.\\/src\\/v06017-ai-client-hotfix\\.js\\?v=60017"','"\\.\\/src\\/ai-client\\.js\\?v=60010":"\\.\\/src\\/v06019-ai-client-hotfix\\.js\\?v=60019"')
          ]
          for old,new in reps:
              if old not in t: raise SystemExit(f'missing release assertion anchor: {old}')
              t=t.replace(old,new,1)
          p.write_text(t)
          PY
          node --test test/v06015-ja-live-regressions.test.js test/v06019-ja-manual-regressions.test.js
      - name: Commit current release contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/v06015-ja-live-regressions.test.js
          git commit -m "test: advance Japanese live release contract to v0.60.19 [v06019-contract-wired]"
          git push origin HEAD:${GITHUB_REF_NAME}
