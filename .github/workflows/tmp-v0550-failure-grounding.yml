name: Temporary v0.55.0 Failure Grounding Guard

on:
  push:
    branches:
      - release/v0.55.0-ai-contract-hardening
    paths:
      - '.github/workflows/tmp-v0550-failure-grounding.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Apply failed-outcome grounding guard
        run: python scripts/tmp-fix-v0550-failure-grounding.py
      - name: Run full test suite
        run: npm test
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/tmp-v0550-failure-grounding.yml scripts/tmp-fix-v0550-failure-grounding.py
          git config user.name 'JackSin'
          git config user.email 'japanjacksin@gmail.com'
          git add -A
          git commit -m 'fix: block failed item and travel state commits'
          git push origin HEAD:release/v0.55.0-ai-contract-hardening
