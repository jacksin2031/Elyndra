name: v0.59.0 Multilingual Hardening

on:
  push:
    branches:
      - feat/v0.59.0-multilingual-runtime
    paths:
      - scripts/v05900_hardening.py
      - .github/workflows/v05900-multilingual-hardening.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply multilingual hardening
        run: python3 scripts/v05900_hardening.py
      - name: Focused multilingual regressions
        run: node --test test/v05900-multilingual-runtime.test.js test/v05730-npc-player-facing-identity-privacy.test.js test/v05730-scene-dialogue-contract.test.js test/version-0551-release.test.js test/version-ui.test.js
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        env:
          CACHE_BASE_REF: main
        run: npm run cache:check
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit hardened v0.59.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ':!.github/workflows/v05900-multilingual-hardening.yml' \
            ':!scripts/v05900_hardening.py' \
            ':!.github/workflows/v05900-multilingual-integration.yml' \
            ':!scripts/v05900_multilang.py'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: harden v0.59.0 language isolation and world-entry translation"
            git push origin HEAD:feat/v0.59.0-multilingual-runtime
          fi
