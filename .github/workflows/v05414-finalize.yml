name: v0.54.14 finalize

on:
  push:
    branches:
      - fix/v05414-runtime-quest-normalization
    paths:
      - .github/workflows/v05414-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v05414-runtime-quest-normalization
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply and verify v0.54.14
        shell: bash
        run: |
          python .github/scripts/v05414_patch.py
          rm -f .github/scripts/v05414_patch.py .github/workflows/v05414-finalize.yml
          npm test
          git diff --check
          git config user.name "elyndra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize runtime quests and autotest progress"
          CACHE_BASE_REF=main npm run cache:check
          git push origin HEAD:fix/v05414-runtime-quest-normalization
