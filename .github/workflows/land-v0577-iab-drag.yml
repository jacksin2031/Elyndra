name: Land v0.57.7 IAB native drag export

on:
  push:
    paths:
      - ".github/workflows/land-v0577-iab-drag.yml"

permissions:
  contents: write

jobs:
  patch-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/land-v0577.py
      - name: Targeted tests
        run: node --test test/autotest-iab-drag-v0577.test.js test/autotest-iab-transfer-v0576.test.js
      - name: Full tests
        run: npm test
      - name: Commit tested release
        shell: bash
        run: |
          rm .github/workflows/land-v0577-iab-drag.yml scripts/land-v0577.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add native IAB drag export"
          git push origin HEAD:main
