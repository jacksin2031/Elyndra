name: Drive System v0.60.5 Bootstrap
on:
  push:
    branches:
      - feat/trpg-depth-drives-v060
permissions:
  contents: write
concurrency:
  group: drive-v0605-bootstrap
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Apply Drive System integration
        run: |
          if grep -q 'APP_VERSION="0.60.4"' src/version.js; then
            python3 scripts/drive-v0605-bootstrap.py
          else
            echo "Drive System integration already applied"
          fi
      - name: Version contract
        run: npm run version:check
      - name: Browser cache contract
        run: npm run cache:check
        env:
          CACHE_BASE_REF: feat/trpg-depth-talents-v060
      - name: JavaScript syntax gate
        run: node scripts/check-js.mjs
      - name: Static i18n coverage
        run: python3 scripts/scan-i18n-coverage.py
      - name: Drive System regressions
        run: node --test test/drive-engine-v0605.test.js
      - name: Talent regressions
        run: node --test test/talent-rules-v0604.test.js
      - name: NPC Agency regressions
        run: node --test test/npc-agency-v0603.test.js
      - name: Social Conflict regressions
        run: node --test test/social-conflict-v0602.test.js
      - name: Combat regressions
        run: node --test test/combat-v0601.test.js
      - name: TRPG foundation regressions
        run: node --test test/trpg-depth-v060.test.js
      - name: Release/UI contracts
        run: node --test test/version-ui.test.js test/version-0551-release.test.js
      - name: Commit validated integration
        run: |
          if ! git diff --quiet; then
            git config user.name "Elyndra CI"
            git config user.email "actions@users.noreply.github.com"
            git add .github/workflows/pages.yml app.js index.html package.json src/version.js src/drive-engine.js src/quest-engine.js src/game-engine.js src/npc-conversation.js src/npc-dialogue-engine.js src/adventure-engine.js src/progression-ui.js test/drive-engine-v0605.test.js test/version-ui.test.js test/version-0551-release.test.js
            git commit -m "feat: integrate player Drive System v0.60.5"
            git push origin HEAD:feat/trpg-depth-drives-v060
          fi
