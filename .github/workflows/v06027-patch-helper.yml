name: v0.60.27 Patch Helper
on:
  push:
    branches: [fix/v06027-debug-visibility-boundary]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v06027-debug-visibility-boundary
          fetch-depth: 0
      - name: Apply v0.60.27 debug visibility patch
        shell: bash
        run: |
          set -euo pipefail
          cat > src/v06027-debug-visibility.js <<'EOF'
          const JA=Object.freeze({internalWorld:"内部Canon世界",playerView:"プレイヤー表示",world:"世界",location:"現在地",baselineInternal:"baseline（内部状態）",unknownWorld:"未知の世界",unknownLocation:"未知の場所"});
          const ZH=Object.freeze({internalWorld:"內部 Canon 世界",playerView:"玩家可見",world:"世界",location:"目前位置",baselineInternal:"baseline（內部狀態）",unknownWorld:"未知世界",unknownLocation:"未知地點"});
          const EN=Object.freeze({internalWorld:"Internal canon world",playerView:"Player view",world:"World",location:"Location",baselineInternal:"baseline (internal state)",unknownWorld:"Unknown world",unknownLocation:"Unknown location"});
          export function v06027DebugBoundaryLabels(locale="zh-Hant"){return locale==="ja"?JA:locale==="en"?EN:ZH}
          export function v06027DebugPlayerView({locale="zh-Hant",world="",location=""}={}){const t=v06027DebugBoundaryLabels(locale);return {heading:t.playerView,worldLabel:t.world,locationLabel:t.location,world:String(world||t.unknownWorld),location:String(location||t.unknownLocation)}}
          EOF
          cat > src/v06027-runtime-ui-hotfix.js <<'EOF'
          import "./v06024-runtime-ui-hotfix.js?v=60024";
          import {v06027DebugBoundaryLabels,v06027DebugPlayerView} from "./v06027-debug-visibility.js?v=60027";
          const locale=()=>String(globalThis.ELYNDRA_LOCALE||document.querySelector("#languageSelect")?.value||"zh-Hant");
          const setText=(el,value)=>{if(el&&el.textContent!==value)el.textContent=value};
          function playerViewCard(grid,versionCard){
           let card=grid?.querySelector?.('[data-v06027-player-view="true"]');
           if(card)return card;
           if(!grid)return null;
           card=document.createElement("div");card.className="debug-stat";card.dataset.v06027PlayerView="true";
           const small=document.createElement("small"),strong=document.createElement("strong"),span=document.createElement("span");card.append(small,strong,span);
           if(versionCard?.parentNode===grid)versionCard.after(card);else grid.prepend(card);return card
          }
          export function repairV06027DebugVisibilityBoundary(root=document){
           const modal=root.querySelector?.("#modalContent");if(!modal||!String(modal.textContent||"").includes("ELYNDRA DEBUG"))return false;
           const labels=v06027DebugBoundaryLabels(locale()),grid=modal.querySelector(".debug-card-grid"),cards=Array.from(grid?.querySelectorAll?.(".debug-stat")||[]),versionCard=cards.find(card=>String(card.querySelector("small")?.textContent||"").trim()==="VERSION");
           const internalWorld=versionCard?.querySelector("span");if(internalWorld&&!internalWorld.dataset.v06027Internal){const raw=String(internalWorld.textContent||"").trim();setText(internalWorld,`${labels.internalWorld}: ${raw||"—"}`);internalWorld.dataset.v06027Internal="true"}
           const view=v06027DebugPlayerView({locale:locale(),world:root.querySelector?.("#worldName")?.textContent,location:root.querySelector?.("#location")?.textContent}),card=playerViewCard(grid,versionCard);
           if(card){setText(card.querySelector("small"),view.heading);setText(card.querySelector("strong"),`${view.worldLabel}: ${view.world}`);setText(card.querySelector("span"),`${view.locationLabel}: ${view.location}`)}
           for(const row of modal.querySelectorAll(".debug-table tbody tr")){const cells=row.querySelectorAll("td");if(cells.length<4||String(cells[2]?.textContent||"").trim()!=="GAME_STATE_BASELINE")continue;const detail=cells[3],raw=String(detail.textContent||"").replace(/\s*·\s*baseline(?:（内部状態）|（內部狀態）|\s*\(internal state\))?\s*$/u,"").trim();setText(detail,`${raw||"?"} · ${labels.baselineInternal}`)}
           return true
          }
          let queued=false;function queue(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;repairV06027DebugVisibilityBoundary(document)})}
          document.addEventListener("click",event=>{if(event.target instanceof Element&&event.target.closest("#debugBtn,#debugRefresh"))queue()},true);
          new MutationObserver(queue).observe(document.documentElement,{subtree:true,childList:true});
          document.addEventListener("DOMContentLoaded",queue,{once:true});
          EOF
          cat > test/v06027-debug-visibility-boundary.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          import {v06027DebugBoundaryLabels,v06027DebugPlayerView} from "../src/v06027-debug-visibility.js";
          test("v0.60.27 labels Debug raw canon separately from the player-visible HUD projection",()=>{
           const labels=v06027DebugBoundaryLabels("ja"),view=v06027DebugPlayerView({locale:"ja",world:"未知の世界",location:"目の前の見知らぬ道"});
           assert.equal(labels.internalWorld,"内部Canon世界");assert.equal(labels.baselineInternal,"baseline（内部状態）");assert.deepEqual(view,{heading:"プレイヤー表示",worldLabel:"世界",locationLabel:"現在地",world:"未知の世界",location:"目の前の見知らぬ道"})
          });
          test("v0.60.27 documents the source boundary: Debug baseline is raw state while HUD is visibility-projected",async()=>{
           const [app,runtime,index,pkg,version]=await Promise.all([readFile(new URL("../app.js",import.meta.url),"utf8"),readFile(new URL("../src/v06027-runtime-ui-hotfix.js",import.meta.url),"utf8"),readFile(new URL("../index.html",import.meta.url),"utf8"),readFile(new URL("../package.json",import.meta.url),"utf8"),readFile(new URL("../src/version.js",import.meta.url),"utf8")]);
           assert.match(app,/location:String\(state\.player\?\.location\|\|state\.world\?\.state\?\.location\|\|""\)/);assert.match(app,/playerVisibleLocationName\(gameState\)/);assert.match(app,/gameState\.player\?\.worldNameKnown/);
           assert.match(runtime,/内部Canon世界|v06027DebugBoundaryLabels/);assert.match(runtime,/GAME_STATE_BASELINE/);assert.match(runtime,/#worldName/);assert.match(runtime,/#location/);
           assert.match(index,/v06027-runtime-ui-hotfix\.js\?v=60027/);assert.match(index,/"\.\/src\/version\.js\?v=60010":"\.\/src\/version\.js\?v=60027"/);assert.equal(JSON.parse(pkg).version,"0.60.27");assert.match(version,/APP_VERSION="0\.60\.27"/)
          });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f"missing replacement in {path}: {old}")
              s=s.replace(old,new) if count is None else s.replace(old,new,count)
              p.write_text(s)
          replace("package.json", '"version": "0.60.26"', '"version": "0.60.27"')
          replace("src/version.js", 'APP_VERSION="0.60.26"', 'APP_VERSION="0.60.27"')
          replace("index.html", '"./src/version.js?v=60010":"./src/version.js?v=60026"', '"./src/version.js?v=60010":"./src/version.js?v=60027"')
          replace("index.html", '<script type="module" src="./src/v06024-runtime-ui-hotfix.js?v=60024"></script>', '<script type="module" src="./src/v06027-runtime-ui-hotfix.js?v=60027"></script>')
          wf=Path(".github/workflows/pages.yml"); s=wf.read_text(); s=s.replace("Focused v0.60.26 regressions","Focused v0.60.27 regressions"); s=s.replace("run: node --test test/v06025-observation-narrative-regression.test.js","run: node --test test/v06027-debug-visibility-boundary.test.js test/v06025-observation-narrative-regression.test.js"); s=s.replace("Verify deployed v0.60.26 source and rendered badge","Verify deployed v0.60.27 source and rendered badge"); s=s.replace('version_url="${site}src/version.js?v=60026"','version_url="${site}src/version.js?v=60027"'); s=s.replace("APP_VERSION=\"0.60.26\"","APP_VERSION=\"0.60.27\""); s=s.replace("v0\\.60\\.26</div>","v0\\.60\\.27</div>"); wf.write_text(s)
          # Current-release assertions only; feature-origin names such as the v0.60.26 OBSERVE/TRAVEL test remain unchanged.
          targets=["test/version-0551-release.test.js","test/version-ui.test.js","test/v06019-ja-manual-regressions.test.js","test/v06021-ja-manual-regressions.test.js","test/v06023-ja-weather-helper-background-regressions.test.js","test/v06015-ja-live-regressions.test.js","test/v06014-manual-regressions.test.js","test/v06011-ja-runtime-coherence.test.js","test/v06024-stale-weather-ja-ui-regressions.test.js","test/v06025-observation-narrative-regression.test.js"]
          for name in targets:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text()
              t=t.replace('through the v0.60.26 release','through the v0.60.27 release').replace('through v0.60.26','through v0.60.27').replace('v0.60.26 wiring','v0.60.27 wiring')
              t=t.replace('JSON.parse(pkgText).version,"0.60.26"','JSON.parse(pkgText).version,"0.60.27"').replace('pkg.version,"0.60.26"','pkg.version,"0.60.27"').replace('/APP_VERSION="0\\.60\\.26"/','/APP_VERSION="0\\.60\\.27"/')
              t=t.replace('v06024-runtime-ui-hotfix\\.js\\?v=60024','v06027-runtime-ui-hotfix\\.js\\?v=60027')
              p.write_text(t)
          # Canonical release-contract files intentionally advance their release name/version.
          for name in ["test/version-0551-release.test.js","test/version-ui.test.js"]:
              p=Path(name); t=p.read_text().replace("v0.60.26 release contract","v0.60.27 release contract").replace("v0.60.26 is the canonical app and browser cache release","v0.60.27 is the canonical app and browser cache release"); p.write_text(t)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json src/version.js index.html src/v06027-debug-visibility.js src/v06027-runtime-ui-hotfix.js test/v06027-debug-visibility-boundary.test.js .github/workflows/pages.yml test
          git commit -m "fix: clarify Debug internal canon versus player view"
          git push origin HEAD:fix/v06027-debug-visibility-boundary
