name: v0.57.19 final review

on:
  push:
    branches:
      - feat/v0.57.19-player-facing-consistency

permissions:
  contents: write

jobs:
  final-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Run focused player-facing regressions
        run: node --test test/v05719-player-facing-consistency.test.js
      - name: Run non-download regression suite
        run: npm run test:nondownload
      - name: Check diff
        run: git diff --check
      - name: Remove temporary workflow after validation
        run: |
          rm .github/workflows/v05719-final-review.yml
          git config user.name "elyndra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize v0.57.19 validation"
          git push origin HEAD:feat/v0.57.19-player-facing-consistency
