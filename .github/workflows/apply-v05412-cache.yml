name: Apply v0.54.12 cache edges

on:
  push:
    branches: [fix/v05412-runtime-schema-normalization]
    paths: [.github/workflows/apply-v05412-cache.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v05412-runtime-schema-normalization
      - name: Align dependency cache edges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/ai-client.js')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('./turn-outcome.js?v=54008','./turn-outcome.js?v=54012'),
            ('./ai-runtime-contracts.js?v=54008','./ai-runtime-contracts.js?v=54012'),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing ai-client cache marker '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          for f in Path('test').glob('*.js'):
              s=f.read_text(encoding='utf-8')
              s=s.replace('turn-outcome\\.js\\?v=54008','turn-outcome\\.js\\?v=54012')
              s=s.replace('ai-runtime-contracts\\.js\\?v=54008','ai-runtime-contracts\\.js\\?v=54012')
              s=s.replace('turn-outcome.js?v=54008','turn-outcome.js?v=54012')
              s=s.replace('ai-runtime-contracts.js?v=54008','ai-runtime-contracts.js?v=54012')
              f.write_text(s,encoding='utf-8')

          Path('.github/workflows/apply-v05412-cache.yml').unlink()
          PY
          git config user.name "Elyndra Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: align v0.54.12 dependency cache edges"
          git push origin HEAD:fix/v05412-runtime-schema-normalization
