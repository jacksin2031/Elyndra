name: v0.60.30 observation progress dev
on:
  push:
    branches: [fix/v06030-observation-progress]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-js.mjs
      - run: node --test test/v06030-observation-progress-regression.test.js test/v06025-observation-narrative-regression.test.js test/v0561-runtime-grounding.test.js test/contextual-actions.test.js test/runtime-visibility.test.js
